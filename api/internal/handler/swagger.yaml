          description: Exempt RFC1918 ranges from every rule.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    GlobalURIBlockConfig:
      type: object
      properties:
        enabled:
          type: boolean
        rules:
          type: array
          items:
            type: object
            properties:
              pattern:
                type: string
              is_regex:
                type: boolean
              action:
                type: string
                enum: [block, challenge]
              description:
                type: string
    Fail2banConfig:
      type: object
      description: Per-host fail2ban-style auto-ban configuration. It has no global default and therefore no disable_global field.
      properties:
        id:
          type: string
          format: uuid
        proxy_host_id:
          type: string
          format: uuid
        enabled:
          type: boolean
        max_retries:
          type: integer
          minimum: 1
        find_time:
          type: integer
          description: Detection window in seconds.
        ban_time:
          type: integer
          description: Ban duration in seconds; 0 = permanent.
        fail_codes:
          type: string
          description: Comma-separated HTTP status codes that count as a failure, e.g. "401,403".
        action:
          type: string
          enum: [block, log, notify]
          description: Only `log` is special-cased — it records the would-be ban and does not ban. Every other value (including `block` and `notify`) inserts the ban.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    LogSettings:
      type: object
      properties:
        id:
          type: string
          format: uuid
        retention_days:
          type: integer
          description: Age cut-off used by POST /logs/cleanup and the cleanup scheduler
        max_logs_per_type:
          type: integer
          format: int64
          description: Optional row cap per log type; absent when unlimited
        auto_cleanup_enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    GlobalWAF:
      type: object
      description: |
        The singleton global WAF default. Inherited by proxy hosts that have
        `waf_use_global=true`; those hosts' own `waf_*` columns are overwritten
        by these values at config generation time.
      properties:
        id:
          type: string
          format: uuid
          description: Empty string when no row has been persisted yet
        enabled:
          type: boolean
          description: When false, an inheriting host runs with WAF off
        mode:
          type: string
          enum: [detection, blocking]
          description: |
            `detection` logs only, `blocking` rejects. Not validated by the API
            or the database — any string is stored, and nginx decides what to do
            with it.
        paranoia_level:
          type: integer
          minimum: 1
          maximum: 4
          description: OWASP CRS paranoia level; database CHECK enforces 1-4
        anomaly_threshold:
          type: integer
          minimum: 1
          maximum: 100
          description: CRS inbound anomaly score at which a request is actioned; database CHECK enforces 1-100
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UpdateGlobalWAF:
      type: object
      description: |
        Partial update of the global WAF default. Sentinels differ per field
        because only `enabled` is nullable.
      properties:
        enabled:
          type: boolean
          description: Omit to keep the stored value
        mode:
          type: string
          enum: [detection, blocking]
          description: Omit or send `""` to keep the stored value
        paranoia_level:
          type: integer
          minimum: 1
          maximum: 4
          description: Omit or send `0` to keep the stored value; out-of-range values are rejected by the database
        anomaly_threshold:
          type: integer
          minimum: 1
          maximum: 100
          description: Omit or send `0` to keep the stored value; out-of-range values are rejected by the database
    GlobalGeoRestriction:
      type: object
      description: |
        The singleton global GeoIP default. Applies to hosts that neither
        override it (own geo row with `enabled=true`) nor disable it
        (`disable_global=true` on their geo row).
      properties:
        id:
          type: string
          format: uuid
          description: Empty string when no row has been persisted yet
        enabled:
          type: boolean
          description: When false, inheriting hosts get no geo blocking
        mode:
          type: string
          enum: [whitelist, blacklist]
          description: '`whitelist` allows only `countries`; `blacklist` blocks them'
        countries:
          type: array
          items:
            type: string
          description: ISO 3166-1 alpha-2 codes
        allowed_ips:
          type: array
          items:
            type: string
          description: |
            IPs/CIDRs that bypass geo blocking. For an inheriting host the
            effective list is this list unioned with the host's own
            `allowed_ips` (host entries first, duplicates removed) — the only
            field in any of the globals that merges rather than replaces.
        allow_private_ips:
          type: boolean
          description: |
            Exempt clients whose GeoIP country code resolves to `--` — private
            RFC1918 addresses, but also any address the GeoIP database cannot
            map to a country.
        allow_search_bots:
          type: boolean
          description: Exempt known search engine crawlers from geo blocking
        challenge_mode:
          type: boolean
          description: Serve a CAPTCHA challenge instead of blocking outright
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UpdateGlobalGeoRestriction:
      type: object
      description: Partial update of the global geo default; omitted fields keep their stored value.
      properties:
        enabled:
          type: boolean
        mode:
          type: string
          enum: [whitelist, blacklist]
          description: Any other value is rejected with 400
        countries:
          type: array
          items:
            type: string
          description: Replaces the stored list when present; send `[]` to clear, omit to keep
        allowed_ips:
          type: array
          items:
            type: string
          description: Replaces the stored list when present; send `[]` to clear, omit to keep
        allow_private_ips:
          type: boolean
        allow_search_bots:
          type: boolean
        challenge_mode:
          type: boolean
    GlobalBotFilter:
      type: object
      description: |
        The singleton global bot filter default. Applies to hosts that neither
        override it (own bot filter row with `enabled=true`) nor disable it
        (`disable_global=true` on that row). Inheriting hosts take every field
        from here; nothing from the host row is merged in.
      properties:
        id:
          type: string
          format: uuid
          description: Empty string when no row has been persisted yet
        enabled:
          type: boolean
        block_bad_bots:
          type: boolean
          description: Block the built-in bad-bot user agent list (see `GET /bots/known`)
        block_ai_bots:
          type: boolean
          description: Block the built-in AI crawler user agent list
        allow_search_engines:
          type: boolean
          description: Exempt the built-in search engine and link-preview bot list
        block_suspicious_clients:
          type: boolean
          description: Block generic HTTP client libraries (curl, python-requests, headless browsers, …)
        custom_blocked_agents:
          type: string
          description: Additional user agent patterns to block
        custom_allowed_agents:
          type: string
          description: Additional user agent patterns to exempt
        challenge_suspicious:
          type: boolean
          description: |
            Stored and inherited, but currently inert — no nginx template reads
            it, so setting it changes nothing about how suspicious clients are
            handled (they are still blocked with 403 when
            `block_suspicious_clients` is on).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UpdateGlobalBotFilter:
      type: object
      description: |
        Partial update of the global bot filter default. Every field is
        nullable, so any omitted field keeps its stored value and `""` really
        does clear a custom agent list.
      properties:
        enabled:
          type: boolean
        block_bad_bots:
          type: boolean
        block_ai_bots:
          type: boolean
        allow_search_engines:
          type: boolean
        block_suspicious_clients:
          type: boolean
        custom_blocked_agents:
          type: string
        custom_allowed_agents:
          type: string
        challenge_suspicious:
          type: boolean
          description: Persisted but currently inert — no nginx template reads it
    GlobalRateLimit:
      type: object
      description: |
        The singleton global rate limit default. Applies to hosts that neither
        override it (own rate limit row with `enabled=true`) nor disable it
        (`disable_global=true` on that row). Only the values are inherited — an
        inheriting host still gets its own nginx `limit_req` zone.
      properties:
        id:
          type: string
          format: uuid
          description: Empty string when no row has been persisted yet
        enabled:
          type: boolean
        requests_per_second:
          type: integer
        burst_size:
          type: integer
        zone_size:
          type: string
          description: nginx shared memory zone size, e.g. `10m`
        limit_by:
          type: string
          enum: [ip, uri, ip_uri]
          description: Rate limit key. Not validated by the API or the database.
        limit_response:
          type: integer
          description: HTTP status returned to a throttled client, e.g. 429
        whitelist_ips:
          type: string
          description: IPs/CIDRs exempt from the limit
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UpdateGlobalRateLimit:
      type: object
      description: |
        Partial update of the global rate limit default. `enabled` and
        `whitelist_ips` are nullable: numeric fields are ignored when `<= 0` and
        other string fields when empty. Omitting `whitelist_ips` keeps the stored
        list; sending `""` clears it.
      properties:
        enabled:
          type: boolean
          description: Omit to keep the stored value
        requests_per_second:
          type: integer
          description: Omit or send `0` to keep the stored value
        burst_size:
          type: integer
          description: Omit or send `0` to keep the stored value
        zone_size:
          type: string
          description: Omit or send `""` to keep the stored value
        limit_by:
          type: string
          enum: [ip, uri, ip_uri]
          description: Omit or send `""` to keep the stored value
        limit_response:
          type: integer
          description: Omit or send `0` to keep the stored value
        whitelist_ips:
          type: string
          nullable: true
          description: >-
            Comma- or newline-separated IPs and CIDR ranges exempt from the
            limit. Omit to keep the stored list, send "" to clear it. Invalid
            entries are rejected with 400.
    GlobalSecurityHeaders:
      type: object
      description: |
        The singleton global security headers default. Applies to hosts that
        neither override it (own security headers row with `enabled=true`) nor
        disable it (`disable_global=true` on that row). Inheritance is
        all-or-nothing — individual headers are never merged with a host's own.
      properties:
        id:
          type: string
          format: uuid
          description: Empty string when no row has been persisted yet
        enabled:
          type: boolean
        hsts_enabled:
          type: boolean
        hsts_max_age:
          type: integer
          description: Strict-Transport-Security max-age in seconds
        hsts_include_subdomains:
          type: boolean
        hsts_preload:
          type: boolean
        x_frame_options:
          type: string
          enum: [DENY, SAMEORIGIN, ""]
          description: |
            Emitted verbatim as the `X-Frame-Options` value; empty means the
            header is not emitted. Neither the API nor the database restricts
            the value — these are the values the UI offers.
        x_content_type_options:
          type: boolean
          description: 'When true, emits `X-Content-Type-Options: nosniff`'
        x_xss_protection:
          type: boolean
        referrer_policy:
          type: string
        content_security_policy:
          type: string
        permissions_policy:
          type: string
        custom_headers:
          type: object
          additionalProperties:
            type: string
          description: Extra response headers as name/value pairs
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UpdateGlobalSecurityHeaders:
      type: object
      description: |
        Partial update of the global security headers default. Boolean fields
        are nullable (omit to keep). `hsts_max_age` is ignored when `<= 0` and
        `x_frame_options` / `referrer_policy` when empty.
        `content_security_policy`, `permissions_policy` and `custom_headers` are
        always written from the request, so omitting them clears the stored
        values.
      properties:
        enabled:
          type: boolean
        hsts_enabled:
          type: boolean
        hsts_max_age:
          type: integer
          description: Omit or send `0` to keep the stored value
        hsts_include_subdomains:
          type: boolean
        hsts_preload:
          type: boolean
        x_frame_options:
          type: string
          enum: [DENY, SAMEORIGIN, ""]
          description: Omit or send `""` to keep the stored value; any string is accepted and stored as-is
        x_content_type_options:
          type: boolean
        x_xss_protection:
          type: boolean
        referrer_policy:
          type: string
          description: Omit or send `""` to keep the stored value
        content_security_policy:
          type: string
          description: Always overwrites — omitting this field clears the stored value
        permissions_policy:
          type: string
          description: Always overwrites — omitting this field clears the stored value
        custom_headers:
          type: object
          additionalProperties:
            type: string
          description: Always overwrites — omitting this field clears the stored headers
    GlobalCloudProviders:
      type: object
      description: |
        The singleton global cloud provider blocking default. There is no
        `enabled` flag: this default is active only while `blocked_providers` is
        non-empty. It applies to hosts whose own `blocked_providers` is empty
        and which do not set `cloud_disable_global=true`.
      properties:
        id:
          type: string
          format: uuid
          description: Empty string when no row has been persisted yet
        blocked_providers:
          type: array
          items:
            type: string
          description: Cloud provider slugs (see `GET /cloud-providers`); empty means this default blocks nothing
        challenge_mode:
          type: boolean
          description: Serve a CAPTCHA challenge instead of blocking outright
        allow_search_bots:
          type: boolean
          description: Exempt known search engine crawlers from cloud IP blocking
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UpdateGlobalCloudProviders:
      type: object
      description: |
        Full replacement of the global cloud provider blocking default — no
        field is nullable, so anything omitted is stored as its zero value
        (`false` / empty list). Send the complete object.
      properties:
        blocked_providers:
          type: array
          items:
            type: string
          description: Omitted or null is stored as an empty list, which disables this default
        challenge_mode:
          type: boolean
          description: Omitted is stored as false
        allow_search_bots:
          type: boolean
          description: Omitted is stored as false
    CloudflareTunnel:
      type: object
      description: |
        Cloudflare Tunnel settings singleton, as returned by the API. The stored
        connector token is never included.
      properties:
        id:
          type: string
          format: uuid
          description: Empty string when no row has been persisted yet
        enabled:
          type: boolean
        mode:
          type: string
          enum: [token, managed]
          description: Always `token` in the current implementation; `managed` is reserved
        has_token:
          type: boolean
          description: Whether a connector token is stored
        token_masked:
          type: string
          description: First 4 characters plus `****`, or `****` for tokens of 4 characters or fewer, or `""` when unset. Not usable as a token.
        origin_service_url:
          type: string
          description: HTTPS origin URL to enter as the Public Hostname service in the Cloudflare dashboard, built from the proxy's configured HTTPS port
        origin_service_url_http:
          type: string
          description: HTTP variant, for hosts served without SSL
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UpdateCloudflareTunnel:
      type: object
      description: Partial update of the tunnel settings singleton.
      properties:
        enabled:
          type: boolean
          description: Omit to keep the stored value. Enabling fails with 400 unless a valid token is stored or supplied here.
        token:
          type: string
          description: |
            Omit to keep the stored token; send a value to replace it. Must be
            base64url characters only and at most 4096 bytes. `""` is accepted
            only when the result is a disabled tunnel.
    TunnelStatus:
      type: object
      description: Connector runtime state, recomputed at most every 15 seconds.
      properties:
        state:
          type: string
          enum: [disabled, starting, connected, error]
        connections:
          type: integer
          description: Registered connector connections; 0 unless `state` is `connected`
    GlobalURIBlock:
      type: object
      description: |
        The global URI block singleton. Its enabled rules are prepended to every
        host's own URI block rules (duplicates by `pattern` + `match_type` are
        dropped), its `exception_ips` are unioned with the host's, and
        `allow_private_ips` is ORed with the host's — hosts cannot opt out.
      properties:
        id:
          type: string
          format: uuid
        enabled:
          type: boolean
          description: When false the global rules are not merged into any host
        rules:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              pattern:
                type: string
              match_type:
                type: string
                enum: [exact, prefix, regex]
                description: 'Maps to nginx `location =` / `location ^~` / `location ~*`'
              description:
                type: string
              enabled:
                type: boolean
                description: Disabled rules stay stored but are not merged into host configs
        exception_ips:
          type: array
          items:
            type: string
          description: IPs/CIDRs allowed to reach blocked URIs
        allow_private_ips:
          type: boolean
          description: Exempt RFC1918 ranges; ORed with each host's own setting, so enabling here cannot be undone per host
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AddGlobalURIBlockRule:
      type: object
      description: A single rule appended to the global URI block list.
      required:
        - pattern
      properties:
        pattern:
          type: string
          description: URI pattern; required
        match_type:
          type: string
          enum: [exact, prefix, regex]
          default: prefix
          description: Defaults to `prefix` when omitted or empty. `regex` patterns are compiled up front and a compile failure returns 400.
        description:
          type: string
        enabled:
          type: boolean
          default: true
          description: Omit to store the rule enabled
    CurrentUser:
      type: object
      description: |
        What GET /auth/me returns when the authorizer is wired: a hand-built object, not
        the full User. It adds effective_permissions and is_superuser and drops
        created_at, updated_at and last_login_ip. Fields backed by pointers appear as
        explicit nulls here rather than being omitted.
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        role:
          type: string
          enum: [admin, user]
        role_id:
          type: string
          format: uuid
          nullable: true
        language:
          type: string
        font_family:
          type: string
        is_initial_setup:
          type: boolean
        must_change_password:
          type: boolean
        totp_enabled:
          type: boolean
        last_login_at:
          type: string
          format: date-time
          nullable: true
        login_count:
          type: integer
        effective_permissions:
          type: array
          description: The EXPANDED `area:verb` set actually enforced for this caller, after legacy-scope implications and the verb hierarchy (delete implies write implies read). For a superuser this is every area permission. Convenience for hiding unreachable UI — the server stays the authority.
          items:
            type: string
            example: proxy:write
        is_superuser:
          type: boolean
          description: True when the account's role bypasses permission checks entirely.
    AuthStatus:
      type: object
      properties:
        authenticated:
          type: boolean
        is_initial_setup:
          type: boolean
          description: When unauthenticated, whether the install still needs its first credential change; when authenticated, the caller's own flag.
        user:
          $ref: '#/components/schemas/User'
    LoginResponse:
      type: object
      description: |
        Returned by POST /auth/login and POST /auth/verify-2fa. Which fields are present
        depends on the outcome: a completed login carries `token` and `user`, while a login
        that still needs 2FA carries only `requires_2fa` and `temp_token`. `is_initial_setup`
        has no omitempty, so it is always serialised — it reads `false` on the 2FA leg
        regardless of the account's real flag.
      properties:
        token:
          type: string
          description: 'Session token for the `Authorization: Bearer <token>` header. Absent when requires_2fa is true.'
        user:
          $ref: '#/components/schemas/User'
        is_initial_setup:
          type: boolean
        requires_2fa:
          type: boolean
          description: Present and true only when the account has 2FA enabled and no totp_code was supplied.
        temp_token:
          type: string
          description: Short-lived token to pass to POST /auth/verify-2fa. Only present alongside requires_2fa.
    AccountInfo:
      type: object
      description: Returned by GET /auth/account for the calling account.
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        role:
          type: string
        language:
          type: string
        font_family:
          type: string
        totp_enabled:
          type: boolean
        last_login_at:
          type: string
          format: date-time
        last_login_ip:
          type: string
        login_count:
          type: integer
        created_at:
          type: string
          format: date-time
    Setup2FAResponse:
      type: object
      description: Enrolment material from POST /auth/2fa/setup. Nothing is active until POST /auth/2fa/enable confirms a code.
      properties:
        secret:
          type: string
          description: Base32 TOTP secret.
        qr_code_url:
          type: string
          description: otpauth:// URL to render as a QR code.
        backup_codes:
          type: array
          description: One-time recovery codes; shown only here.
          items:
            type: string
    LanguageSetting:
      type: object
      description: Body and response of GET/PUT /auth/language.
      properties:
        language:
          type: string
          enum: [ko, en]
    FontFamilySetting:
      type: object
      description: Body and response of GET/PUT /auth/font. GET may return an empty string for an account that never set one; PUT accepts only the listed values.
      properties:
        font_family:
          type: string
          enum: [system, gowun-batang, noto-sans-kr, pretendard, inter]
    PermissionArea:
      type: object
      description: |
        One row of the role editor. The model carries no JSON tags, so the field names are
        capitalised exactly as shown. Verbs differ per area because the underlying routes
        do — waf has no delete, backup has create/restore instead of write.
      properties:
        Key:
          type: string
          enum: [dashboard, proxy, redirect, waf, access, authprovider, certificate, dnsprovider, ddns, logs, audit, settings, backup, apitoken, user, role]
        Verbs:
          type: array
          items:
            type: string
            enum: [read, write, delete, create, restore]
    Role:
      type: object
      description: A named permission set. Permissions are `area:verb` strings; delete implies write implies read within an area, and create/restore imply read.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        is_superuser:
          type: boolean
          description: A superuser role carries NO permission rows and bypasses the check entirely, so areas added in a later release are covered without touching stored data. Cannot be set through the API.
        is_builtin:
          type: boolean
          description: Seeded roles (builtin.administrator, builtin.operator, builtin.viewer). They cannot be updated or deleted.
        permissions:
          type: array
          nullable: true
          description: The role's STORED `area:verb` rows. Null/empty for a superuser role, which reaches everything without any rows.
          items:
            type: string
            example: certificate:write
        user_count:
          type: integer
          description: How many accounts hold this role. A delete is refused while this is non-zero.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateRoleRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 64
          description: 1-64 characters, no control characters, and the `builtin.` prefix is reserved.
        description:
          type: string
        permissions:
          type: array
          description: Every entry must be an `area:verb` string from GET /permission-areas; anything else, including the `*` wildcard, is rejected with 400. Fifteen of those strings are spelled the same as the legacy API-token scopes (`settings:write`, `proxy:read`, …) and are accepted for that reason.
          items:
            type: string
    UpdateRoleRequest:
      type: object
      description: Partial update — omitted fields are left unchanged. Supplying `permissions` replaces the role's set wholesale.
      properties:
        name:
          type: string
          maxLength: 64
        description:
          type: string
        permissions:
          type: array
          items:
            type: string
    UserSummary:
      type: object
      description: The administrative view of an account. Never carries the password hash, TOTP secret or backup codes.
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        role_id:
          type: string
          format: uuid
          nullable: true
        role_name:
          type: string
        legacy_role:
          type: string
          enum: [admin, user]
          description: The users.role column, kept in sync with the role's is_superuser so the `server reset-password` CLI can still find administrators. Not used for authorization.
        is_superuser:
          type: boolean
        totp_enabled:
          type: boolean
        must_change_password:
          type: boolean
        last_login_at:
          type: string
          format: date-time
        login_count:
          type: integer
        created_at:
          type: string
          format: date-time
        api_token_count:
          type: integer
          description: Deleting the account cascades its API tokens; this is what the confirmation shows so automation is not cut silently.
    UserDetail:
      allOf:
        - $ref: '#/components/schemas/UserSummary'
        - type: object
          description: GET /users/{id} — the summary plus sign-in history, sessions, tokens and both permission views.
          properties:
            email:
              type: string
              description: |
                The address SSO links this account by. A value ending in `@localhost` was
                synthesised by NPG because the account was never given one, and can never
                match an identity provider — see `PUT /users/{id}/email`.
            last_login_ip:
              type: string
            totp_verified_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
            effective_permissions:
              type: array
              description: The EXPANDED set actually enforced — legacy coarse scopes reach more than they list, and a superuser holds every area permission with no stored rows at all.
              items:
                type: string
            role_permissions:
              type: array
              description: The role's STORED rows, before expansion. Compare with effective_permissions.
              items:
                type: string
            tokens:
              type: array
              items:
                $ref: '#/components/schemas/UserTokenInfo'
            active_sessions:
              type: integer
            linked_identities:
              type: array
              description: SSO providers this account may sign in through, so a federated account is distinguishable from a local one.
              items:
                $ref: '#/components/schemas/UserIdentityInfo'
    UserTokenInfo:
      type: object
      description: The API-token view inside a user's detail panel. The token hash never appears — only the prefix.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        token_prefix:
          type: string
        permissions:
          type: array
          items:
            type: string
        allowed_ips:
          type: array
          items:
            type: string
        expires_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        last_used_ip:
          type: string
        use_count:
          type: integer
          format: int64
        is_active:
          type: boolean
        revoked_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    UserIdentityInfo:
      type: object
      description: An identity provider an account can sign in through.
      properties:
        provider_name:
          type: string
        provider_slug:
          type: string
        email:
          type: string
        last_login_at:
          type: string
          format: date-time
          nullable: true
        linked_at:
          type: string
          format: date-time
    PublicSSOProvider:
      type: object
      description: All an unauthenticated login screen may learn about a provider. Issuer, client id and allowlist detail stay server-side.
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
    SSOProvider:
      type: object
      description: |
        An OIDC provider for signing in to the NPG panel itself. This is NOT ForwardAuth:
        auth_providers protect a proxied host, an SSOProvider lets someone sign in here.
        The two never share a record.
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          description: 1-32 characters of a-z, 0-9 and '-', starting with a letter or digit. Appears in the login URLs /auth/sso/{slug}/start and /callback.
        name:
          type: string
        issuer_url:
          type: string
          format: uri
        client_id:
          type: string
        client_secret:
          type: string
          description: Always the literal `********` on read — the stored secret is never returned. Send that same placeholder back on update to leave it unchanged.
          example: '********'
        scopes:
          type: string
          description: Space-separated; must contain `openid`. Defaults to "openid profile email".
        callback_base_url:
          type: string
          description: Explicit public origin used to build the redirect_uri. Empty means the origin of the incoming request is used instead.
        enabled:
          type: boolean
        allow_jit:
          type: boolean
        trust_provider_email:
          type: boolean
          default: false
          description: |
            Link an SSO identity to an EXISTING account even when the provider
            does not assert `email_verified`. Off by default.

            Exists because Authentik 2025.10 changed its default email scope
            mapping to send `email_verified: false`, which refuses every such
            link. Enabling it means you vouch for the provider's addresses:
            anyone able to set an arbitrary email address there can sign in as
            the NPG account holding it.
          description: Create an NPG account on first successful sign-in. Requires at least one allowlist entry (allowed_emails, allowed_email_domains or required_group) and a default_role_id — an IdP such as Google authenticates every account on earth, so unrestricted provisioning would publish the panel.
        allowed_email_domains:
          type: array
          description: Bare domains, lower-cased, without a leading '@'. Combined with allowed_emails as OR.
          items:
            type: string
        allowed_emails:
          type: array
          description: Full addresses, lower-cased. With BOTH email lists empty, a required_group becomes the only gate; with both empty and no required_group, nobody passes.
          items:
            type: string
        group_claim:
          type: string
          description: Which ID-token claim carries group membership. Defaults to `groups`.
        required_group:
          type: string
          description: When set, the identity must also carry this group — the allowlist rule is (email OR domain) AND required group.
        default_role_id:
          type: string
          format: uuid
          nullable: true
          description: Role given to an account this provider creates or, when no group mapping matches, keeps.
        group_role_mappings:
          type: array
          description: Evaluated in order; the first matching group decides the role, and a role decided this way is re-applied on every later login.
          items:
            $ref: '#/components/schemas/GroupRoleMapping'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        callback_url:
          type: string
          description: Derived, not stored — the exact redirect_uri to register at the identity provider, built from callback_base_url or the origin of your request.
        linked_users:
          type: integer
          description: How many accounts are attached, so a delete can say what it would detach. Deleting a provider unlinks accounts but never deletes them. Counted only by GET /sso-providers; the create and update responses always report 0 because their re-read does not run the count.
    GroupRoleMapping:
      type: object
      properties:
        group:
          type: string
        role_id:
          type: string
          format: uuid
    SSOProviderRequest:
      type: object
      description: |
        Body for both POST /sso-providers and PUT /sso-providers/{id} — the same struct.
        The update is applied wholesale, so send every field you want kept.
      required: [slug, name, issuer_url, client_id]
      properties:
        slug:
          type: string
          description: Lower-cased and trimmed by the server. 1-32 characters of a-z, 0-9 and '-'.
        name:
          type: string
          maxLength: 64
        issuer_url:
          type: string
          format: uri
          description: Must be https, except that plain http is accepted for localhost, private/CGNAT/link-local addresses, .local/.internal names and single-label hostnames such as a docker-compose service name.
        client_id:
          type: string
        client_secret:
          type: string
          description: Required on create. On update, `********` or an empty string means "leave the stored secret alone".
        scopes:
          type: string
          description: Space-separated. Empty becomes "openid profile email"; `openid` is mandatory.
        callback_base_url:
          type: string
          description: Optional. Same URL rules as issuer_url. Empty means derive the redirect_uri from the request origin.
        enabled:
          type: boolean
          description: Omitting this field means TRUE, on update as well as create — send `false` explicitly to keep a provider disabled.
        allow_jit:
          type: boolean
        trust_provider_email:
          type: boolean
          default: false
          description: |
            Link an SSO identity to an EXISTING account even when the provider
            does not assert `email_verified`. Off by default.

            Exists because Authentik 2025.10 changed its default email scope
            mapping to send `email_verified: false`, which refuses every such
            link. Enabling it means you vouch for the provider's addresses:
            anyone able to set an arbitrary email address there can sign in as
            the NPG account holding it.
          description: Automatic account creation on first sign-in. Rejected unless at least one of allowed_emails / allowed_email_domains / required_group is set AND default_role_id is set.
        allowed_email_domains:
          type: array
          description: Bare domains such as example.com. Lower-cased and de-duplicated; a leading '@' is stripped. An entry containing '@' or lacking a dot is rejected.
          items:
            type: string
        allowed_emails:
          type: array
          description: Full addresses. Lower-cased and de-duplicated; an entry without '@' is rejected.
          items:
            type: string
        group_claim:
          type: string
          description: Empty becomes `groups`.
        required_group:
          type: string
        default_role_id:
          type: string
          format: uuid
          nullable: true
          description: Must reference an existing role; a dangling id is refused at save time rather than at someone's first login.
        group_role_mappings:
          type: array
          description: Both group and role_id are required on every entry, and each role_id must exist.
          items:
            $ref: '#/components/schemas/GroupRoleMapping'
    SSODiscoveryResult:
      type: object
      description: What POST /sso-providers/test found at the issuer's discovery document. Nothing is stored.
      properties:
        issuer:
          type: string
        authorization_endpoint:
          type: string
        token_endpoint:
          type: string
        scopes_supported:
          type: array
          items:
            type: string
        supports_pkce:
          type: boolean
          description: True when the issuer advertises the S256 code challenge method.
        missing_scopes:
          type: array
          description: Requested scopes the issuer does not list. Only populated when the issuer actually publishes scopes_supported — many omit it and still honour the scopes.
          items:
            type: string
    APITokenWithSecret:
      allOf:
        - $ref: '#/components/schemas/APIToken'
        - type: object
          description: Returned only by POST /api-tokens.
          properties:
            token:
              type: string
              description: The full secret, prefixed `ng_`. Shown exactly once — it is stored only as a SHA-256 hash and cannot be recovered.
              example: ng_0123456789abcdef...
    APITokenUsage:
      type: object
      description: One recorded request made with the token.
      properties:
        id:
          type: string
          format: uuid
        token_id:
          type: string
          format: uuid
        endpoint:
          type: string
        method:
          type: string
        status_code:
          type: integer
        client_ip:
          type: string
        user_agent:
          type: string
        request_body_size:
          type: integer
          format: int64
        response_time_ms:
          type: integer
        created_at:
          type: string
          format: date-time
    NotificationChannelList:
      type: object
      description: |
        Envelope returned by GET /notification-channels. `events` and `timezone`
        are absent when the notification tables are missing.
      properties:
        data:
          type: array
          description: Configured channels, ordered by name, secrets masked.
          items:
            $ref: '#/components/schemas/NotificationChannel'
        events:
          type: array
          description: |
            The server's event catalogue — the complete and only set of keys
            accepted in `events` and `digest_events`. Anything else is rejected
            with `invalid_event`.
          items:
            $ref: '#/components/schemas/NotificationEvent'
        timezone:
          type: object
          description: |
            The zone of the API container's clock, which is what `digest_hour` is
            compared against. It is NOT the browser's zone: on a default install
            (TZ unset) this is UTC, so `digest_hour: 9` fires at 09:00 UTC.
          properties:
            name:
              type: string
              description: Zone abbreviation as the API process sees it, e.g. UTC or KST.
              example: UTC
            offset_minutes:
              type: integer
              description: Offset from UTC in minutes.
              example: 0
    NotificationEvent:
      type: object
      description: One subscribable event. The catalogue is fixed by the server.
      properties:
        key:
          type: string
          enum:
            - cert.renewal_failed
            - cert.renewed
            - ddns.sync_failed
            - ddns.recovered
            - backup.failed
            - nginx.reload_failed
            - auth.login_failed
            - ip.banned
            - sso.login_refused
        severity:
          type: string
          enum: [error, warning, info]
          description: Fixed per event, not operator-configurable.
        batched:
          type: boolean
          description: |
            true when occurrences are coalesced over a window into one message
            with a count. false means edge-triggered on (event, subject): one
            message when it breaks, one when it recovers, nothing in between.
    NotificationChannel:
      type: object
      description: A configured delivery target. Returned with secrets masked.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: 1-64 characters, unique case-insensitively.
        type:
          type: string
          enum: [webhook, discord, telegram]
        enabled:
          type: boolean
          description: |
            The server may turn this off by itself: ten consecutive terminal
            delivery failures disable the channel, and a later success (a passing
            Test) turns it back on.
        config:
          type: object
          additionalProperties:
            type: string
          description: |
            Free-form string map; the meaningful keys depend on `type`.

            webhook — `url` (POST target, http/https), `payload_format` (the
            literal `text` posts the human line as text/plain; any other value,
            including absent, posts the JSON envelope), and any number of
            `header_<Name>` keys, each sent as request header `<Name>` (e.g.
            `header_Authorization`).

            discord — `url` (the webhook URL; it is itself the credential).

            telegram — `bot_token` and `chat_id`. `chat_id` may be rewritten by
            the server when a group is upgraded to a supergroup. Telegram
            channels ignore `header_*` and `payload_format`.

            MASKING: on read, `url` (webhook/discord), `bot_token` (telegram) and
            every non-empty `header_*` value are replaced with the literal
            `********`. `chat_id` is not masked. On update, sending `********`
            for any key means "keep the stored value". On create nothing is
            substituted: `********` is stored verbatim for `bot_token` and
            `header_*`, and is rejected as `url` because it is not a URL.
        events:
          type: array
          description: |
            Events delivered IMMEDIATELY. Together with `digest_events` this is
            the per-event tri-state: key in `events` = immediate, key in
            `digest_events` = summary-only, key in neither = off. A key present
            in both is rejected (`invalid_event`).
          items:
            type: string
        digest_events:
          type: array
          description: |
            Events that are NOT sent immediately but are counted into the daily
            summary. A non-empty list forces `digest_enabled` to true on save.
          items:
            type: string
        rich_format:
          type: boolean
          description: |
            Use the platform's native formatting — a severity-coloured Discord
            embed, a Telegram MarkdownV2 layout. Ignored when `template` is set
            or when the sender composed the body itself (the daily summary), and
            ignored entirely by `webhook`, whose body shape is chosen by
            `config.payload_format`.
        language:
          type: string
          enum: [ko, en]
          description: Language the messages are written in. Empty input becomes `en`.
        dashboard_url:
          type: string
          description: |
            Link appended to the daily summary so its numbers lead somewhere.
            Per channel, and never fetched by NPG. Must start with http:// or
            https:// when set.
        digest_enabled:
          type: boolean
          description: Send a once-daily summary at `digest_hour`.
        digest_hour:
          type: integer
          minimum: 0
          maximum: 23
          description: |
            Hour of day in the API container's zone — see `timezone` in the list
            response. The column defaults to 9, but create and update always
            write the value from the request, so omitting it stores 0 (midnight)
            rather than 9.
        allow_private_target:
          type: boolean
          description: |
            Permit a `url` pointing at a private host. Off by default. The check
            is a literal one on the hostname, not a DNS lookup: it refuses a
            loopback/private/link-local/CGNAT IP literal, `localhost`, a
            `.local` or `.internal` suffix, and any name with no dot in it. It is
            re-run at send time, not only at save time.
        template:
          type: string
          description: |
            Optional message body overriding the generated one. `{{key}}` is
            substituted from the event's fields; an unknown placeholder renders
            empty, since one template serves every event the channel subscribes
            to. Setting it disables `rich_format`.
        last_success_at:
          type: string
          format: date-time
          nullable: true
        last_error_at:
          type: string
          format: date-time
          nullable: true
        last_error:
          type: string
          description: Empty string when there is no recorded failure.
        consecutive_failures:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateNotificationChannel:
      type: object
      description: |
        Body for both POST (create) and PUT (update) — the server uses one type
        for both. PUT is a full replacement: omitted fields take their zero
        value, and an omitted `enabled` becomes true.
      required: [name, type]
      properties:
        name:
          type: string
          maxLength: 64
          description: 1-64 characters after trimming; unique case-insensitively.
        type:
          type: string
          enum: [webhook, discord, telegram]
          description: Lower-cased and trimmed by the server.
        enabled:
          type: boolean
          default: true
          description: Nullable pointer server-side — absent or null means true.
        config:
          type: object
          additionalProperties:
            type: string
          description: |
            Same keys as NotificationChannel.config. Values are trimmed; a key
            with surrounding whitespace is rejected (`invalid_config`).

            webhook/discord require `url` (http or https, public unless
            `allow_private_target`). telegram requires `chat_id`, and requires
            `bot_token` on create.

            On update, a value of `********` is replaced with the stored value
            for that key before validation, so an unchanged secret can be
            round-tripped. Keys omitted from an update are dropped.
        events:
          type: array
          description: |
            Immediate events. Must all be catalogue keys; blanks and duplicates
            are dropped. Either this or `digest_enabled` must end up non-empty,
            otherwise the request is rejected (`invalid_events`).
          items:
            type: string
        digest_events:
          type: array
          description: |
            Summary-only events. Must be catalogue keys, must not also appear in
            `events`, and a non-empty list forces `digest_enabled` to true.
          items:
            type: string
        rich_format:
          type: boolean
        language:
          type: string
          enum: [ko, en]
          default: en
        dashboard_url:
          type: string
          description: Must start with http:// or https:// when non-empty.
        digest_enabled:
          type: boolean
        digest_hour:
          type: integer
          minimum: 0
          maximum: 23
          description: |
            Always written from the request, so omitting it stores 0 (midnight),
            not the column default of 9.
        allow_private_target:
          type: boolean
        template:
          type: string
          description: Optional `{{key}}` body template — see NotificationChannel.template.
    NotificationDelivery:
      type: object
      description: One outbox row — a queued, sent or failed delivery attempt.
      properties:
        id:
          type: integer
          format: int64
        channel_id:
          type: string
          format: uuid
        event_key:
          type: string
          description: Catalogue key, `digest.daily` for the summary, or `test` for a generic test.
        payload:
          $ref: '#/components/schemas/NotificationMessage'
        status:
          type: string
          enum: [queued, sent, failed, digest]
          description: |
            `digest` is an occurrence parked for the daily summary rather than
            sent on its own — the dispatcher never claims those rows, and the
            summary flips them to `sent` once it has counted them. This endpoint
            does not filter by status, so parked rows appear here too.
        attempts:
          type: integer
          description: Delivery is abandoned after 4 attempts.
        next_attempt_at:
          type: string
          format: date-time
        last_error:
          type: string
          description: Empty string when none.
        created_at:
          type: string
          format: date-time
        sent_at:
          type: string
          format: date-time
          nullable: true
    NotificationMessage:
      type: object
      description: The rendered message an adapter turned into one HTTP request.
      properties:
        event:
          type: string
        preformatted:
          type: boolean
          description: |
            Present only when true. Marks a body the sender composed in full (the
            daily summary), which suppresses rich formatting.
        severity:
          type: string
          enum: [error, warning, info, resolved]
          description: |
            `resolved` is used by recovery messages; the catalogue itself never
            declares it.
        text:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
          description: |
            Substitution values for `template`. Deliberately limited — request
            headers, cookies, raw log lines and rule data never appear here.
        at:
          type: string
          format: date-time
    TelegramChat:
      type: object
      description: One conversation a Telegram bot can currently reach.
      properties:
        id:
          type: string
          description: Numeric chat id rendered as a string — paste into `config.chat_id`.
        title:
          type: string
          description: Group/channel title, or the user's first name and username joined.
        type:
          type: string
          description: Telegram's own chat type, e.g. private, group, supergroup, channel.
    NotificationValidationError:
      type: object
      description: |
        400 body for a rejected channel. `error` is always English and names JSON
        fields, so a localised UI should key off `code`.
      properties:
        error:
          type: string
          example: "invalid chat_id: required — message the bot or add it to your group first, then use Detect"
        code:
          type: string
          description: |
            `invalid_<field>` derived from the message, where `<field>` is the
            JSON field or config key at fault — e.g. `invalid_name`,
            `invalid_type`, `invalid_url`, `invalid_bot_token`,
            `invalid_chat_id`, `invalid_event`, `invalid_events`,
            `invalid_config`, `invalid_dashboard_url`, `invalid_language`,
            `invalid_digest_hour`. Absent for errors that are not field
            validations (e.g. a malformed request body).
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, unhealthy]
        version:
          type: string
        database:
          type: string
          enum: [ok, error]
        cache:
          type: string
          enum: [ok, connecting, disabled]
          description: '"disabled" when no cache is configured — NPG runs without one'
        uptime:
          type: string
          description: Go duration string, e.g. "72h3m1.2s"
        timestamp:
          type: string
          format: date-time
    HealthDetailed:
      type: object
      properties:
        version:
          type: string
        uptime_seconds:
          type: integer
          format: int64
        database:
          type: object
          properties:
            connected:
              type: boolean
            access_log_rows_estimate:
              type: integer
              format: int64
            hypertables:
              type: array
              items:
                $ref: '#/components/schemas/HypertableStats'
            hypertables_error:
              type: string
            migration_failures:
              type: integer
              description: >-
                Non-zero when upgrade migrations failed. Migrations are
                warn-and-continue, so a partially migrated install keeps serving and
                surfaces here instead of failing the liveness probe.
            migration_last_error:
              type: string
        cache:
          type: object
          properties:
            ready:
              type: boolean
            log_buffer_size:
              type: integer
              format: int64
        log_collector:
          type: object
          properties:
            access_log_path_configured:
              type: string
            access_log_path_actual:
              type: string
            fallback_active:
              type: boolean
              description: True when the collector is reading a different path than configured
            last_flush_at:
              type: string
              format: date-time
            last_flush_seconds_ago:
              type: integer
              format: int64
            no_flush_since_start:
              type: boolean
              description: >-
                True when the collector has run past its 60s boot probe window without
                flushing a single row — the silent-ingestion-failure signal
            access_last_flush_seconds_ago:
              type: integer
              format: int64
            modsec_last_flush_seconds_ago:
              type: integer
              format: int64
            error_last_flush_seconds_ago:
              type: integer
              format: int64
            pipeline_status:
              type: string
              description: '"unknown" when the canary is not enabled'
            canary_failure_stage:
              type: string
            last_canary_at:
              type: string
              format: date-time
            nginx_status_reachable:
              type: boolean
            auto_heal_attempts:
              type: integer
            auto_heal_exhausted:
              type: boolean
        nginx:
          type: object
          properties:
            host_count:
              type: integer
        nginx_tuning:
          type: object
          description: Omitted when global settings cannot be read
          properties:
            worker_connections:
              type: integer
            keepalive_timeout:
              type: integer
            keepalive_requests:
              type: integer
            open_file_cache_enabled:
              type: boolean
            open_file_cache_max:
              type: integer
            gzip_enabled:
              type: boolean
            brotli_enabled:
              type: boolean
            ssl_early_data_inferred:
              type: boolean
              description: Inferred from the nginx.conf template, not stored in settings
    HypertableStats:
      type: object
      properties:
        name:
          type: string
        compression_enabled:
          type: boolean
        total_chunks:
          type: integer
        compressed_chunks:
          type: integer
        hypertable_size_bytes:
          type: integer
          format: int64
