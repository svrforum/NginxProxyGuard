          format: double
        error_rate_24h:
          type: number
          format: double
        waf_blocked_24h:
          type: integer
          format: int64
        rate_limited_24h:
          type: integer
          format: int64
        bot_blocked_24h:
          type: integer
          format: int64
        banned_ips:
          type: integer
        blocked_requests_24h:
          type: integer
          format: int64
        blocked_unique_ips_24h:
