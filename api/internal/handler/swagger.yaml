        severity/error_message, modsec logs carry the rule_* fields.
      properties:
        id:
          type: string
          format: uuid
        log_type:
          type: string
          enum: [access, error, modsec]
        timestamp:
          type: string
          format: date-time
        host:
          type: string
        client_ip:
          type: string
        geo_country:
          type: string
        geo_country_code:
          type: string
        geo_city:
          type: string
        geo_asn:
          type: string
        geo_org:
          type: string
        request_method:
          type: string
        request_uri:
          type: string
        request_protocol:
          type: string
        status_code:
          type: integer
        body_bytes_sent:
          type: integer
          format: int64
        request_time:
          type: number
          format: double
          description: Seconds
        upstream_response_time:
          type: number
          format: double
        upstream_addr:
          type: string
          description: >-
            Raw nginx $upstream_addr. On retries this is a comma-separated list; the
            last entry is the upstream that finally responded.
        upstream_status:
          type: string
        http_referer:
          type: string
        http_user_agent:
          type: string
        http_x_forwarded_for:
          type: string
        severity:
          type: string
          enum: [debug, info, notice, warn, error, crit, alert, emerg]
        error_message:
          type: string
        rule_id:
          type: integer
          format: int64
        rule_message:
          type: string
        rule_severity:
          type: string
        rule_data:
          type: string
        attack_type:
          type: string
        action_taken:
          type: string
        block_reason:
          type: string
          enum:
            - none
            - waf
            - bot_filter
            - rate_limit
            - geo_block
            - exploit_block
            - banned_ip
            - uri_block
            - cloud_provider_challenge
            - cloud_provider_block
            - access_denied
            - filter_subscription
          description: Which perimeter feature blocked the request; "none" when it was served
        bot_category:
          type: string
          description: bad_bot, ai_bot, suspicious or custom
        exploit_rule:
          type: string
          description: Matched exploit rule id, e.g. SQLI-001
        proxy_host_id:
          type: string
          format: uuid
        raw_log:
          type: string
        created_at:
          type: string
          format: date-time
        is_banned:
          type: boolean
          description: >-
            Computed at read time, not stored: true when this client IP currently has an
            active ban.
