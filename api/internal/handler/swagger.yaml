  # Fail2ban
  # ============================================================================
  /proxy-hosts/{id}/fail2ban:
    get:
      tags: [Security]
      summary: Get fail2ban config for a proxy host
      description: |
        Returns the host's stored fail2ban row. When no row exists a default
        object is synthesized (`enabled` false, `max_retries` 5, `find_time` 600,
        `ban_time` 3600, `fail_codes` "401,403", `action` "block") — it is not
        persisted. Requires the `proxy:read` scope when called with an API token.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProxyHostId'
      responses:
        '200':
          description: Fail2ban configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fail2banConfig'

    put:
      tags: [Security]
      summary: Create or update the fail2ban config
      description: Upsert. Requires the `proxy:write` scope when called with an API token.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProxyHostId'
      requestBody:
        required: true
