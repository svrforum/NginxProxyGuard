              schema:
                $ref: '#/components/schemas/Fail2banConfig'
        '400':
          $ref: '#/components/responses/BadRequest'

    delete:
      tags: [Security]
      summary: Delete the fail2ban config
      description: Requires the `proxy:delete` scope when called with an API token.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProxyHostId'
      responses:
        '204':
          description: Fail2ban config deleted
  /logs:
    get:
      tags: [Logs]
      summary: Query access/error/WAF logs
      description: |
        **Time window**: when `start_time` is omitted the server applies a 24-hour
        window ending now (truncated to the minute). Set `start_time` explicitly to look
        further back.

        **Invalid values are dropped, not rejected**: `log_type`, `severity` and
        `block_reason` outside their enum, and unparseable numbers/timestamps, are
        silently ignored — the response is then *less* filtered than requested, never a
        400. The one exception is `proxy_host_id`: a non-UUID matches nothing.

        **Array parameters** are repeated (`?hosts=a&hosts=b`) and capped at 100 entries;
        extra entries are discarded. `exclude_ips` additionally drops any entry that is
        not a valid IP or CIDR.

        Canary self-test rows (`/__npg_canary`) are always excluded. With
        `log_type=access` the server also excludes `/health`, `/nginx_status`,
        `/.well-known/*` and the localhost/nginx/empty hosts.
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: per_page
          in: query
          description: Clamped to 200; values below 1 become 50.
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
        - name: cursor
          in: query
          description: |
            Opaque keyset token from a previous response's `next_cursor`. Honoured only
            for the default sort; any explicit `sort_by` other than created_at falls
            back to offset pagination and the cursor is ignored.
          schema:
            type: string
        - name: log_type
          in: query
          schema:
            type: string
            enum: [access, error, modsec]
        - name: host
          in: query
          description: Exact match, or prefix wildcard when it starts with `*` (e.g. `*.example.com`).
          schema:
            type: string
        - name: hosts
          in: query
          description: Multi-select variant of `host`; same wildcard rule, OR-combined.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 100
            items:
              type: string
        - name: client_ip
          in: query
          description: Exact IP match.
          schema:
            type: string
        - name: client_ips
          in: query
          description: Multi-select exact IP match.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 100
            items:
              type: string
        - name: uri
          in: query
          description: Case-insensitive substring match on request_uri.
          schema:
            type: string
        - name: uris
          in: query
          description: Multi-select substring match on request_uri, OR-combined.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 100
            items:
              type: string
        - name: user_agent
          in: query
          description: Case-insensitive substring match.
          schema:
            type: string
        - name: user_agents
          in: query
          description: Multi-select substring match, OR-combined.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 100
            items:
              type: string
        - name: method
          in: query
          description: Exact match on the HTTP method.
          schema:
            type: string
        - name: status_code
          in: query
          description: Exact match. Ignored when <= 0.
          schema:
            type: integer
        - name: status_codes
          in: query
          description: Multi-select exact match; non-numeric entries are dropped.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: integer
        - name: severity
          in: query
          description: Error-log severity.
          schema:
            type: string
            enum: [debug, info, notice, warn, error, crit, alert, emerg]
        - name: rule_id
          in: query
          description: ModSecurity rule id, matched as a numeric *prefix* (942 matches 942100).
          schema:
            type: integer
            format: int64
        - name: proxy_host_id
          in: query
          description: A value that is not a valid UUID makes the query match nothing.
          schema:
            type: string
            format: uuid
        - name: geo_country_code
          in: query
          description: Exact ISO 3166-1 alpha-2 match.
          schema:
            type: string
        - name: start_time
          in: query
          description: RFC3339. Defaults to now-24h when omitted or unparseable.
          schema:
            type: string
            format: date-time
        - name: end_time
          in: query
          description: RFC3339. Unparseable values are ignored (no upper bound).
          schema:
            type: string
            format: date-time
        - name: search
          in: query
          description: |
            Free text. IP-looking input is matched against client_ip (plus host, UA,
            URI); all-digit input against rule_id as a prefix (plus URI, error and rule
            messages); otherwise host/UA/URI/error/rule message substrings.
          schema:
            type: string
        - name: min_size
          in: query
          description: Minimum body_bytes_sent. Ignored when <= 0.
          schema:
            type: integer
            format: int64
        - name: max_size
          in: query
          description: Maximum body_bytes_sent. Ignored when <= 0.
          schema:
            type: integer
            format: int64
        - name: min_request_time
          in: query
          description: Minimum request_time in seconds. Ignored when <= 0.
          schema:
            type: number
            format: double
        - name: upstream_addr
          in: query
          description: Substring match — upstream_addr is a comma-separated list on retries.
          schema:
            type: string
        - name: upstream_status
          in: query
          description: Substring match on the raw upstream status string.
          schema:
            type: string
        - name: block_reason
          in: query
          description: Which perimeter feature blocked the request.
          schema:
            type: string
            enum:
              - none
              - waf
              - bot_filter
              - rate_limit
              - geo_block
              - exploit_block
              - banned_ip
              - uri_block
              - cloud_provider_challenge
              - cloud_provider_block
              - access_denied
              - filter_subscription
        - name: bot_category
          in: query
          description: Exact match. Values written by the bot filter are bad_bot, ai_bot, suspicious, custom.
          schema:
            type: string
        - name: exploit_rule
          in: query
          description: Exact match on the exploit rule id (e.g. SQLI-001).
          schema:
            type: string
        - name: exclude_ips
          in: query
          description: |
            Exclude these clients. Entries with a `/` are treated as CIDR ranges;
            entries that parse as neither an IP nor a CIDR are discarded.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 100
            items:
              type: string
        - name: exclude_user_agents
          in: query
          description: Exclude rows whose User-Agent contains any of these.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 100
            items:
              type: string
        - name: exclude_uris
          in: query
          description: Exclude rows whose URI contains any of these.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 100
            items:
              type: string
        - name: exclude_hosts
          in: query
          description: Exclude these hosts (exact match).
          style: form
          explode: true
          schema:
            type: array
            maxItems: 100
            items:
              type: string
        - name: exclude_countries
          in: query
          description: Exclude these country codes (exact match).
          style: form
          explode: true
          schema:
            type: array
            maxItems: 100
            items:
              type: string
        - name: sort_by
          in: query
          description: |
            Unrecognised values fall back to created_at DESC. Only created_at supports
            cursor pagination; the others switch the query to offset pagination.
          schema:
            type: string
            enum: [created_at, timestamp, body_bytes_sent, request_time, status_code, client_ip, host]
            default: created_at
        - name: sort_order
          in: query
          description: Anything other than asc/ASC is treated as descending.
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: |
            Log page. `total` is synthetic (no COUNT(*) is run) and `total_pages` is a
            hint, not an exact count — use `has_more`/`next_cursor` to paginate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogListResponse'

    post:
      tags: [Logs]
      summary: Insert a log entry manually
      description: Administrative ingestion path; requires settings:write, not logs access.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLog'
      responses:
        '201':
          description: Log created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogEntry'
        '400':
          description: Invalid request body
  /logs/stats:
