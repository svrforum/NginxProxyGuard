                    label:
                      type: string
                    color:
                      type: string

  # ============================================================================
  # Raw nginx log files
  # ============================================================================
  /system-settings/log-files:
    get:
      tags: [Logs]
      summary: List raw nginx log files on disk
      description: |
        Symlinks (stdout/stderr) are skipped. `raw_log_enabled` reflects whether nginx
        is writing files at all; when the log directory is unreadable the endpoint still
        returns 200 with an empty list.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Log files, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogFilesResponse'
  /system-settings/log-files/{filename}/download:
    get:
      tags: [Logs]
      summary: Download a raw log file
      security:
        - BearerAuth: []
      parameters:
        - name: filename
          in: path
          required: true
          description: Bare filename. Values containing `/` or `..` are rejected.
          schema:
            type: string
      responses:
        '200':
          description: File contents as an attachment
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid filename, or the target is a symlink
        '404':
          description: File not found
  /system-settings/log-files/{filename}/view:
    get:
      tags: [Logs]
      summary: Preview the tail of a raw log file
      description: |
        Returns the last N lines as one string. `.gz` files are decompressed on the fly.
      security:
        - BearerAuth: []
      parameters:
        - name: filename
          in: path
          required: true
          description: Bare filename. Values containing `/` or `..` are rejected.
          schema:
            type: string
        - name: lines
          in: query
          description: Values outside 1-1000 are ignored and 100 is used.
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 1000
      responses:
        '200':
          description: Tail of the file
          content:
            application/json:
              schema:
                type: object
                properties:
                  filename:
                    type: string
                  lines:
                    type: integer
                  content:
                    type: string
        '400':
          description: Invalid filename
        '404':
          description: File not found
  /system-settings/log-files/{filename}:
    delete:
      tags: [Logs]
      summary: Delete a rotated log file
      description: |
        The active `access.log` and `error.log` cannot be deleted, nor can symlinks.
      security:
        - BearerAuth: []
      parameters:
        - name: filename
          in: path
          required: true
          description: Bare filename. Values containing `/` or `..` are rejected.
          schema:
            type: string
      responses:
        '204':
          description: File deleted
        '400':
          description: Invalid filename, active log file, or symlink
        '404':
          description: File not found
  /system-settings/log-files/rotate:
    post:
      tags: [Logs]
      summary: Trigger log rotation now
      description: |
        Regenerates the logrotate config and runs `logrotate -f`. Requires raw log files
        to be enabled.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Rotation completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
        '400':
          description: Raw log files are not enabled
        '500':
          description: logrotate failed (response carries its output in "details")
  /system-settings/logs:
    get:
      tags: [Logs]
      summary: Get the container log collector configuration
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Collector configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemLogCollectorConfig'
        '503':
          description: Docker log collector is not enabled

    put:
      tags: [Logs]
      summary: Replace the container log collector configuration
      description: |
        Full replacement, not a merge — omitted fields are reset to their zero value.
        The stored config is echoed back.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemLogCollectorConfig'
      responses:
        '200':
          description: Configuration updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemLogCollectorConfig'
        '400':
          description: Invalid request body
        '503':
          description: Docker log collector is not enabled
  /proxy-hosts/by-domain/{domain}:
    get:
      tags: [Proxy Hosts]
      summary: Get proxy host by domain name
      description: Looks up a single proxy host by one of its domain names. Requires the `proxy:read` scope when called with an API token.
      security:
        - BearerAuth: []
      parameters:
        - name: domain
          in: path
          required: true
          schema:
            type: string
          description: Domain name (or stream listener name) stored in domain_names
      responses:
        '200':
          description: Proxy host details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyHost'
        '404':
          $ref: '#/components/responses/NotFound'
  /proxy-hosts/sync:
    post:
      tags: [Proxy Hosts]
      summary: Regenerate every enabled host config
      description: |
        Rewrites the nginx config of every enabled proxy host, then runs
        `nginx -t` and reloads once for the whole batch. Per-host results and the
        test/reload outcome are reported in the response body; a per-host failure
        does not fail the request. Requires the `proxy:write` scope when called
        with an API token.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Sync result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyHostSyncResult'
  /proxy-hosts/{id}/regenerate:
    post:
      tags: [Proxy Hosts]
      summary: Regenerate this host's nginx config
      description: |
        Re-renders the host's config from its current database state (including
        all resolved per-host/global security settings), runs `nginx -t` and
        reloads. Requires the `proxy:write` scope when called with an API token.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProxyHostId'
      responses:
        '200':
          description: Config regenerated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Config regenerated successfully
        '404':
          $ref: '#/components/responses/NotFound'
  /proxy-hosts/{id}/test:
    post:
      tags: [Proxy Hosts]
      summary: Test a proxy host end to end
      description: |
        HTTP hosts: makes a live GET through the host and reports SSL,
        HTTP/2-3, cache and security-header findings (redirects are not
        followed, certificate verification is skipped). Stream hosts: opens a
        TCP/UDP connection to the host's OWN listener
        (`stream_listen_host`:`stream_listen_port`, falling back to the API's
        configured proxy host when the listen host is empty/wildcard) and
        reports the `stream` block only. DDNS findings are added for both. Has
        no request body. Requires the `proxy:read` scope when called with an API
        token.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProxyHostId'
        - name: url
          in: query
          schema:
            type: string
          description: |
            HTTP hosts: absolute URL to request instead of the default
            `{https|http}://{first domain}/` derived from the host's ssl_enabled
            flag and first domain name — used verbatim, unrestricted.
            Stream hosts: parsed as `host:port` (a scheme/path is stripped) and
            accepted only when it points at this host's own listener — the port
            must equal stream_listen_port and the host must be the configured
            listen host, the proxy host, a wildcard or localhost. Anything else
            is reported as an error in the result body (SSRF guard).
      responses:
        '200':
          description: Test result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyHostTestResult'
        '404':
          $ref: '#/components/responses/NotFound'
  /proxy-hosts/{id}/clone:
    post:
      tags: [Proxy Hosts]
      summary: Clone a proxy host
      description: |
        Creates a new host from an existing one under new domain names. Fields
        omitted from the body are copied from the source host. Requires the
        `proxy:write` scope when called with an API token.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProxyHostId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloneProxyHost'
      responses:
        '201':
          description: Clone created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyHost'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Source proxy host not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Target domain already exists, or a stream listener conflicts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /proxy-hosts/{id}/favorite:
    put:
      tags: [Proxy Hosts]
      summary: Toggle favourite
      description: |
        Flips the host's `is_favorite` flag. Takes no request body — the new value
        is always the negation of the stored one. Requires the `proxy:write` scope
        when called with an API token.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProxyHostId'
      responses:
        '200':
          description: |
            Updated proxy host. NOTE: this response is built from a narrower
            SELECT than the other endpoints — `proxy_type`, every `stream_*`
            field, `ddns_enabled`, `ddns_provider_id`, `ddns_proxied`,
            `auth_provider_id` and `auth_bypass_paths` are not read back and
            therefore come out as Go zero values (or omitted). Re-read the host
            with GET /proxy-hosts/{id} if you need them.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyHost'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================================
  # Per-host security sub-resources
  #
  # Every GET below returns the host's OWN stored row (or a synthesized default
  # when no row exists) — never the effective value after the global default is
  # applied. Inheritance is resolved only when the nginx config is generated.
  # ============================================================================
  /proxy-hosts/{id}/blocked-cloud-providers:
    get:
      tags: [Cloud Providers]
      summary: Get cloud-provider blocking for a proxy host
      description: |
        Returns the host's own cloud-blocking settings (never the global default).
        Requires the `proxy:read` scope when called with an API token.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProxyHostId'
      responses:
        '200':
          description: Blocked cloud providers for this host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockedCloudProviders'

    put:
      tags: [Cloud Providers]
      summary: Set cloud-provider blocking for a proxy host
      description: |
        Full replace — the four fields are written exactly as sent, so an omitted
        boolean is stored as false and an omitted `blocked_providers` clears the
        list. Requires the `proxy:write` scope when called with an API token.

        The response echoes the request plus a `message`; note it does NOT include
        `cloud_disable_global` even though that field is persisted (re-read with
        GET to see it).
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProxyHostId'
        - name: skip_reload
          in: query
          schema:
            type: string
            enum: ["true"]
          description: When exactly `true`, the settings are saved but the host's nginx config is not regenerated or reloaded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBlockedCloudProviders'
      responses:
        '200':
          description: Cloud provider blocking updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  blocked_providers:
                    type: array
                    items:
                      type: string
                  challenge_mode:
                    type: boolean
                  allow_search_bots:
                    type: boolean
                  message:
                    type: string
                    example: Cloud provider blocking updated successfully
        '400':
          $ref: '#/components/responses/BadRequest'
  /proxy-hosts/{id}/uri-block/rules:
    post:
      tags: [Security]
      summary: Add a single URI block rule
      description: |
        Appends one rule to the host's URI block, creating the URI block row if it
        does not exist yet. Convenience entry point used from the log viewer.
        `match_type` defaults to `prefix` when empty; a `regex` pattern is
        compiled up front and rejected with 400 if invalid. The rule id is
        server-generated. Adding a rule whose pattern and match_type already exist
        is a no-op that returns the unchanged config. Returns the whole updated
        URI block. Requires the `proxy:write` scope when called with an API token.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProxyHostId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddURIBlockRule'
      responses:
        '201':
          description: Rule added; the full URI block config is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/URIBlockConfig'
        '400':
          description: Missing pattern or invalid regex
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /proxy-hosts/{id}/uri-block/rules/{ruleId}:
    delete:
      tags: [Security]
      summary: Remove a single URI block rule
      description: Removes one rule by its id from the host's URI block. Requires the `proxy:delete` scope when called with an API token.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProxyHostId'
        - name: ruleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Id of the rule inside the URI block's rules array
      responses:
        '204':
          description: Rule removed
  /api/docs:
    servers:
      - url: /
        description: Served at the origin root, outside the /api/v1 prefix
    get:
      tags: [System]
      summary: Swagger UI
      description: |
        Unauthenticated. Returns the embedded Swagger UI HTML page, which loads the
        spec from `/api/docs/swagger.yaml`. Registered on the root Echo instance
        before the `/api/v1` group, so neither the auth middleware nor the API
        rate limiter applies.
      security: []
      responses:
        '200':
          description: Swagger UI page
          content:
            text/html:
              schema:
                type: string
  /api/docs/swagger.yaml:
    servers:
      - url: /
        description: Served at the origin root, outside the /api/v1 prefix
    get:
      tags: [System]
      summary: OpenAPI specification
      description: |
        Unauthenticated. Returns this document verbatim. The YAML is compiled into
        the binary with `go:embed`, so it always matches the running build and
        cannot be edited at runtime. Served with content type `application/yaml`.
      security: []
      responses:
        '200':
          description: OpenAPI 3.0.3 document
          content:
            application/yaml:
              schema:
                type: string

  # ============================================================================
  # WAF self-test (/waf-test/*) — read-only diagnostics, waf:read
  # ============================================================================
  /waf-test/patterns:
    get:
      tags: [WAF]
      summary: List the built-in attack patterns
      description: |
        Returns the catalogue of attack payloads that `/waf-test/test` can fire, as a
        hard-coded list of twelve entries (it does not read the database). The `id`
        of an entry is the value to send as `attack_type`. Requires the `waf:read`
        scope when called with an API token.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: The twelve built-in patterns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WAFTestPattern'
  /waf-test/test:
    post:
      tags: [WAF]
      summary: Fire one attack payload at a target URL
      description: |
        Sends a single GET request built from the named attack pattern to
        `target_url` and reports whether the WAF blocked it. The request is made by
        the API container itself, with a 10 second timeout, TLS verification
        disabled (self-signed certificates) and redirects not followed; only the
        first 1 KiB of the response body is read and discarded.

        `blocked` is true when the response status is 403, 406 or 429. A transport
        error is also reported as blocked, with `status_code` 0 and
        " (Connection failed - possibly blocked)" appended to `description` — that
        case still returns 200, not 5xx.

        Requires the `waf:read` scope when called with an API token: this endpoint
        reads no data but does make NPG originate traffic.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WAFTestRequest'
      responses:
        '200':
          description: Test result (also returned when the connection failed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WAFTestResult'
        '400':
          description: |
            Body did not decode, `target_url` was empty, `target_url` did not parse
            as a URL, or `attack_type` is not one of the twelve pattern ids.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: The outbound request object could not be constructed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /waf-test/test-all:
    post:
      tags: [WAF]
      summary: Fire every attack payload at a target URL
      description: |
        Runs all twelve patterns sequentially against `target_url` and returns one
        result per pattern. Same client settings as `/waf-test/test` (10 second
        timeout each, TLS verification off, redirects not followed). There is no
        `attack_type` in the body — the whole catalogue is used.

        Two differences from the single test: results are produced by iterating a Go
        map, so the array order is **not** stable between calls, and a transport
        failure sets `status_code` 0 and `blocked` true without appending anything to
        `description`. A pattern whose request object cannot be constructed is
        skipped, so the array can be shorter than twelve entries.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WAFTestAllRequest'
      responses:
        '200':
          description: One result per pattern, in non-deterministic order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WAFTestResult'
        '400':
          description: Body did not decode, `target_url` was empty, or it did not parse as a URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ============================================================================
  # URI blocking — cross-host views
  # ============================================================================
  /uri-blocks:
    get:
      tags: [Security]
      summary: List every host's URI block configuration
      description: |
        Returns one entry per row in `uri_blocks`, joined to its proxy host so each
        entry carries the host's `domain_names` and `host_enabled`. Hosts that have
        never had URI blocking configured have no row and therefore do not appear.
        Ordered by the host's first domain name. The array is always present
        (`[]` when empty), as is each entry's `rules`. Requires the `proxy:read`
        scope when called with an API token.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: URI block configuration for every host that has one
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/URIBlockWithHost'
        '500':
          description: Database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /uri-blocks/bulk-add-rule:
    post:
      tags: [Security]
      summary: Add one URI block rule to many hosts at once
      description: |
        Adds the same rule to each host in `host_ids`, or — when `host_ids` is
        omitted or empty — to every **enabled** proxy host. Per-host failures do not
        abort the operation: they are collected into `errors` and the response is
        still 200, so compare `added_count` against `total_hosts` to detect a partial
        apply.

        Note the default: an omitted or empty `match_type` becomes `exact` here,
        whereas `POST /proxy-hosts/{id}/uri-block/rules` defaults to `prefix`.
        A `regex` pattern is compiled up front and rejected with 400 if invalid.
        `description` is accepted and stored on each created rule, and every rule is
        created enabled.

        Each host's nginx config is regenerated as the rule is added, but the reload
        is requested once at the end through the debounced reloader rather than per
        host. Requires the `proxy:write` scope when called with an API token.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkAddURIBlockRuleRequest'
      responses:
        '200':
          description: Rule applied; check added_count against total_hosts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkAddURIBlockRuleResult'
        '400':
          description: |
            Body did not decode, `pattern` was empty, `pattern` is an invalid regex
            while `match_type` is `regex`, or no target hosts were found (empty
            `host_ids` with no enabled hosts).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ============================================================================
  # Upstream health
  # ============================================================================
  /upstreams/{id}/health:
    get:
      tags: [Security]
      summary: Get health status of an upstream pool
      description: |
        Health snapshot for one upstream pool. `id` is the **upstream** id (the `id`
        field of the object returned by `/proxy-hosts/{id}/upstream`), not a proxy
        host id.

        `healthy_count` and `unhealthy_count` are computed at request time from the
        stored server rows: a server counts as healthy only when `is_healthy` is true
        **and** `is_down` is false; everything else counts as unhealthy. The values
        are read from storage, not measured by this call. `response_time_ms` is never
        populated by this endpoint and is therefore always absent.

        Requires the `proxy:read` scope when called with an API token.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Upstream id
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Upstream health snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpstreamHealthStatus'
        '404':
          description: No upstream with this id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ============================================================================
  # System settings — GeoIP history, update check, ACME self-test
  # ============================================================================
  /system-settings/geoip/history:
    get:
      tags: [GeoIP]
      summary: List GeoIP database update runs
      description: |
        Page through the record of GeoIP database update runs, both scheduled
        (`trigger_type` auto) and operator-initiated (`manual`). Out-of-range
        pagination values are silently corrected rather than rejected: `page` below 1
        becomes 1, and `per_page` below 1 or above 100 becomes 20. Non-numeric values
        parse as 0 and are corrected the same way.

        When the history repository is not wired up the endpoint still returns 200,
        with an empty `data` array and `page` 1 / `per_page` 20 / `total_pages` 1.
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          description: 1-based page number. Values below 1 are clamped to 1.
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: per_page
          in: query
          description: Rows per page. Values below 1 or above 100 fall back to 20.
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: One page of update history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoIPUpdateHistoryResponse'
        '500':
          description: Database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /system-settings/update/check:
    get:
      tags: [System]
      summary: Check for a newer NPG release
      description: |
        Compares the running `AppVersion` against the latest published GitHub
        release. The result is cached, and the cache is served unless it has expired
        or `force=true` is passed; forced re-checks are additionally throttled to
        protect the unauthenticated GitHub rate limit, so `force=true` in a tight
        loop returns the cached answer.

        A failed lookup does not produce an error status: the endpoint returns 200
        with `check_failed` true, carrying forward the last known `latest_version`,
        `release_url`, `published_at` and `update_available` when a previous
        successful check exists. Failures are not cached, so the next call retries.
      security:
        - BearerAuth: []
      parameters:
        - name: force
          in: query
          description: Send exactly "true" to bypass the cache (subject to throttling). Any other value is ignored.
          schema:
            type: string
            enum: ['true']
      responses:
        '200':
          description: Update information (also returned when the lookup failed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateInfo'
  /system-settings/acme/test:
    post:
      tags: [System]
      summary: Validate the stored ACME configuration
      description: |
        Reads the stored ACME settings and reports whether they look usable. This is
        a local consistency check only — it contacts no ACME directory and issues
        nothing. Takes no request body.

        `status` is `disabled` when ACME is turned off, `pending` when ACME is on but
        `acme_email` is empty, and `ok` otherwise. Requires the `settings:write`
        scope when called with an API token (it is registered as a write route even
        though it only reads).
      security:
        - BearerAuth: []
      responses:
        '200':
          description: ACME configuration verdict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ACMETestResult'
        '500':
          description: Settings could not be read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ============================================================================
  # Audit logs — filter vocabularies and API token usage
  # ============================================================================
  /audit-logs/actions:
    get:
      tags: [Logs]
      summary: List the action values present in the audit log
      description: |
        Returns `SELECT DISTINCT action` over the audit log — the actions actually
        recorded on this install, not the full vocabulary the code can emit. Use
        `value` as the `action` filter on `GET /audit-logs`.

        `label` is a human-readable Korean name looked up from a fixed table; an
        action with no table entry gets its raw value as the label. The array is
        always present, `[]` when the audit log is empty.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Distinct action values with display labels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditLogLabelOption'
        '500':
          description: Database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /audit-logs/resource-types:
    get:
      tags: [Logs]
      summary: List the resource types present in the audit log
      description: |
        Returns `SELECT DISTINCT resource_type` over the audit log, excluding NULL —
        the resource types actually recorded on this install. Use `value` as the
        `resource_type` filter on `GET /audit-logs`. `label` follows the same
        fixed-table lookup as `/audit-logs/actions`, falling back to the raw value.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Distinct resource types with display labels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditLogLabelOption'
        '500':
          description: Database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /audit-logs/api-tokens:
    get:
      tags: [Logs]
      summary: List recent API token usage across all tokens
      description: |
        Per-request usage log for every API token, joined with the owning token's
        name, prefix and username. Distinct from `/api-tokens/{id}/usage`, which
        covers a single token.

        Two hard limits are built in and are not adjustable by query parameters: the
        window is the **last 7 days**, and at most **100 rows per token** are read
        from storage. Those per-token slices are then merged, sorted by `created_at`
        descending and paginated in memory, so `total` counts the merged set after
        those caps — it is not the true number of requests in the window. A token
        whose usage lookup errors is skipped silently.

        Note the field name: each entry reports `response_time`, not
        `response_time_ms` as the underlying column is named.
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          description: Rows per page. Non-numeric falls back to 50; values are clamped into 1–100 rather than rejected.
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          description: Rows to skip. Non-numeric falls back to 0; values are clamped into 0–10000.
          schema:
            type: integer
            default: 0
            minimum: 0
            maximum: 10000
      responses:
        '200':
          description: One page of merged token usage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APITokenUsageLogResponse'
        '500':
          description: The token list could not be read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ============================================================================
  # Cloud providers — region-grouped catalogue
  # ============================================================================
  /cloud-providers/by-region:
    get:
      tags: [Cloud Providers]
      summary: List enabled cloud providers grouped by region
      description: |
        Region-bucketed view of the provider catalogue, for building the blocking
        picker. Only providers with `enabled` true are returned, ordered by region
        then name, and each entry is a summary — `ip_count` (the number of stored IP
        ranges) replaces the ranges themselves, so this is far smaller than
        `GET /cloud-providers`.

        Exactly four buckets exist and all four are always present, empty when they
        have no members. A provider whose `region` is not one of `us`, `eu`, `cn`,
        `kr` matches no bucket and is silently omitted from the response.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Enabled providers bucketed by region
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudProvidersByRegion'
        '500':
          description: Database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ============================================================================
  # CORRECTION — replaces the existing /audit-logs entry (see notes)
  # The current entry documents a `page` parameter the handler never reads, omits
  # every other parameter it does read, and gives no response schema.
  # ============================================================================
  /filter-subscriptions:
    get:
      tags: [Filter Subscriptions]
      summary: List filter subscriptions
      description: |
        A **subscription** is a remote block-list URL that NPG fetches, parses and stores as
        entries (`filter_subscription_entries`). Entries of every *enabled* subscription are
        merged, de-duplicated and written to two shared nginx files
        (`filter_sub_ips.conf`, `filter_sub_uas.conf`), then nginx is reloaded (debounced,
        asynchronous — the HTTP response does not wait for it).

        Permissions: route permission `waf:read`; an API token additionally needs the legacy
        `proxy:read` scope attached in routes.go.
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          description: Values below 1 are coerced to 1.
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: per_page
          in: query
          description: Values below 1 or above 100 are coerced to 20.
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Paginated filter subscriptions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilterSubscriptionListResponse'
        '500':
          description: Database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags: [Filter Subscriptions]
      summary: Subscribe to a filter list URL
      description: |
        Fetches the URL immediately (synchronously, within the request), auto-detects the
        format and stores the parsed entries.

        Behaviour worth knowing before you call it:
        - SSRF guard: URLs resolving to private/loopback/link-local ranges are rejected (400).
        - Format auto-detection: a body starting with `{` is parsed as NPG JSON
          (`format: "npg-json"`), everything else line-by-line as `plaintext`
          (`#`/`;` comments stripped, invalid IP/CIDR lines dropped, duplicates dropped).
        - `name` falls back to the JSON list name, then to the URL itself.
        - `type` falls back to the JSON list type, then to the plaintext auto-detection
          (`cidr` when more than half the entries contain `/`, else `ip`).
        - The subscription is created with `enabled: false` — nothing is applied to nginx
          until you `PUT` it with `enabled: true`.
        - Caps: at most 25000 entries are kept per list, and creation is refused once the
          total across all subscriptions reaches 100000 (400, "total entry limit reached").
        - The returned object is the in-memory struct built before the fetch-status row is
          written, so `last_fetched_at`/`last_success_at` are null here even though the fetch
          succeeded. Re-read with `GET /filter-subscriptions/{id}` for the persisted values.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFilterSubscription'
      responses:
        '201':
          description: Subscription created and entries stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilterSubscription'
        '400':
          description: |
            `url` missing, private/invalid URL, invalid `type`/`refresh_type`/`refresh_value`,
            or the global entry limit was reached. The handler classifies by substring, so any
            failure whose message contains `invalid`, `required`, `private` or
            `limit reached` — including an unparseable NPG-JSON body ("invalid JSON format") —
            lands here rather than on 500.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            A subscription for this URL already exists (message contains `already exist`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Any other fetch failure (connection error, non-200 upstream status) or a database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /filter-subscriptions/catalog:
    get:
      tags: [Filter Subscriptions]
      summary: Get the curated filter catalog
      description: |
        A **catalog entry** is not a subscription: it is a curated listing fetched live from
        the public npg-filters repository index
        (`https://raw.githubusercontent.com/svrforum/npg-filters/main/index.json`). It carries
        only metadata (name, description, type, relative `path`, entry count) — no entries and
        no database row. Subscribe to it with `POST /filter-subscriptions/catalog/subscribe`,
        which turns the `path` into the full URL and creates a real subscription.

        Each entry is marked `subscribed: true` when a subscription already exists for
        `https://raw.githubusercontent.com/svrforum/npg-filters/main/` + `path` (the field is
        omitted when false).

        Permissions: route permission `waf:read`; API tokens also need `proxy:read`.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Catalog index
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilterCatalog'
        '500':
          description: Catalog unreachable, non-200 upstream status, or unparseable JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /filter-subscriptions/catalog/subscribe:
    post:
      tags: [Filter Subscriptions]
      summary: Subscribe to one or more catalog lists
      description: |
        Each `path` is resolved against the catalog base URL and then goes through the same
        create flow as `POST /filter-subscriptions` (immediate fetch, `enabled: false`).

        Partial success is the norm and is not reported as an error: a path that fails to
        fetch/parse is logged and skipped, and the response only contains the lists that
        succeeded. A path that is already subscribed contributes its existing subscription to
        the response instead of a new one. If nothing succeeds the response body is `null`.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogSubscribeRequest'
      responses:
        '201':
          description: Subscribed lists (may be `null` when every path failed or was skipped)
          content:
            application/json:
              schema:
                type: array
                nullable: true
                items:
                  $ref: '#/components/schemas/FilterSubscription'
        '400':
          description: '`paths` missing or empty, or malformed body'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /filter-subscriptions/{id}:
    get:
      tags: [Filter Subscriptions]
      summary: Get a filter subscription with its entries and exclusions
      description: |
        Returns the subscription plus **all** of its stored entries (up to 25000), its host
        exclusions and its entry exclusions. Note that `entries` is the raw fetched list — it
        is not filtered by `entry_exclusions`; the exclusions are applied when the shared
        nginx config is generated.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Subscription detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilterSubscriptionDetail'
        '404':
          description: Filter subscription not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags: [Filter Subscriptions]
      summary: Update a filter subscription
      description: |
        Partial update — only the supplied fields are written. `url`, `type` and `format` are
        immutable (the handler does not read them).

        Toggling `enabled` or `exclude_private_ips` triggers a regeneration of the shared
        filter config files plus a debounced nginx reload, asynchronously: the response
        returns before nginx has reloaded.

        Unlike create, this path does **not** validate `refresh_type`/`refresh_value` — any
        string is persisted.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFilterSubscription'
      responses:
        '200':
          description: Subscription updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilterSubscription'
        '400':
          description: Malformed body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: |
            Database error. An unknown `id` also lands here, not on 404 — the handler has no
            not-found branch on this route.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [Filter Subscriptions]
      summary: Delete a filter subscription
      description: |
        Deletes the subscription; its entries, host exclusions and entry exclusions go with it
        (FK `ON DELETE CASCADE`). Shared config regeneration + nginx reload are triggered
        asynchronously afterwards.

        Permissions: route permission `waf:write`; API tokens also need the legacy
        `proxy:delete` scope.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Subscription deleted (no body)
        '404':
          description: Filter subscription not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /filter-subscriptions/{id}/refresh:
    post:
      tags: [Filter Subscriptions]
      summary: Re-fetch a subscription now
      description: |
        Synchronous re-fetch of the subscription's URL; the response reflects the refreshed row.

        Protections applied in this order:
        - Fetch failure: existing entries are **kept**, `last_error` is recorded, and the call
          returns 500.
        - Empty result (0 parsed entries): existing entries are kept and the fetch is recorded
          as a success (200).
        - Global cap: entries are truncated so the 100000 total is not exceeded; if no room is
          left the existing entries are kept unchanged.
        - Per-list cap: at most 25000 entries.

        On success entries are replaced in a transaction and a shared-config regeneration +
        debounced nginx reload is triggered asynchronously.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Refreshed subscription
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilterSubscription'
        '500':
          description: |
            Fetch/parse failure, or unknown `id` (reported as a 500 "database error", not 404).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /filter-subscriptions/{id}/exclusions:
    get:
      tags: [Filter Subscriptions]
      summary: List host exclusions of a subscription
      description: |
        A **host exclusion** exempts one proxy host from this subscription: entry lookups for
        that host (`GetEntriesForHost`) skip every entry of the excluded subscription.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Host exclusions, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FilterSubscriptionHostExclusion'
        '500':
          description: Database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /filter-subscriptions/{id}/exclusions/{hostId}:
    post:
      tags: [Filter Subscriptions]
      summary: Exclude a proxy host from a subscription
      description: |
        Idempotent (`ON CONFLICT DO NOTHING`). Triggers an asynchronous shared-config
        regeneration and debounced nginx reload. No body is returned.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: hostId
          in: path
          required: true
          description: Proxy host UUID
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Exclusion added (no body)
        '500':
          description: Database error (e.g. unknown subscription or host — FK violation)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [Filter Subscriptions]
      summary: Remove a host exclusion
      description: |
        Deleting a non-existent exclusion still returns 204. Triggers an asynchronous
        shared-config regeneration and debounced nginx reload.

        Permissions: route permission `waf:write`; API tokens also need `proxy:delete`.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: hostId
          in: path
          required: true
          description: Proxy host UUID
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Exclusion removed (no body)
        '500':
          description: Database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /filter-subscriptions/{id}/entry-exclusions:
    get:
      tags: [Filter Subscriptions]
      summary: List entry exclusions of a subscription
      description: |
        An **entry exclusion** is an allow-list hole punched in a single subscription: the
        `(subscription_id, value)` pair is anti-joined away when the shared nginx blocklists
        are built, so that IP/CIDR is not blocked even though the fetched list contains it.
        The entry itself stays in the subscription and reappears in `entries` and in
        `entry_count`; a refresh does not clear the exclusion.

        Note the asymmetry with host exclusions: entry exclusions apply globally (to the
        shared `filter_sub_ips.conf`/`filter_sub_uas.conf`), host exclusions apply per proxy
        host.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Entry exclusions, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FilterSubscriptionEntryExclusion'
        '500':
          description: Database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags: [Filter Subscriptions]
      summary: Exclude a single entry value from a subscription
      description: |
        `value` must parse as an IP address or a CIDR block, otherwise 400. Idempotent
        (`ON CONFLICT DO NOTHING`). Triggers an asynchronous shared-config regeneration and
        debounced nginx reload; the cached entry list is invalidated.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddEntryExclusionRequest'
      responses:
        '204':
          description: Entry exclusion added (no body)
        '400':
          description: '`value` missing, or not a valid IP address or CIDR'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [Filter Subscriptions]
      summary: Remove an entry exclusion
      description: |
        The value is taken from the **query string**, not from a body. Removing a
        non-existent exclusion still returns 204.

        Permissions: route permission `waf:write`; API tokens also need `proxy:delete`.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: value
          in: query
          required: true
          description: The excluded IP or CIDR to remove
          schema:
            type: string
      responses:
        '204':
          description: Entry exclusion removed (no body)
        '400':
          description: '`value` query parameter missing'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /ddns-records:
    get:
      tags: [DDNS]
      summary: List DDNS records
      description: |
        A DDNS record is a hostname whose `A` record is kept pointed at the server's detected
        public IPv4 through a DNS provider. Records with `proxy_host_id` set are **managed**:
        they were created by a proxy host's DDNS opt-in and their hostname/provider are owned
        by that host. `proxy_host_id` absent (null) means a manually created record.

        Permissions: route permission `ddns:read`; an API token additionally needs the legacy
        `settings:read` scope attached in routes.go.
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          description: Values below 1 are coerced to 1.
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: per_page
          in: query
          description: Values below 1 or above 100 are coerced to 20.
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Paginated DDNS records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DDNSRecordListResponse'
        '500':
          description: Database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags: [DDNS]
      summary: Create a DDNS record
      description: |
        Creates a manual record (`proxy_host_id` is null). `record_type` is always `A` —
        it is set server-side and cannot be supplied. `ttl` below 1 is stored as 1
        (Cloudflare's "auto").

        `dns_provider_id` must reference an existing DNS provider; only providers of type
        `cloudflare`, `duckdns` or `dynu` have a DDNS updater. Creation does not verify the
        provider type — a record pointing at any other provider is accepted here and fails at
        sync time with `provider "<type>" not supported for DDNS` in `last_error`.

        Creation does **not** sync: the record is pushed to the provider by the DDNS scheduler
        on its next cycle, or immediately via `POST /ddns-records/{id}/sync`.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDDNSRecord'
      responses:
        '201':
          description: DDNS record created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DDNSRecord'
        '400':
          description: '`hostname` or `dns_provider_id` missing, or malformed body'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: A record for this (hostname, dns_provider_id) pair already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /ddns-records/sync:
    post:
      tags: [DDNS]
      summary: Sync all enabled DDNS records now
      description: |
        Runs **inline, synchronously**, before the response is written (despite the
        "sync triggered" wording): the public IPv4 is detected once, then every enabled record
        is visited. A record is skipped when its `last_status` is `ok` and `last_ip` already
        equals the detected IP — force a push with `POST /ddns-records/{id}/sync` or by
        changing `proxied`/`ttl`.

        Always returns 200. Failures — public-IP detection, listing, and each individual
        provider update — are logged and recorded in the record's `last_status`/`last_error`;
        they are never reflected in this response body.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Sync run completed (per-record outcomes are not reported here)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DDNSSyncResponse'
              example:
                success: true
                message: sync triggered
  /ddns-records/import-from-hosts:
    post:
      tags: [DDNS]
      summary: Import DDNS records from proxy hosts
      description: |
        Turns DDNS on for the selected proxy hosts and reconciles their domains into managed
        DDNS records. The provider type is validated once up front: it must be `cloudflare`,
        `duckdns` or `dynu`, otherwise 400.

        What it does per host (DB-only host update — no nginx reload is triggered):
        - Sets `ddns_enabled = true` and `ddns_provider_id` on the proxy host.
        - Creates one managed record per domain that has none, with `record_type = 'A'`,
          `ttl = 1`, `enabled = true`, `proxied` copied from the host's DDNS proxied setting
          and `proxy_host_id` set to the host.
        - Existing records collide-and-skip: the insert is
          `ON CONFLICT (hostname, dns_provider_id) DO NOTHING`, so a hostname already present
          (manual, or owned by another host) is left untouched and only logged.
        - Records this host already owns under a *different* provider are **deleted** first so
          they can be recreated under the new one.
        - Records this host owns whose hostname is no longer among its domains are **deleted**.
        - For domains already managed, a changed `proxied` value is written onto the existing
          record.

        Sync is **not** immediate on this path: the bulk import deliberately skips the
        per-host public-IP push, so the new records reach the provider on the DDNS scheduler's
        next cycle (or via an explicit sync call).

        Per-host failures do not fail the request — they are logged and skipped, and the
        response is still 200 with `success: true`.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportDDNSFromHostsRequest'
      responses:
        '200':
          description: Import completed (per-host failures are silently skipped)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DDNSSyncResponse'
              example:
                success: true
                message: DDNS import triggered
        '400':
          description: |
            `proxy_host_ids` empty, `dns_provider_id` missing, provider not found, or provider
            type is not Cloudflare/DuckDNS/Dynu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /ddns-records/{id}:
    get:
      tags: [DDNS]
      summary: Get a DDNS record
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: DDNS record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DDNSRecord'
        '404':
          description: DDNS record not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags: [DDNS]
      summary: Update a DDNS record
      description: |
        Partial update — only supplied fields are written.

        For a **managed** record (`proxy_host_id` set) `hostname` and `dns_provider_id` are
        silently dropped: they belong to the owning proxy host and changing them would orphan
        the record on the next reconcile. `proxied`, `ttl` and `enabled` pass through for every
        record.

        Changing `proxied` or `ttl` on an enabled record schedules an immediate background
        re-sync (goroutine, best effort) because the IP is unchanged and the scheduler's
        "IP changed?" gate would otherwise never push the new settings. The response returns
        before that sync completes and its outcome is only visible in `last_status`/
        `last_error` on a later read.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDDNSRecord'
      responses:
        '200':
          description: DDNS record updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DDNSRecord'
        '400':
          description: Malformed body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: DDNS record not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The new (hostname, dns_provider_id) pair already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [DDNS]
      summary: Delete a DDNS record
      description: |
        By default the record is also removed at the DNS provider (best effort, before the row
        is deleted); pass `remove_provider=false` to keep the public DNS entry and only forget
        it locally. Any other value — including omitting the parameter — is treated as true.

        Provider-side removal only happens for providers that implement deletion (Cloudflare);
        DuckDNS/Dynu have no record-deletion concept and are skipped. A provider failure is
        logged and never blocks the local delete.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: remove_provider
          in: query
          required: false
          description: Exactly the string `false` keeps the provider-side DNS record; anything else (or absent) deletes it.
          schema:
            type: string
            enum: ['false']
      responses:
        '204':
          description: DDNS record deleted (no body)
        '404':
          description: DDNS record not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /ddns-records/{id}/sync:
    post:
      tags: [DDNS]
      summary: Sync one DDNS record now
      description: |
        Immediate, **synchronous** forced sync of a single record — no "has the IP changed?"
        gate, so it also re-pushes an already-correct record. The public IPv4 is detected, then
        the record is pushed to its provider and `last_ip`, `last_status`, `last_synced_at` and
        `last_error` are updated.

        Unlike `POST /ddns-records/sync`, a failure here is reported: public-IP detection
        failure, an unknown/unsupported provider, or a provider API error all return 500 (and
        are also recorded on the record). Disabled records are synced too — `enabled` is not
        checked on this path.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Record synced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DDNSSyncResponse'
              example:
                success: true
                message: record synced
        '404':
          description: DDNS record not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Public IP detection failed, provider unsupported/not found, or the provider update failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /waf/hosts/{id}/history:
    get:
      tags: [WAF]
      summary: Get the WAF policy change history for a proxy host
      description: |
        Every disable/enable of a CRS rule on this host is appended to
        `waf_policy_history`; this returns that log newest-first plus the total row
        count (the total is NOT limited by `limit`).

        Requires the `waf:read` scope when called with an API token.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProxyHostId'
        - name: limit
          in: query
          description: >-
            Max history rows to return. Defaults to 100; a non-numeric or
            non-positive value is ignored and the default is used. There is no
            upper bound and no offset/paging.
          schema:
            type: integer
            default: 100
      responses:
        '200':
          description: Policy history for the host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WAFPolicyHistoryResponse'
        '500':
          description: Database error reading or counting the history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /waf/rules/disable-by-host:
    post:
      tags: [WAF]
      summary: Disable a CRS rule on the host that owns a domain name
      description: |
        Same effect as `POST /waf/hosts/{id}/rules/{ruleId}/disable`, but the host
        is located by domain name instead of by UUID — this is what the log viewer
        calls, where only the `Host` header of the blocked request is known.

        A `host:port` value is accepted; the port is stripped before the lookup.
        The exclusion is written, a `disabled` row is appended to the host's policy
        history, and the host's ModSecurity config is regenerated and nginx
        reloaded synchronously before the response is returned.

        Requires the `waf:write` scope when called with an API token.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisableWAFRuleByHostRequest'
      responses:
        '201':
          description: Exclusion created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WAFRuleExclusion'
        '400':
          description: >-
            Unparseable body, empty `host`, or `rule_id` absent/zero.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >-
            No proxy host serves that domain. The message suggests using the
            global disable endpoint instead.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The rule is already disabled for this host.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: >-
            Database error, or "Rule exclusion saved but failed to apply nginx
            config" — in the latter case the exclusion IS persisted and only the
            nginx regeneration failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /waf/global/rules:
    get:
      tags: [WAF]
      summary: List all CRS rules with their GLOBAL exclusion status
      description: |
        Parses the OWASP CRS files on disk (plus the ModSecurity base rules) and
        returns them grouped by category, annotated only with global exclusions —
        no per-host exclusion is considered here, so `enabled` is false exactly
        when the rule is globally disabled.

        `severity` and `tags` on a rule are never populated by the parser and are
        therefore always absent from the response.

        Requires the `waf:read` scope when called with an API token.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Categories, rule count and the current global exclusions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalWAFRulesResponse'
        '500':
          description: Database error reading exclusions, or the CRS files could not be parsed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /waf/global/exclusions:
    get:
      tags: [WAF]
      summary: List the globally disabled CRS rules
      description: |
        The raw exclusion rows without the CRS rule catalog — cheap alternative to
        `GET /waf/global/rules` when only "which rule IDs are off everywhere" is
        needed. Requires the `waf:read` scope when called with an API token.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Global exclusions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalWAFExclusionListResponse'
        '500':
          description: Database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /waf/global/history:
    get:
      tags: [WAF]
      summary: Get the global WAF policy change history
      description: |
        Newest-first log of global rule disable/enable events, plus the untruncated
        total. Requires the `waf:read` scope when called with an API token.
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          description: >-
            Max history rows to return. Defaults to 100; a non-numeric or
            non-positive value is ignored. No upper bound, no offset.
          schema:
            type: integer
            default: 100
      responses:
        '200':
          description: Global policy history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalWAFPolicyHistoryResponse'
        '500':
          description: Database error reading or counting the history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /waf/global/rules/{ruleId}/disable:
    post:
      tags: [WAF]
      summary: Disable a CRS rule for EVERY host
      description: |
        Creates a global exclusion. A global exclusion is merged into every
        WAF-enabled host's ModSecurity config (host-specific exclusions win on the
        same rule ID), so this turns the rule off everywhere, including on hosts
        created later.

        The regeneration of all host configs is kicked off in the BACKGROUND after
        the response is written — a 201 means the exclusion row exists, not that
        nginx has already reloaded, and a regeneration failure is only visible in
        the container log.

        The body is optional: an unparseable or empty body is tolerated and only
        the path `ruleId` is used. `rule_id` in the body is always overwritten by
        the path value.

        Requires the `waf:write` scope when called with an API token.
      security:
        - BearerAuth: []
      parameters:
        - name: ruleId
          in: path
          required: true
          description: CRS rule ID (integer, e.g. 942100).
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGlobalWAFRuleExclusion'
      responses:
        '201':
          description: Global exclusion created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalWAFRuleExclusion'
        '400':
          description: '`ruleId` is not an integer'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The rule is already disabled globally
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [WAF]
      summary: Re-enable a CRS rule globally
      description: |
        Removes the global exclusion for this rule ID, i.e. the rule is enforced
        again on every WAF-enabled host — except on hosts that carry their own
        per-host exclusion for the same rule, which is untouched by this call.

        Returns 204 even when no global exclusion existed (the delete is not
        checked for affected rows), and an `enabled` row is appended to the global
        history either way. That history row records `changed_by` as the literal
        `admin` rather than the calling user (the disable path does record the
        caller).

        Regeneration of all host configs runs in the BACKGROUND after the response.

        Requires the `waf:write` scope when called with an API token.
      security:
        - BearerAuth: []
      parameters:
        - name: ruleId
          in: path
          required: true
          description: CRS rule ID (integer).
          schema:
            type: integer
      responses:
        '204':
          description: Global exclusion removed (no body)
        '400':
          description: '`ruleId` is not an integer'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ============================================================================
  # Exploit rules — hosts, per-host exclusions and global excludes
  #
  # Terminology, because it inverts easily: an EXCLUSION switches a blocking rule
  # OFF. Adding one (POST) stops the rule from blocking; removing it (DELETE)
  # puts the rule back into effect. "Host" scope affects one proxy host, "global"
  # scope affects every host that has block_exploits enabled.
  # (/exploit-rules, /exploit-rules/{id} and /exploit-rules/{id}/toggle — the rule
  #  catalog itself — are documented elsewhere in this file.)
  # ============================================================================
  /exploit-rules/hosts:
    get:
      tags: [Exploit Rules]
      summary: List proxy hosts that have exploit blocking enabled
      description: |
        Only hosts with `block_exploits` true are returned; hosts with the feature
        off are omitted entirely. Reads the first 1000 proxy hosts and annotates
        each with how many host-scoped exclusions it has. A host with no domain
        names is reported as `"Unnamed Host"`.

        `hosts` is omitted from the JSON when no host qualifies (Go nil slice), so
        clients must treat a missing `hosts` key as an empty list.

        Requires the `waf:read` scope when called with an API token.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Hosts with exploit blocking enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExploitRuleHostsResponse'
        '500':
          description: Failed to list proxy hosts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /exploit-rules/hosts/{hostId}/rules:
    get:
      tags: [Exploit Rules]
      summary: List exploit rules with this host's exclusion status
      description: |
        Every rule in the catalog, grouped into the fixed category order
        (sql_injection, xss, rfi, path_traversal, scanner, http_method, custom),
        each annotated with `globally_disabled` / `host_disabled` and, when
        present, the representative exclusion row for each scope.

        A rule can carry several exclusions in one scope (one rule-wide plus any
        number of URI-scoped ones). Only ONE representative per scope is returned —
        the rule-wide exclusion is preferred when it exists — while the booleans
        stay accurate ("at least one exclusion exists in that scope").

        Unlike `GET /exploit-rules`, this response has no `global_exclusions` key.

        Requires the `waf:read` scope when called with an API token.
      security:
        - BearerAuth: []
      parameters:
        - name: hostId
          in: path
          required: true
          description: Proxy host UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Categorised rules with per-host exclusion status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExploitRuleHostRulesResponse'
        '400':
          description: Host ID missing from the path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /exploit-rules/hosts/{hostId}/rules/{ruleId}/exclude:
    post:
      tags: [Exploit Rules]
      summary: Exclude an exploit rule on ONE proxy host (stop it blocking there)
      description: |
        Adds a host-scoped exclusion: the rule stops being enforced for this host
        only, every other host keeps it. Other hosts are unaffected — use
        `POST /exploit-rules/{id}/global-exclude` to switch a rule off everywhere.

        Send `uri_pattern` to narrow the exclusion to matching request URIs instead
        of disabling the rule for the whole host; omit it (or send an empty /
        whitespace-only string) for a rule-wide exclusion.

        Re-posting the same (host, rule, uri_pattern) triple UPDATES the existing
        row's reason and author instead of failing, and still answers 201.

        The body is optional — a missing or unparseable body is silently treated as
        an empty one (rule-wide exclusion, empty reason). `disabled_by` is taken
        from the authenticated user in context, not from the body.

        The host's nginx config is regenerated after the write; a regeneration
        failure is logged only and does NOT change this response.

        Requires the `waf:write` scope when called with an API token.
      security:
        - BearerAuth: []
      parameters:
        - name: hostId
          in: path
          required: true
          description: Proxy host UUID
          schema:
            type: string
            format: uuid
        - name: ruleId
          in: path
          required: true
          description: Exploit rule UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExploitRuleExclusionRequest'
      responses:
        '201':
          description: Exclusion created (or the existing one updated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostExploitRuleExclusion'
        '400':
          description: >-
            Host or rule ID missing; or `uri_pattern` is invalid — over 512
            characters, containing `$`, `"` or a control character, or not a
            compilable regex; or `uri_pattern` was sent for a rule whose
            `pattern_type` is not `query_string` or `request_uri`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >-
            Rule not found. Only checked when `uri_pattern` is supplied — a
            rule-wide exclusion for an unknown rule ID reaches the insert and
            surfaces as 500.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Database error writing the exclusion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [Exploit Rules]
      summary: Remove a host exclusion (re-enable the rule for that host)
      description: |
        Deletes the host-scoped exclusion, so the rule blocks again on this host.
        It does NOT delete the rule and does not touch any global exclusion — a
        rule that is also globally excluded stays off despite this call.

        Scope selection: with no `uri_pattern` query parameter the RULE-WIDE
        exclusion (the row with a NULL uri_pattern) is deleted; passing
        `uri_pattern` deletes only the URI-scoped exclusion whose pattern matches
        exactly.

        Answers 204 even when nothing matched — the affected-row count is not
        checked.

        The host's nginx config is regenerated after the delete; a failure there is
        logged only.

        Requires the `waf:write` scope when called with an API token.
      security:
        - BearerAuth: []
      parameters:
        - name: hostId
          in: path
          required: true
          description: Proxy host UUID
          schema:
            type: string
            format: uuid
        - name: ruleId
          in: path
          required: true
          description: Exploit rule UUID
          schema:
            type: string
            format: uuid
        - name: uri_pattern
          in: query
          required: false
          description: >-
            Exact URI regex of the URI-scoped exclusion to remove. Omitted or
            empty removes the rule-wide exclusion instead. Validated with the same
            rules as on create.
          schema:
            type: string
            maxLength: 512
      responses:
        '204':
          description: Exclusion removed (no body)
        '400':
          description: Host or rule ID missing, or `uri_pattern` failed validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /exploit-rules/{id}/global-exclude:
    post:
      tags: [Exploit Rules]
      summary: Exclude an exploit rule on EVERY host (stop it blocking anywhere)
      description: |
        Adds a global exclusion: the rule stops being enforced on every host that
        has `block_exploits` enabled, including hosts created later. The rule row
        itself keeps `enabled: true` — use `POST /exploit-rules/{id}/toggle` to
        turn the rule off in the catalog instead.

        `uri_pattern` narrows the exclusion to matching request URIs; omit it for a
        rule-wide global exclusion.

        Re-posting the same (rule, uri_pattern) pair UPDATES the existing row's
        reason and author and still answers 201.

        The body is optional — a missing or unparseable body is treated as empty.
        `disabled_by` comes from the authenticated user in context.

        All hosts with exploit blocking are regenerated after the write; a
        regeneration failure is logged only and does not change this response.

        Requires the `waf:write` scope when called with an API token.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Exploit rule UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExploitRuleExclusionRequest'
      responses:
        '201':
          description: Global exclusion created (or the existing one updated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalExploitRuleExclusion'
        '400':
          description: >-
            Rule ID missing; or `uri_pattern` invalid (over 512 characters,
            containing `$`, `"` or a control character, or not a compilable
            regex); or `uri_pattern` sent for a rule whose `pattern_type` is not
            `query_string` or `request_uri`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >-
            Rule not found. Only checked when `uri_pattern` is supplied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Database error writing the exclusion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [Exploit Rules]
      summary: Remove a global exclusion (re-enable the rule everywhere)
      description: |
        Deletes the global exclusion, so the rule blocks again on every host with
        exploit blocking on. It does NOT delete the rule, and per-host exclusions
        are untouched — hosts carrying their own exclusion for this rule keep it
        switched off.

        Scope selection: with no `uri_pattern` query parameter the rule-wide global
        exclusion (NULL uri_pattern) is deleted; passing `uri_pattern` deletes only
        the URI-scoped one with that exact pattern.

        Answers 204 even when nothing matched.

        All hosts with exploit blocking are regenerated after the delete; a failure
        there is logged only.

        Requires the `waf:write` scope when called with an API token.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Exploit rule UUID
          schema:
            type: string
            format: uuid
        - name: uri_pattern
          in: query
          required: false
          description: >-
            Exact URI regex of the URI-scoped global exclusion to remove. Omitted
            or empty removes the rule-wide one.
          schema:
            type: string
            maxLength: 512
      responses:
        '204':
          description: Global exclusion removed (no body)
        '400':
          description: Rule ID missing, or `uri_pattern` failed validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ============================================================================
  # Challenge — the visitor-facing CAPTCHA flow
  #
  # /challenge/* is NOT an operator API. These four endpoints are registered
  # before the auth middleware (registerPublicRoutes) and are listed in
  # middleware PublicRoutes, so they need NO bearer token and NO permission —
  # they are reached by an anonymous VISITOR'S BROWSER (and by nginx itself for
  # /validate) while a geo/bot/cloud rule is holding the request. They are
  # documented here for completeness; an API client normally never calls them.
  # Only the /api/v1 rate limiter applies. (/challenge/verify — the JSON sibling
  # of verify-redirect — is documented elsewhere in this file.)
  # ============================================================================
  /challenge/page:
    get:
      tags: [Challenge]
      summary: Render the CAPTCHA challenge page (public, browser-facing)
      description: |
        Returns a complete self-contained HTML page with the reCAPTCHA/Turnstile
        widget, which posts to `/challenge/verify-redirect` once solved. nginx
        redirects blocked visitors here; the response is HTML, never JSON.

        Config resolution: the per-host config is used when `host` is given AND
        that config exists and is enabled, otherwise the global config is used.

        The page reads its own `?return=` value from the browser URL (client-side)
        to build the post-solve redirect; the server itself only reads `host` and
        `reason`.

        Public — no authentication, no permission.
      security: []
      parameters:
        - name: host
          in: query
          required: false
          description: Proxy host UUID whose challenge config and branding to use.
          schema:
            type: string
            format: uuid
        - name: reason
          in: query
          required: false
          description: >-
            Why the challenge is being shown; echoed into the form as
            `challenge_reason`. Defaults to `geo_restriction` when absent or empty.
          schema:
            type: string
            default: geo_restriction
      responses:
        '200':
          description: The challenge page
          content:
            text/html:
              schema:
                type: string
        '403':
          description: >-
            Challenge is disabled — a minimal "Access Denied" HTML page is
            returned instead of the widget.
          content:
            text/html:
              schema:
                type: string
        '500':
          description: Config could not be loaded; a minimal error HTML page
          content:
            text/html:
              schema:
                type: string
  /challenge/verify-redirect:
    post:
      tags: [Challenge]
      summary: Verify a solved CAPTCHA from a form POST and redirect (public, browser-facing)
      description: |
        The form-POST counterpart of `/challenge/verify`. The challenge page posts
        here with `application/x-www-form-urlencoded` (NOT JSON) because a real
        form submission survives extensions that block `fetch()`. On success the
        server sets the bypass cookie and redirects in one hop.

        Success sets cookie `ng_challenge` (Path=/, HttpOnly, SameSite=Lax, Secure
        only when the request scheme is https, Expires = token expiry) and answers
        302 to the sanitised `return_url`.

        `return_url` is sanitised against open redirects: relative paths are kept
        (but not protocol-relative `//host`), absolute URLs are kept only when
        their host matches the request host ignoring port, anything else becomes
        `/`.

        Failure paths never return an error status: a missing `token` or a failed
        CAPTCHA verification answers 302 back to the `Referer` (or `/` when there
        is none), which sends the visitor back to the challenge page.

        Public — no authentication, no permission.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: >-
                    CAPTCHA provider response token. Empty or absent → 302 to the
                    Referer without any verification attempt.
                proxy_host_id:
                  type: string
                  format: uuid
                  description: Proxy host that triggered the challenge; selects the config.
                challenge_reason:
                  type: string
                  description: Recorded on the issued token / challenge log.
                return_url:
                  type: string
                  description: Where to send the visitor after success; sanitised, defaults to `/`.
      responses:
        '302':
          description: >-
            Verified — `Set-Cookie: ng_challenge=…` plus `Location: <return_url>`;
            or NOT verified / no token — `Location: <Referer or />` and no cookie.
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              description: Present only on successful verification.
              schema:
                type: string
        '503':
          description: >-
            The CAPTCHA provider or the challenge config is unavailable. Returns a
            self-refreshing HTML page rather than redirecting, to avoid an infinite
            challenge loop.
          content:
            text/html:
              schema:
                type: string
  /challenge/validate:
    get:
      tags: [Challenge]
      summary: Validate a challenge bypass token (public, called by nginx auth_request)
      description: |
        The `auth_request` target nginx calls on every request to a
        challenge-protected host. Answers with a bare status code and NO body:
        200 lets the request through, 401 makes nginx send the visitor to the
        challenge page.

        All input arrives in headers/cookies, none in the query string:

        - `X-Geo-Blocked: 0` — country is allowed; passes immediately (200) without
          looking at any token.
        - Known search-engine crawler `User-Agent` (Googlebot, bingbot, …) — passes
          immediately (200).
        - `X-Challenge-Token` header, else cookie `ng_challenge` — the token to
          validate. Missing → 401.
        - `X-Proxy-Host-ID` — optional; scopes the token check to that host.

        Public — no authentication, no permission.
      security: []
      parameters:
        - name: X-Geo-Blocked
          in: header
          required: false
          description: '`0` means "not geo-blocked" and short-circuits to 200.'
          schema:
            type: string
        - name: X-Challenge-Token
          in: header
          required: false
          description: Bypass token; takes precedence over the `ng_challenge` cookie.
          schema:
            type: string
        - name: X-Proxy-Host-ID
          in: header
          required: false
          description: Proxy host UUID the token must be valid for.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Allowed — valid token, allowed country, or a known search bot (empty body)
        '401':
          description: No token, or the token is invalid/expired/revoked (empty body)
  /challenge/favicon.ico:
    get:
      tags: [Challenge]
      summary: Favicon and logo for the challenge page (public)
      description: |
        Serves the bundled `favicon.ico`, which the challenge page embeds as its
        logo. Loaded from the assets directory at startup and cached in memory.

        Public — no authentication, no permission.
      security: []
      responses:
        '200':
          description: The icon
          content:
            image/x-icon:
              schema:
                type: string
                format: binary
        '404':
          description: No favicon file was found on disk (empty body)

  # ============================================================================
  # Challenge configuration — the operator-facing half (global singleton)
  # (Per-host config lives at /proxy-hosts/{id}/challenge, documented elsewhere.)
  # ============================================================================
  /challenge-config:
    get:
      tags: [Challenge]
      summary: Get the global CAPTCHA challenge config
      description: |
        The single global config row (the one with a NULL proxy_host_id), used
        whenever a host has no enabled config of its own.

        The stored secret key is NEVER returned — `has_secret_key` reports only
        whether one is set. When no global row exists a non-persisted default is
        returned with an empty `id` (`enabled` false, `challenge_type`
        recaptcha_v2, `token_validity` 86400, `min_score` 0.5, `apply_to` "both",
        `theme` "light" and default page title/message).

        Requires the `settings:read` scope when called with an API token.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Global challenge configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeConfig'
        '500':
          description: Database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags: [Challenge]
      summary: Update the global CAPTCHA challenge config
      description: |
        Partial update — every field is optional and an absent field keeps its
        stored value. Creates the global row when it does not exist yet, so there
        is no separate POST. `secret_key` is write-only: it is stored and only ever
        reported back as `has_secret_key`.

        The update is written in a serializable transaction and audit-logged with
        scope "global".

        Requires the `settings:write` scope when called with an API token.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChallengeConfig'
      responses:
        '200':
          description: Updated global challenge configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeConfig'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          description: Database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /challenge-config/stats:
    get:
      tags: [Challenge]
      summary: Get CAPTCHA challenge statistics
      description: |
        Aggregates `challenge_logs` over a FIXED 24-hour window — the window is
        hardcoded in the handler and cannot be changed by a query parameter.

        `total_challenges` counts rows whose result is presented, passed or failed
        (`expired` rows are excluded). Averages are computed only over rows that
        carry a value and are omitted when they come out zero.

        `active_tokens` is the exception to the 24-hour window: it counts every
        currently valid bypass token (not revoked, `expires_at` in the future)
        regardless of age. Its own query error is swallowed, so a failure there
        shows up as 0 rather than as a 500.

        Requires the `settings:read` scope when called with an API token.
      security:
        - BearerAuth: []
      parameters:
        - name: proxy_host_id
          in: query
          required: false
          description: >-
            Restrict the counts to one proxy host. Omitted or empty aggregates
            across all hosts.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Challenge statistics for the last 24 hours
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeStats'
        '500':
          description: Database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ============================================================================
  # Auth providers — the ForwardAuth verifier registry (#179)
  #
  # These are EXTERNAL verifiers (Authelia / Authentik / custom) that proxy hosts
  # reference to gate traffic through nginx auth_request. They are unrelated to
  # /sso-providers, which is NPG's own admin login (OIDC).
  #
  # Two independent authorization checks apply to every operation below: the
  # caller's ROLE must hold `authprovider:read` / `authprovider:write`, and an API
  # token must additionally carry the `proxy:read` / `proxy:write` /
  # `proxy:delete` scope. A token needs both to succeed.
  # ============================================================================
  /auth-providers:
    get:
      tags: [Auth Providers]
      summary: List ForwardAuth providers
      description: |
        Paginated, newest-first by `created_at`. Envelope is
        `{data, total, page, per_page, total_pages}`; `data` is `[]` (never null)
        when empty.

        No field is masked on read: `provider_url` and the whole `config` object —
        including any shared secret carried in `config.request_headers[].value` —
        come back verbatim. Treat this response as sensitive.

        Role permission `authprovider:read`; API tokens additionally need the
        `proxy:read` scope.
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          description: 1-based page number. Non-numeric or < 1 falls back to 1.
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          required: false
          description: >-
            Page size. Non-numeric or < 1 falls back to 20. There is no upper
            bound.
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated provider list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthProviderListResponse'
        '500':
          description: Database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags: [Auth Providers]
      summary: Create a ForwardAuth provider
      description: |
        Two ways to point at the verifier:

        - Manual URL — send `provider_url`; it must start with `http://` or
          `https://` and contain no whitespace or `; { } # \n \r`. A trailing slash
          is stripped before storing.
        - Docker container (#181) — send `container_name` (plus `container_port`,
          optionally `container_network` and `container_scheme`); the service
          resolves the container's IP and OVERWRITES `provider_url` with
          `scheme://ip:port`. `container_port` is mandatory in this mode.

        `config` is validated only when `type` is `custom` — for the `authelia` and
        `authentik` presets the nginx directives are hardcoded and the config
        fields are ignored.

        Defaults applied on write: `timeout_ms` 5000 (also used when a
        non-positive value is sent) and `enabled` true.

        Role permission `authprovider:write`; API tokens additionally need the
        `proxy:write` scope.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAuthProvider'
      responses:
        '201':
          description: Provider created — the stored row is re-read and returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthProvider'
        '400':
          description: >-
            Unparseable body, or a validation failure whose message contains
            "invalid": bad/missing `provider_url`, an unresolvable container, a
            missing `container_port`, or a custom-config field that would break the
            generated nginx directive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: >-
            Database error. Note an out-of-enum `type` is rejected by a DB CHECK
            constraint and therefore surfaces here as 500, not as 400.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth-providers/{id}:
    get:
      tags: [Auth Providers]
      summary: Get a ForwardAuth provider
      description: |
        Returns the provider object directly (no envelope). Nothing is masked —
        `config.request_headers[].value` may contain a shared secret and is
        returned in clear.

        Role permission `authprovider:read`; API tokens additionally need the
        `proxy:read` scope.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Auth provider UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthProvider'
        '404':
          description: Auth provider not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags: [Auth Providers]
      summary: Update a ForwardAuth provider
      description: |
        Partial update — an absent field is left unchanged.

        Container handling: sending a non-empty `container_name` re-resolves the
        container and overwrites `provider_url` with the resolved address, ignoring
        any `provider_url` in the same body. Sending `container_name` as an EMPTY
        string clears the container binding and keeps the manual `provider_url`.

        `provider_url`, when present, is trailing-slash-stripped and validated;
        `config`, when present, is validated only for `type: custom`.

        Changing a provider triggers a config regeneration of every proxy host that
        references it.

        Role permission `authprovider:write`; API tokens additionally need the
        `proxy:write` scope.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Auth provider UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAuthProvider'
      responses:
        '200':
          description: Updated provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthProvider'
        '400':
          description: >-
            Unparseable body, or a validation failure whose message contains
            "invalid" (bad `provider_url`, unresolvable container, missing
            `container_port`, unsafe custom-config field).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Auth provider not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: >-
            Database error, or the dependent hosts' nginx config could not be
            regenerated — in the latter case the provider row IS already updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [Auth Providers]
      summary: Delete a ForwardAuth provider
      description: |
        Answers 204 regardless of whether the id existed — a delete of an unknown
        id is not reported as 404.

        Proxy hosts referencing the provider are NOT deleted: the foreign key is
        ON DELETE SET NULL, so they are detached and their nginx config is
        regenerated to drop the `auth_request` directives.

        Role permission `authprovider:write`; API tokens additionally need the
        `proxy:delete` scope.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Auth provider UUID
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Provider deleted (no body)
        '500':
          description: Database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Either credential: a session token from `POST /auth/login`, or an API
        token (`ng_...`) from `POST /api-tokens`.

        Endpoints that take the session token **only** declare `SessionAuth`
        instead — see that scheme for which, and why.
    SessionAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Session token from `POST /auth/login` only. **API tokens (`ng_...`) are
        rejected with 401 here.**

        These are the endpoints that manage a human account's credentials and
        interface preferences. A token is a long-lived secret that may be
        pasted into a script or a monitoring system, so allowing one to change
        a password or disable 2FA would turn a leaked read-only token into
        account takeover. Identity and the operational probes (`/auth/me`,
        `/status`, `/health/detailed`) are reachable with either credential. (#249)

  parameters:
    ProxyHostId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Proxy host UUID

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
    User:
      type: object
      description: |
        A user account as returned by the auth endpoints. The password hash, TOTP secret,
        TOTP verification time and backup codes are marked `json:"-"` on the model and are
        never serialised.
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        role:
          type: string
          enum: [admin, user]
          description: Legacy coarse marker kept in sync with the role's is_superuser flag; the `server reset-password` CLI keys on it. Authorization uses role_id, not this.
        role_id:
          type: string
          format: uuid
          nullable: true
          description: Points at the roles table and is the authoritative permission source. Omitted when the account predates RBAC and has no role row.
        must_change_password:
          type: boolean
          description: Set on accounts created by an administrator, and set again by an admin password reset (PUT /users/{id}/password). While true every RESOURCE endpoint returns 403 with code `must_change_password`; the self-service /auth/* endpoints are not gated by it. POST /auth/change-password clears the flag.
        language:
          type: string
          description: UI language (`ko` or `en`). May be empty for an account that never set one.
        font_family:
          type: string
          description: UI font family. May be empty for an account that never set one.
        is_initial_setup:
          type: boolean
          description: True while the account still holds the seeded default credentials. Blocks everything except /auth/change-credentials, /auth/me, /auth/status and /auth/logout with 403 code `initial_setup_required`. Cleared by a successful POST /auth/change-credentials.
        totp_enabled:
          type: boolean
        last_login_at:
          type: string
          format: date-time
        last_login_ip:
          type: string
        login_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProxyHost:
      type: object
      description: |
        A reverse proxy host. Fields marked "0 / empty = use global" fall back to
        the corresponding value in GET /settings when left at their zero value.
      properties:
        id:
          type: string
          format: uuid
        proxy_type:
          type: string
          enum: [http, stream]
          default: http
          description: Anything other than `stream` (case-insensitive) is normalised to `http`.
        domain_names:
          type: array
          items:
            type: string
          description: Domain names for http hosts, or SNI/service labels for stream hosts.
        forward_scheme:
          type: string
          enum: [http, https, tcp, udp]
          description: For stream hosts this is forced to equal stream_protocol.
        forward_host:
          type: string
          description: Upstream hostname or IP. For container-backed hosts this holds the last resolved container IP.
        forward_container_name:
          type: string
          nullable: true
          description: When set, forward_host is resolved server-side from this Docker container's current IP.
        forward_container_network:
          type: string
          nullable: true
          description: Pins container-name resolution to a specific Docker network.
        forward_port:
          type: integer
        stream_listen_host:
          type: string
          description: Listen address for stream hosts. Empty means all addresses.
        stream_listen_port:
          type: integer
          minimum: 1
          maximum: 65535
          description: Listen port for stream hosts.
        stream_protocol:
          type: string
          enum: [tcp, udp]
        stream_ssl_preread:
          type: boolean
          description: TLS passthrough with SNI routing. Mutually exclusive with TLS termination (ssl_enabled) and forced off for UDP.
        stream_accept_proxy_protocol:
          type: boolean
          description: Expect the PROXY protocol header from the client side. Forced off for UDP.
        stream_send_proxy_protocol:
          type: boolean
          description: Send the PROXY protocol header to the upstream. Forced off for UDP.
        stream_proxy_connect_timeout:
          type: integer
          description: Seconds; 0 = nginx default.
        stream_proxy_timeout:
          type: integer
          description: Seconds; 0 = nginx default.
        ssl_enabled:
          type: boolean
        ssl_force_https:
          type: boolean
          description: |
            Redirect http to https. Always false for stream hosts. Auto-corrected
            to false when ssl_enabled is false on create, and on update only when
            ssl_force_https and ssl_enabled are sent in the same request.
        ssl_http2:
          type: boolean
          description: Always false for stream hosts.
        ssl_http3:
          type: boolean
          description: Always false for stream hosts.
        certificate_id:
          type: string
          format: uuid
          nullable: true
        allow_websocket_upgrade:
          type: boolean
          description: Always false for stream hosts.
        cache_enabled:
          type: boolean
          description: Always false for stream hosts.
        cache_static_only:
          type: boolean
          description: Cache only static assets (js, css, images, fonts) instead of all responses.
        cache_ttl:
          type: string
          description: Cache duration such as "30m", "1h" or "7d". Defaults to "7d" on create when empty.
        block_exploits:
          type: boolean
          description: Always false for stream hosts.
        block_exploits_exceptions:
          type: string
          description: |
            Newline-separated URI regexes that bypass exploit/RFI blocking. On
            create, when block_exploits is true and this is empty, it is seeded
            with "^/wp-json/", "^/api/v1/challenge/" and "^/webapi/".
        custom_locations:
          nullable: true
          description: |
            Read-only raw JSON (stored and returned verbatim). No field on the
            create or update request writes this column, and no server-side code
            reads it — custom locations reach nginx through advanced_config.
        advanced_config:
          type: string
          description: |
            Raw nginx directives injected into the server block. Validated against
            a denylist (no include/load_module/lua/alias/root/error_page/…), for
            balanced braces, and proxy_pass-family directives are only accepted
            inside a nested location/if/limit_except block.
        proxy_connect_timeout:
          type: integer
          description: Seconds; 0 = use the global setting.
        proxy_send_timeout:
          type: integer
          description: Seconds; 0 = use the global setting.
        proxy_read_timeout:
          type: integer
          description: Seconds; 0 = use the global setting.
        proxy_buffering:
          type: string
          enum: ["on", "off", ""]
          description: Empty string = use the global setting.
        proxy_request_buffering:
          type: string
          enum: ["on", "off", ""]
          description: Empty string = use the global setting.
        client_max_body_size:
          type: string
          description: e.g. "100m". Empty string = use the global setting.
        proxy_max_temp_file_size:
          type: string
          description: e.g. "0" or "1024m". Empty string = use the global setting.
        waf_enabled:
          type: boolean
          description: Only consulted when waf_use_global is false. Always false for stream hosts.
        waf_mode:
          type: string
          enum: [detection, blocking]
          description: Defaults to "blocking" on create when empty. Only consulted when waf_use_global is false.
        waf_paranoia_level:
          type: integer
          minimum: 1
          maximum: 4
          description: OWASP CRS paranoia level. Out-of-range values are coerced to 1 on create. Only consulted when waf_use_global is false.
        waf_anomaly_threshold:
          type: integer
          minimum: 1
          maximum: 100
          description: CRS anomaly score at which a request is blocked; lower is stricter. Values below 1 are coerced to 5 on create. Only consulted when waf_use_global is false.
        waf_use_global:
          type: boolean
          description: |
            WAF inheritance switch (the "inherit" leg of the tri-state).
            false — the host uses its own four WAF columns above: waf_enabled true
            is an override with the host's own settings, waf_enabled false turns
            WAF off for this host regardless of the global default.
            true — inherit: while the nginx/ModSecurity config is generated, the
            host's waf_enabled, waf_mode, waf_paranoia_level and
            waf_anomaly_threshold are replaced by the values from the global WAF
            default (GET /settings/global-waf) on a copy of the host; the stored
            row is never mutated, so this endpoint keeps returning the host's own
            stored WAF columns, not the effective ones. If no global WAF row
            exists, the host's own columns are used.
        access_list_id:
          type: string
          format: uuid
          nullable: true
          description: Always null for stream hosts.
        auth_provider_id:
          type: string
          format: uuid
          nullable: true
          description: |
            ForwardAuth (auth_request) provider. Rejected with 409 when the host
            also has geo challenge_mode on, when advanced_config declares a
            custom `location /`, or when the provider type is authelia/authentik
            and the host has ssl_enabled false. Ignored for stream hosts. (Cloud
            challenge_mode is NOT part of this check.)
        auth_bypass_paths:
          type: array
          items:
            type: string
          description: Paths exempt from ForwardAuth.
        enabled:
          type: boolean
          description: Disabled hosts keep their database row but get no nginx config.
        is_favorite:
          type: boolean
          description: Read-only here; toggled through PUT /proxy-hosts/{id}/favorite. Favourites sort first in the list endpoint.
        config_status:
          type: string
          enum: [ok, error]
          description: Read-only. Result of the last config generation for this host.
        config_error:
          type: string
          description: Read-only. Error text from the last failed config generation; empty when config_status is ok.
        ddns_enabled:
          type: boolean
          description: Opt in to auto-registering this host's domains as managed DDNS records.
        ddns_provider_id:
          type: string
          format: uuid
          nullable: true
          description: Required when ddns_enabled is true; the provider's type must be cloudflare, duckdns or dynu, otherwise the write is rejected with 400.
        ddns_proxied:
          type: boolean
          description: Default Cloudflare "proxied" flag for the managed DDNS records of this host.
        meta:
          nullable: true
          description: Read-only raw JSON metadata blob; not writable through the create or update request.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateProxyHost:
      type: object
      description: |
        Create payload. Booleans are plain values, so an omitted boolean is
        created as false. Fields the model has but this request does not
        (custom_locations, is_favorite, config_status, config_error, meta) cannot
        be set at creation time.

        Only domain_names is unconditionally required: forward_host is required
        only when forward_container_name is absent, and forward_port only for
        stream hosts (http hosts default it to 80).
      required: [domain_names]
      properties:
        proxy_type:
          type: string
          enum: [http, stream]
          default: http
        domain_names:
          type: array
          items:
            type: string
          minItems: 1
          description: Validated as domain names for http hosts, or as stream labels for stream hosts.
        forward_scheme:
          type: string
          enum: [http, https, tcp, udp]
          default: http
          description: Defaults to "http" for http hosts; for stream hosts it is overwritten with stream_protocol.
        forward_host:
          type: string
          description: Required unless forward_container_name is set. Must be a valid hostname or IP.
        forward_container_name:
          type: string
          description: When set, forward_host is resolved from this container and the hostname/IP validation is skipped.
        forward_container_network:
          type: string
        forward_port:
          type: integer
          minimum: 1
          maximum: 65535
          description: Defaults to 80 for http hosts when 0. Required (1-65535) for stream hosts.
        stream_listen_host:
          type: string
          description: Stream hosts only. "", "*", "0.0.0.0" and "::" all mean all addresses.
        stream_listen_port:
          type: integer
          minimum: 1
          maximum: 65535
          description: Required when proxy_type is stream.
        stream_protocol:
          type: string
          enum: [tcp, udp]
          default: tcp
        stream_ssl_preread:
          type: boolean
          default: false
          description: Rejected together with ssl_enabled (TLS termination and passthrough are mutually exclusive); forced false for UDP.
        stream_accept_proxy_protocol:
          type: boolean
          default: false
        stream_send_proxy_protocol:
          type: boolean
          default: false
        stream_proxy_connect_timeout:
          type: integer
          default: 0
        stream_proxy_timeout:
          type: integer
          default: 0
        ssl_enabled:
          type: boolean
          default: false
          description: For stream hosts this means TLS termination and requires certificate_id.
        ssl_force_https:
          type: boolean
          default: false
        ssl_http2:
          type: boolean
          default: false
        ssl_http3:
          type: boolean
          default: false
        certificate_id:
          type: string
          format: uuid
          description: Validated to exist for http hosts.
        allow_websocket_upgrade:
          type: boolean
          default: false
        cache_enabled:
          type: boolean
          default: false
        cache_static_only:
          type: boolean
          default: false
        cache_ttl:
          type: string
          description: Defaults to "7d" when empty.
        block_exploits:
          type: boolean
          default: false
        block_exploits_exceptions:
          type: string
        waf_enabled:
          type: boolean
          default: false
        waf_mode:
          type: string
          enum: [detection, blocking]
          description: Defaults to "blocking" when empty.
        waf_paranoia_level:
          type: integer
          minimum: 1
          maximum: 4
          description: Coerced to 1 when outside 1-4.
        waf_anomaly_threshold:
          type: integer
          minimum: 1
          maximum: 100
          description: Coerced to 5 when below 1.
        waf_use_global:
          type: boolean
          default: false
          description: See ProxyHost.waf_use_global — true makes the host inherit the global WAF default instead of the four waf_* fields above.
        access_list_id:
          type: string
          format: uuid
          description: Validated to exist for http hosts.
        auth_provider_id:
          type: string
          format: uuid
        auth_bypass_paths:
          type: array
          items:
            type: string
        advanced_config:
          type: string
        proxy_connect_timeout:
          type: integer
        proxy_send_timeout:
          type: integer
        proxy_read_timeout:
          type: integer
        proxy_buffering:
          type: string
          enum: ["on", "off", ""]
        proxy_request_buffering:
          type: string
          enum: ["on", "off", ""]
        client_max_body_size:
          type: string
        proxy_max_temp_file_size:
          type: string
        enabled:
          type: boolean
          description: Omitting this creates a disabled host (Go zero value false); send true explicitly to generate nginx config immediately.
        ddns_enabled:
          type: boolean
          default: false
        ddns_provider_id:
          type: string
          format: uuid
        ddns_proxied:
          type: boolean
          default: false
    UpdateProxyHost:
      type: object
      description: |
        Partial update. Every field below is a POINTER in the Go request struct
        (or a slice/string checked for emptiness), so a field that is ABSENT from
        the JSON body leaves the stored column untouched — including booleans:
        sending `{"enabled": false}` disables the host, omitting `enabled`
        does not.

        Exceptions to the "absent = unchanged" rule, because these are compared
        against their zero value rather than nil: `proxy_type`, `forward_scheme`
        and `forward_host` are ignored when empty, `forward_port` is ignored when
        0, and `domain_names` is ignored when empty. `auth_bypass_paths` is NOT
        one of them — it is nil-checked, so sending `[]` clears the stored paths.

        For the nullable id fields (`certificate_id`, `access_list_id`,
        `auth_provider_id`, `ddns_provider_id`, `forward_container_name`,
        `forward_container_network`) sending an EMPTY STRING clears the value;
        omitting the field leaves it unchanged.
      properties:
        proxy_type:
          type: string
          enum: [http, stream]
        domain_names:
          type: array
          items:
            type: string
        forward_scheme:
          type: string
          enum: [http, https, tcp, udp]
        forward_host:
          type: string
        forward_container_name:
          type: string
          nullable: true
        forward_container_network:
          type: string
          nullable: true
        forward_port:
          type: integer
          minimum: 1
          maximum: 65535
        stream_listen_host:
          type: string
        stream_listen_port:
          type: integer
          minimum: 1
          maximum: 65535
        stream_protocol:
          type: string
          enum: [tcp, udp]
        stream_ssl_preread:
          type: boolean
        stream_accept_proxy_protocol:
          type: boolean
        stream_send_proxy_protocol:
          type: boolean
        stream_proxy_connect_timeout:
          type: integer
        stream_proxy_timeout:
          type: integer
        ssl_enabled:
          type: boolean
        ssl_force_https:
          type: boolean
        ssl_http2:
          type: boolean
        ssl_http3:
          type: boolean
        certificate_id:
          type: string
          nullable: true
          description: Empty string clears the certificate.
        allow_websocket_upgrade:
          type: boolean
        cache_enabled:
          type: boolean
        cache_static_only:
          type: boolean
        cache_ttl:
          type: string
        block_exploits:
          type: boolean
        block_exploits_exceptions:
          type: string
        waf_enabled:
          type: boolean
        waf_mode:
          type: string
          enum: [detection, blocking]
        waf_paranoia_level:
          type: integer
          minimum: 1
          maximum: 4
        waf_anomaly_threshold:
          type: integer
          minimum: 1
          maximum: 100
        waf_use_global:
          type: boolean
          description: See ProxyHost.waf_use_global. Send false to switch the host back to its own WAF columns, true to inherit the global default.
        access_list_id:
          type: string
          nullable: true
          description: Empty string clears the access list.
        auth_provider_id:
          type: string
          nullable: true
          description: Empty string clears the ForwardAuth provider.
        auth_bypass_paths:
          type: array
          items:
            type: string
        advanced_config:
          type: string
        proxy_connect_timeout:
          type: integer
        proxy_send_timeout:
          type: integer
        proxy_read_timeout:
          type: integer
        proxy_buffering:
          type: string
          enum: ["on", "off", ""]
        proxy_request_buffering:
          type: string
          enum: ["on", "off", ""]
        client_max_body_size:
          type: string
        proxy_max_temp_file_size:
          type: string
        enabled:
          type: boolean
        ddns_enabled:
          type: boolean
        ddns_provider_id:
          type: string
          nullable: true
          description: Empty string clears the DDNS provider.
        ddns_proxied:
          type: boolean
    Certificate:
      type: object
      properties:
        id:
          type: string
          format: uuid
        domain_names:
          type: array
          items:
            type: string
        dns_provider_id:
          type: string
          format: uuid
          description: DNS-01 provider used for issuance; absent for uploaded/self-signed certs
        status:
          type: string
          enum: [pending, issued, expired, error, renewing]
        provider:
          type: string
          enum: [letsencrypt, selfsigned, custom]
        auto_renew:
          type: boolean
        expires_at:
          type: string
          format: date-time
        issued_at:
          type: string
          format: date-time
        renewal_attempted_at:
          type: string
          format: date-time
        error_message:
          type: string
        certificate_path:
          type: string
        private_key_path:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        dns_provider:
          $ref: '#/components/schemas/DNSProvider'
    RateLimit:
      type: object
      description: A proxy host's own rate-limit row. This is the stored row, not the value in force after global-default resolution.
      properties:
        id:
          type: string
          format: uuid
        proxy_host_id:
          type: string
          format: uuid
        enabled:
          type: boolean
          description: true = override — this host runs its own limit and the global default is ignored (disable_global has no effect in this state).
        requests_per_second:
          type: integer
          minimum: 1
        burst_size:
          type: integer
          minimum: 1
        zone_size:
          type: string
          description: nginx shared memory zone size, e.g. "10m".
        limit_by:
          type: string
          enum: [ip, uri, ip_uri]
          description: nginx limit_req key — `uri` keys on $request_uri, `ip_uri` on client IP plus URI; any other value (including `ip`) keys on the client IP alone.
        limit_response:
          type: integer
          description: HTTP status returned to limited requests, e.g. 429.
        whitelist_ips:
          type: string
          description: >-
            Comma- or newline-separated IPs and CIDR ranges exempt from the
            limit. Stored as text, not an array. A `# comment` suffix is
            allowed; entries are normalized to their network address.
        disable_global:
          type: boolean
          description: |
            The "disable" leg of the rate-limit tri-state; only consulted when
            enabled is false. true = this host is opted out: no rate limiting and
            the global rate-limit default (GET /settings/global-rate-limit) is NOT
            applied. false = inherit — the global values are applied under this
            host's own nginx limit_req zone. Inherit is the combination
            enabled=false AND disable_global=false, or no rate-limit row at all.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    BotFilter:
      type: object
      description: A proxy host's own bot-filter row. This is the stored row, not the value in force after global-default resolution.
      properties:
        id:
          type: string
          format: uuid
        proxy_host_id:
          type: string
          format: uuid
        enabled:
          type: boolean
          description: true = override — this host runs its own bot filter and the global default is ignored (disable_global has no effect in this state).
        block_bad_bots:
          type: boolean
          description: Block the built-in bad-bot user agent list (SEO crawlers, scrapers, scanners).
        block_ai_bots:
          type: boolean
          description: Block the built-in AI crawler list (GPTBot, ClaudeBot, CCBot, …).
        allow_search_engines:
          type: boolean
          description: Allow the built-in search engine and link-preview bot list through the filter.
        block_suspicious_clients:
          type: boolean
          description: Block generic HTTP client libraries and headless browsers (curl, python-requests, puppeteer, …).
        custom_blocked_agents:
          type: string
          description: Additional user agent patterns to block. Free-form text, not an array.
        custom_allowed_agents:
          type: string
          description: Additional user agent patterns to allow. Free-form text, not an array.
        challenge_suspicious:
          type: boolean
          description: Show a CAPTCHA challenge to suspicious clients instead of blocking them.
        disable_global:
          type: boolean
          description: |
            The "disable" leg of the bot-filter tri-state; only consulted when
            enabled is false. true = this host is opted out: no bot filtering and
            the global bot-filter default (GET /settings/global-bot-filter) is NOT
            applied. false = inherit.

            Inherit has no field of its own: it is enabled=false AND
            disable_global=false, or no bot-filter row at all, in which case the
            global default applies whenever the global row is enabled.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SecurityHeaders:
      type: object
      description: A proxy host's own security-headers row. This is the stored row, not the value in force after global-default resolution.
      properties:
        id:
          type: string
          format: uuid
        proxy_host_id:
          type: string
          format: uuid
        enabled:
          type: boolean
          description: true = override — this host emits its own headers and the global default is ignored (disable_global has no effect in this state).
        hsts_enabled:
          type: boolean
        hsts_max_age:
          type: integer
        hsts_include_subdomains:
          type: boolean
        hsts_preload:
          type: boolean
        x_frame_options:
          type: string
          description: Emitted verbatim as the X-Frame-Options value when non-empty; empty means the header is not emitted. Conventionally DENY or SAMEORIGIN, but not validated server-side.
        x_content_type_options:
          type: boolean
          description: Emit the X-Content-Type-Options nosniff header.
        x_xss_protection:
          type: boolean
        referrer_policy:
          type: string
        content_security_policy:
          type: string
        permissions_policy:
          type: string
        custom_headers:
          type: object
          additionalProperties:
            type: string
          description: |
            Extra response headers as name/value pairs. Persisted, returned,
            cloned and backed up — but no nginx template reads it, so these
            headers are never actually emitted.
        disable_global:
          type: boolean
          description: |
            The "disable" leg of the security-headers tri-state; only consulted
            when enabled is false. true = this host is opted out: no managed
            security headers and the global default (GET
            /settings/global-security-headers) is NOT applied. false = inherit.
            Inherit is the combination enabled=false AND disable_global=false, or
            no security-headers row at all.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    GeoRestriction:
      type: object
      description: A proxy host's own geo-blocking row. This is the stored row, not the value in force after global-default resolution.
      properties:
        id:
          type: string
          format: uuid
        proxy_host_id:
          type: string
          format: uuid
        mode:
          type: string
          enum: [whitelist, blacklist]
        countries:
          type: array
          items:
            type: string
          description: ISO 3166-1 alpha-2 country codes.
        allowed_ips:
          type: array
          items:
            type: string
          description: |
            IPs/CIDRs that bypass geo blocking. These are preserved in every
            inheritance state — the cloud-provider and bot-filter template
            sections read them as priority-allow IPs even when geo blocking is
            off — and are unioned with the global default's allowed_ips when the
            host inherits.
        allow_private_ips:
          type: boolean
          description: Allow RFC1918 ranges (10.x, 172.16-31.x, 192.168.x) through the geo block.
        allow_search_bots:
          type: boolean
          description: Allow known search engine bots through the geo block.
        enabled:
          type: boolean
          description: |
            true = override: this host runs its own geo restriction and the global
            default is ignored (disable_global has no effect in this state).
        challenge_mode:
          type: boolean
          description: Show a CAPTCHA challenge instead of blocking outright.
        disable_global:
          type: boolean
          description: |
            The "disable" leg of the geo tri-state; only consulted when enabled is
            false. true = this host is opted out: no geo blocking at all and the
            global geo default (GET /settings/global-geo) is NOT applied — only
            allowed_ips survive, for the cloud/bot priority-allow sections.
            false = inherit.

            There is no explicit "inherit" field: inherit is the combination
            enabled=false AND disable_global=false, and also the case where the
            host has no geo row at all. In that state the global default applies
            whenever the global row itself is enabled.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Upstream:
      type: object
      description: Per-host upstream (load balancing) pool. Replaces the single forward_host/forward_port target when configured.
      properties:
        id:
          type: string
          format: uuid
        proxy_host_id:
          type: string
          format: uuid
        name:
          type: string
        scheme:
          type: string
          enum: [http, https]
          description: Protocol used to reach the upstream servers. Stored as "https" only for exactly that value; an empty request value becomes "http" (any other value is rejected with 400 before it reaches storage).
        servers:
          type: array
          items:
            $ref: '#/components/schemas/UpstreamServer'
        load_balance:
          type: string
          enum: [round_robin, least_conn, ip_hash, random]
        health_check_enabled:
          type: boolean
        health_check_interval:
          type: integer
          description: Seconds between checks.
        health_check_timeout:
          type: integer
          description: Seconds before a check is considered failed.
        health_check_path:
          type: string
        health_check_expected_status:
          type: integer
        keepalive:
          type: integer
          description: Size of the keepalive connection cache to the upstream.
        is_healthy:
          type: boolean
        last_check_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    GlobalSettings:
      type: object
      properties:
        worker_processes:
          type: string
        worker_connections:
          type: integer
        keepalive_timeout:
          type: integer
        client_max_body_size:
          type: string
        gzip_enabled:
          type: boolean
        brotli_enabled:
          type: boolean
        ssl_protocols:
          type: array
          items:
            type: string
    SystemSettings:
      type: object
      properties:
        geoip_enabled:
          type: boolean
        maxmind_account_id:
          type: string
        maxmind_license_key:
          type: string
          description: Masked in responses
        geoip_auto_update:
          type: boolean
        geoip_update_interval:
          type: string
        acme_enabled:
          type: boolean
        acme_email:
          type: string
        acme_staging:
          type: boolean
    Dashboard:
      type: object
      description: Main dashboard summary returned by GET /dashboard
      properties:
        system_health:
