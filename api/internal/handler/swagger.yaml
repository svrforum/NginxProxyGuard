        total_proxy_hosts:
          type: integer
        active_proxy_hosts:
          type: integer
        total_redirect_hosts:
          type: integer
        total_certificates:
          type: integer
        expiring_certificates:
          type: integer
        requests_chart:
          type: array
          items:
            $ref: '#/components/schemas/ChartDataPoint'
        bandwidth_chart:
          type: array
          items:
            $ref: '#/components/schemas/ChartDataPoint'
        status_code_chart:
          type: array
          items:
            $ref: '#/components/schemas/StatusCodePoint'
        security_chart:
          type: array
          items:
            $ref: '#/components/schemas/SecurityChartPoint'
        top_hosts:
          type: array
          items:
            $ref: '#/components/schemas/HostStat'
        top_countries:
          type: array
          items:
            $ref: '#/components/schemas/CountryStat'
        top_paths:
