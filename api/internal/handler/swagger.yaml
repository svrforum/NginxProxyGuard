                  country_db:
                    type: boolean
                  asn_db:
                    type: boolean
                  last_updated:
                    type: string
                    format: date-time
  /system-settings/geoip/update:
    post:
      tags: [GeoIP]
      summary: Update GeoIP databases
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                force:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Update initiated

  # ============================================================================
  # Logs
  # ============================================================================
  /audit-logs:
    get:
      tags: [Logs]
      summary: List audit logs
      description: |
        Paginated audit trail. Pagination is **limit/offset, not page** — a `page`
        parameter is not read and has no effect.

        Filters that do not validate are dropped rather than rejected, so a bad value
        widens the result instead of returning 400: `user_id` must parse as a UUID
        (an invalid one would otherwise reach the uuid column and raise a 500), and
        `start_time` / `end_time` must be RFC3339. `limit` and `offset` fall back to
        their defaults when non-numeric and are clamped into range rather than
        rejected.

        Each entry carries `action_label`, a Korean display name derived from
        `action` via a fixed table (falling back to the raw value); it is computed per
        response and is not stored.
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          description: Rows per page. Non-numeric falls back to 50; values are clamped into 1–100.
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          description: Rows to skip. Non-numeric falls back to 0; values are clamped into 0–10000.
          schema:
            type: integer
            default: 0
            minimum: 0
            maximum: 10000
        - name: action
          in: query
          description: Exact action match. See `/audit-logs/actions` for the values present.
          schema:
            type: string
        - name: resource_type
          in: query
          description: Exact resource-type match. See `/audit-logs/resource-types` for the values present.
          schema:
            type: string
        - name: search
          in: query
          description: Free-text search passed through to the repository filter.
          schema:
            type: string
        - name: user_id
          in: query
          description: Filter by acting user. Silently ignored unless it parses as a UUID.
          schema:
            type: string
            format: uuid
        - name: start_time
          in: query
          description: Inclusive lower bound, RFC3339. Silently ignored if unparseable.
          schema:
            type: string
            format: date-time
        - name: end_time
          in: query
          description: Inclusive upper bound, RFC3339. Silently ignored if unparseable.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: One page of audit log entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogListResponse'
        '500':
          description: Database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /system-logs:
    get:
      tags: [Logs]
      summary: List system logs
      description: |
        Container and internal event logs, distinct from the nginx access logs served by
        `/logs`. Uses limit/offset, not page/per_page. `source` and `level` values
        outside their enum are dropped so the filter is simply not applied.
      security:
        - BearerAuth: []
      parameters:
        - name: source
          in: query
          schema:
            type: string
            enum:
              - docker_api
              - docker_nginx
              - docker_db
              - docker_ui
              - health_check
              - internal
              - scheduler
              - backup
              - certificate
              - audit
              - api_token
        - name: level
          in: query
          schema:
            type: string
            enum: [debug, info, warn, error, fatal]
        - name: container
          in: query
          description: Container name filter.
          schema:
            type: string
        - name: component
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: start_time
          in: query
          description: RFC3339. Unparseable values are ignored.
          schema:
            type: string
            format: date-time
        - name: end_time
          in: query
          description: RFC3339. Unparseable values are ignored.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          description: Clamped to 1-100.
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          description: Clamped to 0-10000.
          schema:
            type: integer
            default: 0
            minimum: 0
            maximum: 10000
      responses:
        '200':
          description: System log entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  logs:
                    type: array
                    items:
                      $ref: '#/components/schemas/SystemLogEntry'
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
  /api-tokens:
    get:
      tags: [API Tokens]
      summary: List API tokens
      description: |
        Requires `apitoken:read` (plus `settings:read` when calling with an API token).
        Returns a BARE ARRAY, not a `data` wrapper.

        Scope: the caller's own tokens. `?all=true` widens this to every account's tokens,
        but only for a session whose legacy `role` column is `admin`; it is ignored for
        API-token callers and for non-admin sessions.
      security:
        - BearerAuth: []
      parameters:
        - name: all
          in: query
          required: false
          schema:
            type: string
            enum: ['true']
          description: Only honoured for a session user whose legacy role is `admin`; lists every account's tokens.
      responses:
        '200':
          description: Tokens
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/APIToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller lacks apitoken:read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags: [API Tokens]
      summary: Create an API token
      description: |
        Requires `apitoken:write` (plus `settings:write` when calling with an API token).
        The token is owned by the calling account.

        `permissions` must be non-empty and every entry must be `*` or one of the 15
        legacy resource scopes from `GET /api-tokens/permissions` — the finer `area:verb`
        strings used by roles are NOT accepted here. A token cannot be granted more than
        the issuer's own role allows: an over-broad entry is refused with 403.

        The full secret is returned exactly once, in the `token` field of this response.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, permissions]
              properties:
                name:
                  type: string
                permissions:
                  type: array
                  minItems: 1
                  items:
                    type: string
                  description: '`*` or entries from GET /api-tokens/permissions.'
                allowed_ips:
                  type: array
                  items:
                    type: string
                  description: Exact IPs or CIDR blocks. Empty means no IP restriction.
                rate_limit:
                  type: integer
                  description: Per-token request rate override; omit to use the global limit.
                expires_in:
                  type: string
                  description: >-
                    Relative lifetime as <positive integer><unit>, where unit is h (hours),
                    d (days), w (weeks), m (30-day months) or y (365-day years) — e.g. "30d",
                    "1y". The literal "never", or omitting the field, means no expiry.
      responses:
        '201':
          description: Token created — `token` is the only time the secret is shown
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APITokenWithSecret'
        '400':
          description: Missing name, empty permissions, an unknown permission string, or a malformed expires_in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller lacks apitoken:write, or asked for a permission its own role does not hold
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api-tokens/{id}:
    get:
      tags: [API Tokens]
      summary: Get an API token
      description: |
        Requires `apitoken:read`. Ownership is enforced in the handler on top of the
        permission: unless the caller is a session user whose legacy `role` is `admin`,
        the token must belong to the calling account.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller lacks apitoken:read, or the token belongs to another account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Token not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags: [API Tokens]
      summary: Update an API token
      description: |
        Requires `apitoken:write` and the same ownership rule as GET. Partial update:
        omitted fields are left alone. Supplying `permissions` replaces the set wholesale
        and is re-checked against the caller's own role. The secret itself can never be
        changed or re-read.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                permissions:
                  type: array
                  items:
                    type: string
                allowed_ips:
                  type: array
                  items:
                    type: string
                rate_limit:
                  type: integer
                is_active:
                  type: boolean
                  description: Set false to suspend the token without revoking it.
      responses:
        '200':
          description: Updated token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIToken'
        '400':
          description: Unknown permission string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller lacks apitoken:write, the token belongs to another account, or a requested permission exceeds the caller's own role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Token not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [API Tokens]
      summary: Delete an API token
      description: Requires `apitoken:write` and the same ownership rule as GET. Permanent — use revoke to keep the audit trail.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Token deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller lacks apitoken:write, or the token belongs to another account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Token not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api-tokens/{id}/revoke:
    post:
      tags: [API Tokens]
      summary: Revoke an API token
      description: |
        Requires `apitoken:write` and the same ownership rule as GET. The row is kept
        (revoked, not deleted). The body is optional — a malformed body is ignored rather
        than rejected, and an absent reason is recorded as "manually revoked".
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Token revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: token revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller lacks apitoken:write, or the token belongs to another account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Token not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /geo/countries:
    get:
      tags: [GeoIP]
      summary: Get country codes
      description: Get list of available country codes for geo restriction
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Country codes
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    code:
                      type: string
                    name:
                      type: string
  /banned-ips:
    get:
      tags: [Security]
      summary: List banned IPs
      security:
        - BearerAuth: []
      parameters:
        - name: filter
          in: query
          description: |
            "global" lists bans not attached to any host; "host" lists host-scoped bans
            (narrowed to `proxy_host_id` when that is also supplied). Any other value —
            including omitting it — lists everything, optionally narrowed by
            `proxy_host_id`.
          schema:
            type: string
            enum: [global, host]
        - name: proxy_host_id
          in: query
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: per_page
          in: query
          description: Values outside 1-100 fall back to 20.
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Paginated banned IPs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BannedIPListResponse'

