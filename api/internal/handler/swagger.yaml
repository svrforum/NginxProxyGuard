  # ============================================================================
  # URI Blocking
  # ============================================================================
  /proxy-hosts/{id}/uri-block:
    get:
      tags: [Security]
      summary: Get URI block config for a proxy host
      description: |
        Returns the host's stored URI block row. When no row exists a default
        object is synthesized (`enabled` false, empty `rules`, empty
        `exception_ips`, `allow_private_ips` true) — it is not persisted.
        Requires the `proxy:read` scope when called with an API token.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProxyHostId'
      responses:
        '200':
          description: URI block configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/URIBlockConfig'

    put:
      tags: [Security]
      summary: Create or replace the URI block config
      description: |
        Full upsert — `rules`, `exception_ips` and `allow_private_ips` are written
        as sent, so omitting `rules` clears every rule. `enabled` and
        `allow_private_ips` default to true when omitted. Rules with an empty or
        `temp-` prefixed id get a fresh UUID. Every entry in `exception_ips` is
        validated as an IP or CIDR. Requires the `proxy:write` scope when called
        with an API token.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProxyHostId'
        - name: skip_reload
          in: query
          schema:
            type: string
            enum: ["true"]
          description: When exactly `true`, the settings are saved but the host's nginx config is not regenerated or reloaded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateURIBlock'
      responses:
        '200':
          description: URI block saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/URIBlockConfig'
        '400':
          description: Invalid IP address(es) in exception_ips, or malformed body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [Security]
      summary: Delete the URI block config
      description: Removes the host's URI block row. Requires the `proxy:delete` scope when called with an API token.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProxyHostId'
      responses:
        '204':
          description: URI block deleted
