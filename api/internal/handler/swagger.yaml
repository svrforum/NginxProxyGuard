  /bots/known:
    get:
      tags: [Security]
      summary: Get list of known bots
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of known bots (good and bad)

  # ============================================================================
  # Security Headers Presets
  # ============================================================================
  /security-headers/presets:
    get:
      tags: [Security]
      summary: Get security header presets
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Available presets
  /proxy-hosts/{id}/security-headers/preset/{preset}:
    post:
      tags: [Security]
      summary: Apply a security header preset
      description: |
        Overwrites the host's security headers with a named built-in preset by
        running it through the same upsert as PUT, so `permissions_policy` and
        `custom_headers` are cleared (no preset sets them) while `disable_global`
        keeps its stored value. Every preset sets `enabled` true. Takes no
        request body. Requires the `proxy:write` scope when called with an API
        token.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProxyHostId'
        - name: preset
          in: path
          required: true
          schema:
            type: string
            enum: [strict, moderate, relaxed]
          description: Preset name; any other value returns 400.
      responses:
        '200':
          description: Preset applied; the resulting security headers are returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityHeaders'
        '400':
          description: Invalid preset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /settings/global-waf:
    get:
      tags: [Settings]
      summary: Get the global WAF default
      description: |
        Returns the singleton `global_waf` row. When no row exists yet a default
        object is returned (never 404): `enabled=false`, `mode="detection"`,
        `paranoia_level=1`, `anomaly_threshold=5`.

        **How a host resolves WAF** (`resolveWAF`, api/internal/service/waf_resolve.go)
        — this is the odd one out. There is no `disable_global` flag for WAF.
        The switch lives on the proxy host itself, as `waf_use_global`:

        - `waf_use_global=true` — for config generation the host's
          `waf_enabled`, `waf_mode`, `waf_paranoia_level` and
          `waf_anomaly_threshold` are all replaced by this global's `enabled`,
          `mode`, `paranoia_level` and `anomaly_threshold`. The host row itself
          is not modified, so `GET /proxy-hosts/{id}` keeps returning the host's
          own stored columns — they are simply not what nginx is running.
          If this global has `enabled=false`, an inheriting host gets WAF off.
        - `waf_use_global=false` — the host's own WAF columns are used verbatim.
          A host turns WAF off for itself with `waf_use_global=false` plus
          `waf_enabled=false`.

        ModSecurity rules are not re-parsed by `nginx -s reload`, so a change
        here only reaches the running WAF after the proxy container restarts.
        The regenerated `modsec/host_{id}.conf` files are correct immediately.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Global WAF default
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalWAF'

    put:
      tags: [Settings]
      summary: Update the global WAF default
      description: |
        Partial update. Omitted fields keep their stored value, but the sentinel
        differs per field because only `enabled` is a pointer: `mode` is ignored
        when empty, and `paranoia_level` / `anomaly_threshold` are ignored when
        `<= 0`.

        On success all proxy host configs are regenerated before the response is
        sent; a regeneration failure returns 500 with the new values already
        persisted. Applies to the running WAF only after a proxy restart.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGlobalWAF'
      responses:
        '200':
          description: Updated global WAF default
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalWAF'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          description: |
            Config regeneration failed, or the database rejected the values —
            `paranoia_level` must be 1-4 and `anomaly_threshold` 1-100
            (CHECK constraints; the API does not pre-validate them).
  /settings/global-geo:
    get:
      tags: [Settings]
      summary: Get the global GeoIP default
      description: |
        Returns the singleton `global_geo_restrictions` row. When no row exists
        yet a default object is returned (never 404): `enabled=false`,
        `mode="blacklist"`, empty `countries`/`allowed_ips`,
        `allow_private_ips=true`.

        **How a host resolves geo** (`resolveGeo`, api/internal/service/geo_resolve.go):

        - **override** — the host's own geo row has `enabled=true`: that row is
          used as-is and this global is ignored completely (no merging of
          countries).
        - **disable** — the host's geo row has `disable_global=true` (and
          `enabled=false`): no geo blocking at all. The host's `allowed_ips` are
          still carried through, because the cloud-provider and bot-filter nginx
          sections read `allowed_ips` as priority-allow IPs independently of geo.
        - **inherit** — no host geo row, or one with `enabled=false` and
          `disable_global=false`: this global applies when `enabled=true`. The
          effective `allowed_ips` is the union of the host's and this global's
          (host entries first, duplicates removed); every other field comes from
          this global. If this global is disabled, only the host's `allowed_ips`
          survive.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Global geo default
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalGeoRestriction'

    put:
      tags: [Settings]
      summary: Update the global GeoIP default
      description: |
        Partial update — every omitted field keeps its stored value. `countries`
        and `allowed_ips` are replaced wholesale when present; send `[]` to clear
        one, omit it to keep it.

        On success all proxy host configs are regenerated before the response is
        sent, so inheriting hosts pick up the new default immediately.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGlobalGeoRestriction'
      responses:
        '200':
          description: Updated global geo default
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalGeoRestriction'
        '400':
          description: Malformed body, or `mode` is neither `whitelist` nor `blacklist`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Update succeeded but regenerating the host configs failed
  /settings/global-bot-filter:
    get:
      tags: [Settings]
      summary: Get the global bot filter default
      description: |
        Returns the singleton `global_bot_filters` row. When no row exists yet a
        default object is returned (never 404): `enabled=false`,
        `block_bad_bots=true`, `allow_search_engines=true`, everything else false
        or empty.

        **How a host resolves bot filtering** (`resolveBotFilter`,
        api/internal/service/bot_filter_resolve.go) — plain tri-state, nothing is
        merged:

        - **override** — host's bot filter row has `enabled=true`: host wins,
          this global is ignored.
        - **disable** — host's row has `disable_global=true`: no bot filtering.
        - **inherit** — otherwise: this global applies when `enabled=true`, and
          every field (including `custom_blocked_agents` /
          `custom_allowed_agents`) comes from here. Nothing from the host row is
          carried over.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Global bot filter default
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalBotFilter'

    put:
      tags: [Settings]
      summary: Update the global bot filter default
      description: |
        Partial update — every field is a pointer, so any omitted field keeps its
        stored value and sending `""` genuinely clears a custom agent list.

        On success all proxy host configs are regenerated before the response is
        sent.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGlobalBotFilter'
      responses:
        '200':
          description: Updated global bot filter default
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalBotFilter'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          description: Update succeeded but regenerating the host configs failed
  /settings/global-rate-limit:
    get:
      tags: [Settings]
      summary: Get the global rate limit default
      description: |
        Returns the singleton `global_rate_limits` row. When no row exists yet a
        default object is returned (never 404): `enabled=false`,
        `requests_per_second=50`, `burst_size=100`, `zone_size="10m"`,
        `limit_by="ip"`, `limit_response=429`.

        **How a host resolves rate limiting** (`resolveRateLimit`,
        api/internal/service/rate_limit_resolve.go):

        - **override** — host's rate limit row has `enabled=true`: host wins.
        - **disable** — host's row has `disable_global=true`: no rate limiting.
        - **inherit** — otherwise: this global applies when `enabled=true`.

        The nginx `limit_req` zone stays per-host even when inherited — an
        inheriting host gets its own zone (named from its host ID) carrying these
        global values, so hosts do not share a counter.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Global rate limit default
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalRateLimit'

    put:
      tags: [Settings]
      summary: Update the global rate limit default
      description: |
        Partial update, but only `enabled` is a pointer: numeric fields are
        ignored when `<= 0` and string fields when empty, so those keep their
        stored value.

        `whitelist_ips` is nullable like `enabled`: omit it to keep the stored
        list, or send `""` to clear it. Entries must be IP addresses or CIDR
        ranges — anything else is rejected with 400, because the list is now
        rendered into the nginx config rather than stored and ignored.

        On success all proxy host configs are regenerated before the response is
        sent.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGlobalRateLimit'
      responses:
        '200':
          description: Updated global rate limit default
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalRateLimit'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          description: Update succeeded but regenerating the host configs failed
  /settings/global-security-headers:
    get:
      tags: [Settings]
      summary: Get the global security headers default
      description: |
        Returns the singleton `global_security_headers` row. When no row exists
        yet a default object is returned (never 404): `enabled=false`,
        `hsts_enabled=true`, `hsts_max_age=31536000`,
        `hsts_include_subdomains=true`, `x_frame_options="SAMEORIGIN"`,
        `x_content_type_options=true`, `x_xss_protection=true`,
        `referrer_policy="strict-origin-when-cross-origin"`.

        **How a host resolves security headers** (`resolveSecurityHeaders`,
        api/internal/service/security_headers_resolve.go) — plain tri-state, no
        per-header merging:

        - **override** — host's security headers row has `enabled=true`: host
          wins and this global is ignored entirely (a host that sets only a CSP
          does *not* also get this global's HSTS).
        - **disable** — host's row has `disable_global=true`: no security headers.
        - **inherit** — otherwise: this global applies when `enabled=true`.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Global security headers default
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalSecurityHeaders'

    put:
      tags: [Settings]
      summary: Update the global security headers default
      description: |
        Partial update for the boolean fields (pointers — omit to keep).
        `hsts_max_age` is ignored when `<= 0`, and `x_frame_options` /
        `referrer_policy` are ignored when empty, so those keep their stored
        value.

        `content_security_policy`, `permissions_policy` and `custom_headers` are
        the exception — they are always written from the request, so omitting any
        of them **clears** the stored value.

        On success all proxy host configs are regenerated before the response is
        sent.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGlobalSecurityHeaders'
      responses:
        '200':
          description: Updated global security headers default
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalSecurityHeaders'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          description: Update succeeded but regenerating the host configs failed
  /settings/global-cloud-providers:
    get:
      tags: [Settings]
      summary: Get the global cloud provider blocking default
      description: |
        Returns the singleton `global_cloud_providers` row. When no row exists
        yet a default object with an empty `blocked_providers` list is returned
        (never 404).

        **How a host resolves cloud blocking** (`resolveCloudProviders`,
        api/internal/service/cloud_provider_resolve.go) — note there is no
        `enabled` flag anywhere in this feature; "active" means
        `blocked_providers` is non-empty:

        - **override** — the host's `blocked_providers` (from
          `PUT /proxy-hosts/{proxyHostId}/blocked-cloud-providers`) is non-empty:
          the host's list, `challenge_mode` and `allow_search_bots` are used and
          this global is ignored. Lists are never merged.
        - **disable** — the host has `cloud_disable_global=true`: nothing is
          blocked.
        - **inherit** — host list empty and not disabled: this global's
          `blocked_providers`, `challenge_mode` and `allow_search_bots` apply,
          provided `blocked_providers` here is non-empty. If it is empty, nothing
          is blocked.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Global cloud provider blocking default
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalCloudProviders'

    put:
      tags: [Settings]
      summary: Update the global cloud provider blocking default
      description: |
        Full replacement, not a partial update — unlike the other globals none of
        these fields are pointers. An omitted `challenge_mode` or
        `allow_search_bots` is stored as `false`, and an omitted or null
        `blocked_providers` is stored as an empty list (which turns global cloud
        blocking off for every inheriting host). Always send the complete object.

        Provider slugs come from `GET /cloud-providers`. On success all proxy
        host configs are regenerated before the response is sent.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGlobalCloudProviders'
      responses:
        '200':
          description: Updated global cloud provider blocking default
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalCloudProviders'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          description: Update succeeded but regenerating the host configs failed

  # ============================================================================
  # Cloudflare Tunnel (settings-scoped singleton, Phase 1 token mode)
  # ============================================================================
  /settings/cloudflare-tunnel:
    get:
      tags: [Settings]
      summary: Get Cloudflare Tunnel settings
      description: |
        Returns the singleton tunnel setting. When no row exists yet a default
        object is returned (never 404): `enabled=false`, `mode="token"`.

        The stored connector token is never returned. The response carries
        `has_token` and `token_masked` (first 4 characters plus `****`, or
        `****` for tokens of 4 characters or fewer, or `""` when unset) instead.
        `origin_service_url` / `origin_service_url_http` are computed from the
        proxy's configured `NGINX_HTTPS_PORT` / `NGINX_HTTP_PORT` and are the
        values to paste into the Cloudflare dashboard's Public Hostname setup.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Cloudflare Tunnel settings (token masked)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudflareTunnel'

    put:
      tags: [Settings]
      summary: Update Cloudflare Tunnel settings
      description: |
        Partial update. `enabled` omitted keeps the stored value. `token` omitted
        keeps the stored token; sending a value replaces it. Never send
        `token_masked` back — it is not a token and would be rejected.

        Enabling requires a usable token: if the effective post-merge state is
        `enabled=true` and the effective token is empty or fails validation
        (base64url characters only, at most 4096 bytes), the request is rejected
        with 400 and nothing is written. The stored token is re-validated even
        when the request does not supply one, because tokens can enter the
        database unvalidated through a backup import.

        On success the token file the in-container supervisor watches is
        rewritten (or removed when disabled) and the cached status is
        invalidated.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCloudflareTunnel'
      responses:
        '200':
          description: Updated Cloudflare Tunnel settings (token masked)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudflareTunnel'
        '400':
          description: Malformed body, or an invalid/absent token while enabling
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: |
            Settings were saved but writing or removing the connector token file
            failed.
  /settings/cloudflare-tunnel/status:
    get:
      tags: [Settings]
      summary: Get Cloudflare Tunnel connector status
      description: |
        Runtime state of the `cloudflared` connector, cached for 15 seconds
        (the dashboard polls at the same interval). Always 200 — probe failures
        are reported as a state, not an error.

        - `disabled` — settings are off, no token stored, or the settings row
          could not be read.
        - `connected` — the connector reports at least one registered
          connection; `connections` holds the count.
        - `starting` — no connections yet, but under 60 seconds have passed
          since the tunnel was last enabled or the token file was synced.
        - `error` — no connections and past that 60 second grace period.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Connector runtime state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TunnelStatus'

  # ============================================================================
  # Global nginx settings — reset and presets
  # (reading and updating the settings themselves is GET/PUT /settings)
  # ============================================================================
  /settings/reset:
    post:
      tags: [Settings]
      summary: Reset global nginx settings to defaults
      description: |
        Deletes the settings row and inserts a fresh one, so every global nginx
        setting reverts to its database column default. Then regenerates
        `nginx.conf`, all proxy host configs and all enabled redirect host
        configs and reloads nginx. Takes no request body.

        Failures in any of those regeneration steps are logged, not returned —
        a 200 means the database was reset, not that nginx necessarily reloaded
        cleanly.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: The settings after reset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalSettings'
        '500':
          description: |
            The database reset failed. It runs as a DELETE followed by an
            INSERT outside a transaction, so a failure on the INSERT leaves no
            settings row at all until the next successful reset or update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /settings/presets:
    get:
      tags: [Settings]
      summary: List global settings presets
      description: |
        Returns the built-in presets as an object keyed by preset name
        (`performance`, `security`, `balanced`), each value being a full settings
        object. Static data — nothing is read from the database.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Presets keyed by name
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/GlobalSettings'
  /settings/preset/{preset}:
    post:
      tags: [Settings]
      summary: Apply a global settings preset
      description: |
        Applies a preset through the same pipeline as a manual settings update
        (`nginx.conf` regeneration, proxy host re-render, reload). Takes no
        request body.

        Only these fields are taken from the preset: worker processes and
        connections, `multi_accept`, `sendfile`, `tcp_nopush`, `tcp_nodelay`,
        keepalive timeout and requests, `server_tokens`, gzip enabled and
        compression level, brotli enabled and compression level, `ssl_protocols`,
        `ssl_prefer_server_ciphers` and `ssl_ecdh_curve`. Every other setting
        keeps its current value — including fields the preset table itself
        defines (`use_epoll`, the proxy buffer sizes, the `open_file_cache`
        group, `gzip_min_length`, `brotli_static`, `client_max_body_size`, the
        remaining SSL fields), which are not copied into the update.
      security:
        - BearerAuth: []
      parameters:
        - name: preset
          in: path
          required: true
          schema:
            type: string
            enum: [performance, security, balanced]
      responses:
        '200':
          description: The settings after applying the preset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalSettings'
        '400':
          description: Unknown preset name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ============================================================================
  # Global URI block — individual rules
  #
  # Unlike the /settings/* globals above these are guarded by the proxy scopes
  # (proxy:write to add, proxy:delete to remove), not settings:*.
  # ============================================================================
  /global-uri-block/rules:
    post:
      tags: [Security]
      summary: Add one rule to the global URI block list
      description: |
        Appends a single rule to the global URI block singleton, creating that
        singleton if it does not exist yet. On that first call the request's
        `enabled` value is used for **both** the new rule and the singleton, so
        posting the first rule with `enabled: false` creates a disabled global
        URI block; `enabled` is not applied to the singleton on later calls.

        Global URI block rules are **merged** into every host rather than being
        an either/or default: for each host the effective rule list is the
        enabled global rules first, then the host's own enabled rules with any
        duplicate `(pattern, match_type)` dropped. Exception IPs are unioned the
        same way, and `allow_private_ips` is ORed — a host cannot switch off a
        global allowance. There is no per-host opt-out for global URI rules.

        Adding is idempotent on `(pattern, match_type)`: a duplicate returns 200
        with the list unchanged. Host config regeneration is kicked off in a
        goroutine that is not waited on, so the change is not guaranteed live
        when the 200 arrives, and a regeneration failure is not reported.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddGlobalURIBlockRule'
      responses:
        '200':
          description: The global URI block list including the new rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalURIBlock'
        '400':
          description: '`pattern` missing, or `match_type` is `regex` and the pattern does not compile'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /global-uri-block/rules/{ruleId}:
    delete:
      tags: [Security]
      summary: Remove one rule from the global URI block list
      description: |
        Removes the rule with this ID from the global URI block singleton and
        regenerates host configs in the background.

        Removing an unknown ID is not an error — the response is 200 either way,
        so it cannot be used to test whether a rule existed.
      security:
        - BearerAuth: []
      parameters:
        - name: ruleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID of the rule as returned in the `rules` array
      responses:
        '200':
          description: Rule removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/status:
    get:
      tags: [Auth]
      summary: Get authentication status
      description: |
        Reports whether the supplied bearer token is a valid session and whether the
        install is still in initial-setup state. Public — callable with no credential,
        in which case `authenticated` is false. An invalid or expired token also
        returns 200 with `authenticated: false`, never 401.
      security:
        - BearerAuth: []
        - {}
      responses:
        '200':
          description: Authentication status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStatus'
  /auth/verify-2fa:
    post:
      tags: [Auth]
      summary: Complete a 2FA login
      description: |
        Second leg of the two-step login: exchanges the `temp_token` from
        `POST /auth/login` plus a TOTP code for a session token. Public.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [temp_token, totp_code]
              properties:
                temp_token:
                  type: string
                  description: The temp_token returned by POST /auth/login when requires_2fa was true.
                totp_code:
                  type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: temp_token or totp_code missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid or expired temporary token, or invalid 2FA code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ============================================================================
  # Authentication — self-service (authentication only, no permission)
  #
  # Every route in this block is in middleware.SelfRoutes: it requires a valid
  # session but NO permission, and no role can take it away. They are registered
  # before RequireRoutePermission is attached, so the RBAC registry never sees
  # them.
  # ============================================================================
  /auth/account:
    get:
      tags: [Auth]
      summary: Get own account info
      description: Sign-in metadata for the calling account. Self-service — authentication only.
      security:
        - SessionAuth: []
      responses:
        '200':
          description: Account info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/change-credentials:
    post:
      tags: [Auth]
      summary: Change own username and password (initial setup)
      description: |
        Initial-setup flow for the seeded `admin` account: changes username AND password
        in one call and clears `is_initial_setup`. Self-service — authentication only.

        While the calling account still has `is_initial_setup: true`, this is one of the
        only four reachable endpoints (with `/auth/me`, `/auth/status`, `/auth/logout`);
        everything else returns 403 with `code: initial_setup_required`.

        `new_password` must be at least 10 characters and contain an uppercase letter, a
        lowercase letter, a digit and a special character, and must not be a common password.
      security:
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_username, new_password, new_password_confirm]
              properties:
                current_password:
                  type: string
                  format: password
                new_username:
                  type: string
                  minLength: 3
                new_password:
                  type: string
                  format: password
                  minLength: 10
                new_password_confirm:
                  type: string
                  format: password
      responses:
        '200':
          description: >-
            Credentials changed. The message asks the caller to sign in again, but no
            session is invalidated — the bearer token used for this call keeps working.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: Missing field, username shorter than 3 characters, weak password, or passwords do not match
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Current password is incorrect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Username is already taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/change-username:
    post:
      tags: [Auth]
      summary: Change own username
      description: Self-service — authentication only.
      security:
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_username]
              properties:
                current_password:
                  type: string
                  format: password
                new_username:
                  type: string
                  minLength: 3
      responses:
        '200':
          description: Username changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  username:
                    type: string
                    description: The new username.
        '400':
          description: Missing current_password, or new_username shorter than 3 characters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Current password is incorrect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Username is already taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/2fa/setup:
    post:
      tags: [Auth]
      summary: Begin 2FA enrolment
      description: |
        Generates a TOTP secret, an otpauth QR URL and backup codes for the calling
        account. Nothing is enabled until `POST /auth/2fa/enable` confirms a code.
        Self-service — authentication only. Takes no request body.
      security:
        - SessionAuth: []
      responses:
        '200':
          description: Enrolment material
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Setup2FAResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: 2FA is already enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/2fa/enable:
    post:
      tags: [Auth]
      summary: Enable 2FA
      description: Confirms the enrolment from `/auth/2fa/setup` with a current TOTP code. Self-service — authentication only.
      security:
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [totp_code]
              properties:
                totp_code:
                  type: string
      responses:
        '200':
          description: 2FA enabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: totp_code missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid 2FA code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 2FA is already enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/2fa/disable:
    post:
      tags: [Auth]
      summary: Disable 2FA
      description: Requires both the account password and a current TOTP code. Self-service — authentication only.
      security:
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, totp_code]
              properties:
                password:
                  type: string
                  format: password
                totp_code:
                  type: string
      responses:
        '200':
          description: 2FA disabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: password or totp_code missing, or 2FA is not enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid password or invalid 2FA code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/language:
    get:
      tags: [Auth]
      summary: Get own UI language
      description: Self-service — authentication only. Returns `ko` when the account has no language stored.
      security:
        - SessionAuth: []
      responses:
        '200':
          description: Current language
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LanguageSetting'
        '401':
          $ref: '#/components/responses/Unauthorized'

    put:
      tags: [Auth]
      summary: Set own UI language
      description: Self-service — authentication only. Only `ko` and `en` are accepted.
      security:
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LanguageSetting'
      responses:
        '200':
          description: Language updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LanguageSetting'
        '400':
          description: Unsupported language
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/font:
    get:
      tags: [Auth]
      summary: Get own UI font family
      description: Self-service — authentication only. Returns the stored value verbatim, which may be an empty string for an account that never set one.
      security:
        - SessionAuth: []
      responses:
        '200':
          description: Current font family
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FontFamilySetting'
        '401':
          $ref: '#/components/responses/Unauthorized'

    put:
      tags: [Auth]
      summary: Set own UI font family
      description: Self-service — authentication only. The handler accepts only the five listed values.
      security:
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FontFamilySetting'
      responses:
        '200':
          description: Font family updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FontFamilySetting'
        '400':
          description: Invalid font family
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ============================================================================
  # SSO login flow (public — #227)
  #
  # These three are unauthenticated by necessity: the login screen reads the
  # provider list before anyone has signed in, and the browser arrives at
  # start/callback carrying no NPG credential.
  # ============================================================================
  /auth/sso/providers:
    get:
      security: []
      tags: [SSO]
      summary: List SSO providers for the login screen
      description: |
        Public. Returns only `id`, `slug` and `name` for ENABLED providers — issuer,
        client id and every allowlist detail stay server-side. Returns an empty list
        (not an error) when the SSO tables are absent.
      responses:
        '200':
          description: Public provider list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublicSSOProvider'
  /auth/sso/{slug}/start:
    get:
      security: []
      tags: [SSO]
      summary: Begin an SSO login
      description: |
        Public. Redirects the browser to the identity provider's authorization endpoint
        and sets the single-use `npg_sso_state` cookie (HttpOnly, SameSite=Lax, path
        `/api/v1/auth/sso`, 10 minute lifetime; `Secure` only when the request arrived
        over TLS or with `X-Forwarded-Proto: https`).

        This is a browser navigation endpoint, not a JSON API: on failure it still
        redirects, to `/sso/complete#error=<code>`.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
          description: Provider slug (SSOProvider.slug).
      responses:
        '302':
          description: Redirect to the identity provider, or to /sso/complete#error=<code> on failure
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
                example: npg_sso_state=<state>; Path=/api/v1/auth/sso; HttpOnly; SameSite=Lax
  /auth/sso/{slug}/callback:
    get:
      security: []
      tags: [SSO]
      summary: SSO redirect target
      description: |
        Public. The identity provider sends the browser here. Every outcome — success and
        failure alike — is a 302 to the SPA route `/sso/complete`, with the result in the
        URL FRAGMENT so it is never sent to a server or written to an access log:

        - success: `/sso/complete#token=<url-encoded session token>` — an ordinary session
          token, identical to the one `POST /auth/login` issues
        - failure: `/sso/complete#error=<code>`, where code is one of `unavailable`,
          `unknown_provider`, `expired`, `no_account`, `not_allowed`, `no_email`,
          `provider_unreachable`, `verification_failed`, `provider_refused`,
          `invalid_response`, `failed`

        The `npg_sso_state` cookie set by `/start` must match the `state` query parameter,
        and is expired here whatever the outcome. A missing cookie is reported as
        `expired`, indistinguishable from an unknown state.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: false
          schema:
            type: string
          description: Authorization code from the identity provider.
        - name: state
          in: query
          required: false
          schema:
            type: string
          description: Must equal the value in the npg_sso_state cookie.
        - name: error
          in: query
          required: false
          schema:
            type: string
          description: Set by the identity provider when it refuses; produces #error=provider_refused.
      responses:
        '302':
          description: Redirect to /sso/complete with #token=... or #error=...
          headers:
            Location:
              schema:
                type: string

  # ============================================================================
  # RBAC — permission areas and roles (#222)
  #
  # Guarded by the role area, not settings, so holding settings never confers the
  # ability to mint administrators. API tokens can only carry "*" or one of the 15
  # legacy resource scopes, and none of those is role:read/role:write — so in
  # practice only a "*" token reaches this block.
  # ============================================================================
  /permission-areas:
    get:
      tags: [Users & Roles]
      summary: Get the permission area/verb matrix
      description: |
        The catalogue the role editor renders, so a client never hardcodes a permission
        list that can drift from the server's. Requires `role:read`.

        Note the capitalised keys inside `areas`: `model.PermissionArea` carries no JSON
        tags, so Go marshals its fields as `Key` and `Verbs`.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Permission catalogue
          content:
            application/json:
              schema:
                type: object
                properties:
                  areas:
                    type: array
                    description: Ordered as the role editor renders them.
                    items:
                      $ref: '#/components/schemas/PermissionArea'
                  permissions:
                    type: array
                    description: Flat list of every valid "area:verb" string, derived from areas.
                    items:
                      type: string
                      example: proxy:write
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller lacks role:read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /roles:
    get:
      tags: [Users & Roles]
      summary: List roles
      description: Requires `role:read`. Ordered built-in roles first, then by name.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Roles
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller lacks role:read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags: [Users & Roles]
      summary: Create a role
      description: |
        Requires `role:write`. Every entry in `permissions` must be one of the
        `area:verb` strings from `GET /permission-areas`; anything else — including the
        `*` wildcard an API token may carry — is rejected with 400.

        Fifteen of those strings (`proxy:read`, `settings:write`, `user:read`, …) are
        spelled identically to the legacy API-token scopes and are therefore accepted
        here too. The reverse does not hold: the area-only strings such as `role:write`,
        `apitoken:read` or `redirect:delete` are rejected by `POST /api-tokens`.

        A role created through this endpoint is never a superuser — `is_superuser`
        cannot be set from the API.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
      responses:
        '201':
          description: Role created (returned bare, not wrapped in data)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          description: Invalid role name (empty, over 64 chars, control characters, or the reserved `builtin.` prefix) or an unknown permission string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller lacks role:write
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Role name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /roles/{id}:
    put:
      tags: [Users & Roles]
      summary: Update a role
      description: |
        Requires `role:write`. Partial update — omitted fields are left alone. Supplying
        `permissions` REPLACES the role's permission set wholesale. Built-in roles cannot
        be modified.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleRequest'
      responses:
        '200':
          description: Role updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          description: Invalid role name or unknown permission string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller lacks role:write
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Role not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Built-in role, or the new name is already taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [Users & Roles]
      summary: Delete a role
      description: |
        Requires `role:write`. Refused while any account still holds the role — the error
        message carries the count. Built-in roles cannot be deleted.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Role deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller lacks role:write
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Role not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Built-in role, or the role is still assigned to users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ============================================================================
  # User administration (#222)
  #
  # Guarded by the user area. A session needs user:read / user:write. An API token
  # additionally passes a route-level scope check: reads accept the legacy
  # `user:read` scope, writes are only reachable with "*", because no legacy scope
  # spells user:write.
  # ============================================================================
  /users:
    get:
      tags: [Users & Roles]
      summary: List user accounts
      description: Requires `user:read`. Never carries password hashes, TOTP secrets or backup codes.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Accounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller lacks user:read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags: [Users & Roles]
      summary: Create a user account
      description: |
        Requires `user:write`. The new account starts with `must_change_password: true`,
        which makes every resource endpoint return 403 with `code: must_change_password`
        until the account sets its own password through `POST /auth/change-password`.
        The self-service `/auth/*` endpoints are not gated by that flag.

        `username` must be at least 3 characters and cannot be `admin` (reserved).
        `password` must clear the same strength rule as the self-service change: at least
        10 characters with an uppercase letter, a lowercase letter, a digit and a special
        character, and not a common password.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, role_id]
              properties:
                username:
                  type: string
                  minLength: 3
                password:
                  type: string
                  format: password
                  minLength: 10
                role_id:
                  type: string
                  format: uuid
                  description: Must reference an existing role.
                email:
                  type: string
                  format: email
                  example: ops@example.com
                  description: |
                    Optional. Omitted, the account gets a synthesised
                    `<username>@localhost`, which no identity provider can match when
                    linking an SSO sign-in. Give a real address for an account that
                    should be able to sign in that way.
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
        '400':
          description: Username too short or reserved, or password too weak
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller lacks user:write
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: role_id does not name an existing role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Username already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /users/{id}:
    get:
      tags: [Users & Roles]
      summary: Get one account's detail
      description: |
        Requires `user:read`. Returns the summary plus sign-in history, active session
        count, the API tokens issued under the account, any linked SSO identities, and
        BOTH permission views — the role's stored rows (`role_permissions`) and the
        expanded set actually enforced (`effective_permissions`).
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Account detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller lacks user:read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Users & Roles]
      summary: Delete a user account
      description: |
        Requires `user:write`. Deleting an account cascades its API tokens and sessions —
        `api_token_count` on the summary is what the confirmation shows.

        Two guards: you cannot delete your own account, and the last superuser account
        cannot be deleted.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Account deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller lacks user:write
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Deleting your own account, or removing the last administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /users/{id}/role:
    put:
      tags: [Users & Roles]
      summary: Assign a role to an account
      description: |
        Requires `user:write`. Permissions resolve per request, so the new role applies to
        the target's very next call — existing sessions are NOT invalidated.

        Two guards: you cannot change your own role, and the last superuser cannot be
        demoted.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role_id]
              properties:
                role_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Updated account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller lacks user:write
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Account or role not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Changing your own role, or demoting the last administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /users/{id}/email:
    put:
      tags: [Users & Roles]
      summary: Set the address SSO links an account by
      description: |
        Requires `user:write`. This is the address an identity provider's verified
        email is matched against when linking a sign-in to an existing account.

        Accounts that were never given one hold a synthesised `<username>@localhost`,
        which no provider can ever match — an account expected to sign in through SSO
        needs a real address here.

        Deliberately not self-service. SSO linking matches a verified provider email
        to a local account and then syncs the role from the provider's groups, so a
        user able to set their own address could claim an administrator's provider
        address before that administrator first signs in, and take the role with it.

        The address is stored lower-cased and trimmed, and must be unique
        case-insensitively. Sessions are left alone: unlike a password reset this does
        not invalidate the credential the account already holds.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  example: ops@example.com
                  description: |
                    The address on its own. A display name (`Ada <ada@example.com>`) is
                    rejected — it would be stored whole and never match a provider's
                    plain claim. Single-label domains (`me@lan`) are accepted.
      responses:
        '204':
          description: Address updated
        '400':
          description: Malformed address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller lacks user:write
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such account
        '409':
          description: Another account already holds this address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/{id}/password:
    put:
      tags: [Users & Roles]
      summary: Reset another account's password
      description: |
        Requires `user:write`. All of the target's sessions are ended — the point of an
        admin reset is that the current holder loses access. The write also sets the
        target's `must_change_password` back to true, so the account is confined to the
        forced-change state (403 `must_change_password` on every resource endpoint)
        until it picks its own password.

        The password must clear the same strength rule as the self-service change (10+
        characters, upper, lower, digit, special, not a common password).
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  format: password
                  minLength: 10
      responses:
        '204':
          description: Password reset and sessions ended
        '400':
          description: Password too weak
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller lacks user:write
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Account not found — the update matched no row
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /users/{id}/end-sessions:
    post:
      tags: [Users & Roles]
      summary: End all sessions for an account
      description: |
        Requires `user:write`. The "kick this account" action — deletes the target's
        session rows without changing its password. Takes no request body.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Sessions ended
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller lacks user:write
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ============================================================================
  # SSO provider registry (#227)
  #
  # Guarded by the USER area, not settings: a provider decides which accounts may
  # exist and what role they receive, which is the same power as PUT
  # /users/{id}/role.
  # ============================================================================
  /sso-providers:
    get:
      tags: [SSO]
      summary: List SSO providers
      description: |
        Requires `user:read`. `client_secret` always reads back as the literal `********`
        — the stored secret is never returned. `callback_url` is derived from the request
        origin (or `callback_base_url` when set), not stored, and is the exact value to
        register at the identity provider.

        Returns an empty list, not an error, when the SSO tables are absent.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Providers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SSOProvider'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller lacks user:read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags: [SSO]
      summary: Create an SSO provider
      description: |
        Requires `user:write`. `client_secret` is required on create and is never readable
        afterwards — the response already carries the `********` placeholder.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SSOProviderRequest'
      responses:
        '201':
          description: Provider created, with client_secret masked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SSOProvider'
        '400':
          description: Validation failure — bad slug, name, issuer_url, missing client_id/client_secret, scopes without `openid`, a malformed allowlist entry, JIT without an allowlist or without default_role_id, an incomplete group mapping, or a role_id that does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller lacks user:write
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Slug already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: SSO tables are missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /sso-providers/{id}:
    put:
      tags: [SSO]
      summary: Update an SSO provider
      description: |
        Requires `user:write`. The body is the same shape as create and is applied
        wholesale, so send every field.

        Secret handling: send the placeholder `********` (or an empty string) to leave the
        stored secret untouched; send a new value to replace it.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SSOProviderRequest'
      responses:
        '200':
          description: Provider updated, with client_secret masked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SSOProvider'
        '400':
          description: Validation failure, or a role_id that does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller lacks user:write
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Provider not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Slug already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: SSO tables are missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [SSO]
      summary: Delete an SSO provider
      description: Requires `user:write`. `linked_users` on the provider reports how many accounts a delete would detach.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Provider deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller lacks user:write
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Provider not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: SSO tables are missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /sso-providers/test:
    post:
      tags: [SSO]
      summary: Probe an issuer's OIDC discovery document
      description: |
        Requires `user:write`. Fetches `<issuer>/.well-known/openid-configuration` right
        now, bypassing the discovery cache, so a typo shows up while the operator is still
        on the form. The issuer is validated exactly as it is on save. Nothing is stored.

        `missing_scopes` is only populated when the issuer actually publishes
        `scopes_supported`.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [issuer_url]
              properties:
                issuer_url:
                  type: string
                  format: uri
                scopes:
                  type: string
                  description: Space-separated. Defaults to "openid profile email" when empty; must contain `openid`.
      responses:
        '200':
          description: Discovery result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SSODiscoveryResult'
        '400':
          description: Issuer unreachable (`provider_unreachable`) or invalid issuer_url/scopes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller lacks user:write
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ============================================================================
  # API tokens
  #
  # A session needs apitoken:read / apitoken:write. An API token needs
  # settings:read / settings:write (or "*") as well, because the route carries an
  # additional legacy-scope check — so a narrowly scoped token cannot mint or
  # revoke tokens. A token can never exceed its owner's role: the owner's
  # permissions are re-checked on every request.
  # ============================================================================
  /api-tokens/permissions:
    get:
      tags: [API Tokens]
      summary: List the permission strings an API token may carry
      description: |
        Requires `apitoken:read`. These are the legacy RESOURCE scopes, which are a
        different (coarser) axis from the `area:verb` strings roles are built from — see
        `GET /permission-areas`. `groups` are convenience bundles the token UI offers.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Permission catalogue for tokens
          content:
            application/json:
              schema:
                type: object
                properties:
                  permissions:
                    type: array
                    items:
                      type: string
                    example: [proxy:read, proxy:write, proxy:delete, certificate:read, certificate:write, certificate:delete, waf:read, waf:write, logs:read, settings:read, settings:write, backup:read, backup:create, backup:restore, user:read]
                  groups:
                    type: object
                    description: Named bundles (read_only, operator, admin) mapping to permission lists.
                    additionalProperties:
                      type: array
                      items:
                        type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller lacks apitoken:read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api-tokens/{id}/usage:
    get:
      tags: [API Tokens]
      summary: Get recent usage for an API token
      description: |
        Requires `apitoken:read` and the same ownership rule as GET. Returns the token
        alongside its request log for the last 24 hours, newest first, capped at 100 rows.
        The window and the cap are fixed — there are no query parameters.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Token and its recent requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    $ref: '#/components/schemas/APIToken'
                  usages:
                    type: array
                    items:
                      $ref: '#/components/schemas/APITokenUsage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller lacks apitoken:read, or the token belongs to another account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Token not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /notification-channels:
    get:
      tags: [Notifications]
      summary: List notification channels
      description: |
        Returns every configured channel plus the two things a client cannot
        derive on its own: the server-enforced event catalogue and the clock the
        digest scheduler actually uses.

        Secrets in `config` are masked — see the `config` field of
        NotificationChannel.

        If the notification tables are missing (a failed upgrade), the response
        degrades to `{"data": []}` with no `events` and no `timezone` key rather
        than failing.

        Requires the `settings:read` permission.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Channels, event catalogue and server timezone
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationChannelList'
        '500':
          description: Failed to list channels
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags: [Notifications]
      summary: Create notification channel
      description: |
        Creates a channel and returns it with secrets masked. The name is unique
        case-insensitively, so a duplicate name is a 409.

        The secret placeholder is NOT interpreted here — it is only understood on
        update. Sending `********` as a `bot_token` or as a `header_*` value on
        create stores that literal string; sending it as `url` is rejected with a
        400 (`invalid_url`) because it is not a URL.

        Requires the `settings:write` permission.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNotificationChannel'
      responses:
        '201':
          description: Channel created (secrets masked)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationChannel'
        '400':
          description: Invalid request body or failed validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationValidationError'
        '409':
          description: A channel with this name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Notification tables are missing — check the migration log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /notification-channels/{id}:
    put:
      tags: [Notifications]
      summary: Update notification channel
      description: |
        Full replacement, not a patch. Every field is written from the request
        body, so an omitted field is reset to its zero value — omitting `enabled`
        turns the channel ON (the pointer default is true), and omitting
        `digest_hour` sets it to 0, i.e. midnight.

        `config` is likewise replaced wholesale: keys you do not send are
        dropped, so send the whole map. Omitting `config` altogether is not a way
        to clear it — every type requires at least one key (`url`, or `chat_id`
        for telegram), so the resulting empty map is rejected with a 400 before
        anything is written. Before validation, any config value equal to the
        secret placeholder `********` is swapped back to the stored value for
        that key, which is how the UI saves an unrelated field without re-typing
        a token.

        There is no GET for a single channel — read it from the list endpoint.

        Requires the `settings:write` permission.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNotificationChannel'
      responses:
        '200':
          description: Channel updated (secrets masked)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationChannel'
        '400':
          description: Invalid request body or failed validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationValidationError'
        '404':
          description: Channel not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: A channel with this name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [Notifications]
      summary: Delete notification channel
      description: |
        Deletes the channel; its outbox rows go with it (ON DELETE CASCADE).

        Requires the `settings:write` permission.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Channel deleted (empty body)
        '404':
          description: Channel not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /notification-channels/{id}/test:
    post:
      tags: [Notifications]
      summary: Send a test message to a channel
      description: |
        Delivers synchronously rather than queueing, so the response reports the
        real result of the HTTP call to Discord/Telegram/the webhook. The attempt
        is recorded in the delivery log either way.

        The body is optional: an absent or empty `event` produces a generic
        sample message. An `event` that is not in the catalogue is silently
        treated as the generic sample. The one accepted key outside the
        catalogue is `digest.daily`, which builds a preview of the daily summary
        from real data instead of a sample.

        Requires the `settings:write` permission.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                event:
                  type: string
                  description: |
                    Event key to simulate. A catalogue key renders that event's
                    sample; `digest.daily` renders a real daily-summary preview;
                    empty or unknown renders the generic test message.
                  example: cert.renewal_failed
      responses:
        '200':
          description: Message delivered
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [sent]
        '400':
          description: Delivery failed — `error` carries the receiver's own refusal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Channel not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /notification-channels/{id}/deliveries:
    get:
      tags: [Notifications]
      summary: List recent deliveries for a channel
      description: |
        The 50 most recent outbox rows for this channel, newest first. The limit
        is fixed server-side; there are no query parameters and no paging.

        Rows are pruned by the dispatch scheduler: `sent` after 7 days,
        everything else after 30.

        If the notification tables are missing, returns `{"data": []}`.

        Requires the `settings:read` permission.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Recent delivery attempts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/NotificationDelivery'
        '500':
          description: Failed to list deliveries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /notification-channels/detect-telegram-chats:
    post:
      tags: [Notifications]
      summary: Discover Telegram chats a bot can reach
      description: |
        Calls Telegram `getUpdates` for the given bot and returns the distinct
        chats seen in `message`, `channel_post` and `my_chat_member` updates.
        This is the only way to obtain a `chat_id`: a bot cannot open a
        conversation, so the operator must message it or add it to a group
        first, and Telegram shows the id nowhere in its own interface.

        Requires the `settings:write` permission.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bot_token:
                  type: string
                  description: |
                    Bot token to query. May be the secret placeholder `********`
                    (or empty) when `channel_id` is supplied, in which case the
                    token stored on that channel is used instead.
                channel_id:
                  type: string
                  format: uuid
                  description: |
                    Existing notification channel whose stored `bot_token` should
                    be used. Only consulted when `bot_token` is empty or masked.
      responses:
        '200':
          description: Chats the bot has seen
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TelegramChat'
        '400':
          description: Missing token, unreachable Telegram, or Telegram refused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /health:
    servers:
      - url: /
        description: Served at the origin root, outside the /api/v1 prefix
    get:
      tags: [System]
      summary: Liveness probe
      description: |
        Unauthenticated. Returns 200 while the database answers a health check and
        503 when it does not. `cache` reports the optional Valkey/Redis connection —
        NPG runs without it (`disabled`).
      security: []
      responses:
        '200':
          description: API healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: Database unreachable — status is "unhealthy"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /metrics:
    servers:
      - url: /
        description: Served at the origin root, outside the /api/v1 prefix
    get:
      tags: [System]
      summary: Prometheus metrics
      description: |
        Unauthenticated Prometheus default registry exposition. Intended for scraping
        on the internal Docker network only; gate externally with an upstream ACL or
        firewall. Output is the standard Prometheus text exposition format.
      security: []
      responses:
        '200':
          description: Metrics in Prometheus text exposition format
          content:
            text/plain:
              schema:
                type: string
  /health/detailed:
    get:
      tags: [System]
      summary: Detailed health snapshot
      description: |
        Authenticated read-only diagnostics: hypertable/compression telemetry, cache
        readiness, log-collector flush freshness and pipeline canary state. All
        sub-queries share a 5 second budget, so a stuck DB or Redis degrades fields
        rather than hanging the request.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Diagnostic snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthDetailed'
  /health/canary:
    post:
      tags: [System]
      summary: Run the log-pipeline canary synchronously
      description: |
        Forces one pipeline canary run (writes a `/__npg_canary` request through nginx
        and waits for the row to land) instead of waiting for the scheduled run.
        Bounded to 20 seconds. Returns 503 when the canary is not enabled.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Canary completed (ok=false means the pipeline is broken)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  stage:
                    type: string
                    description: Stage the canary failed at; empty when ok is true
        '503':
          description: Canary not enabled
  /status:
    get:
      tags: [System]
      summary: Component status
      description: |
        Authenticated. Runs `nginx -t` in the proxy container as part of the check, so
        it is heavier than /health. Every value is "ok" or "error".
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Component status
          content:
            application/json:
              schema:
                type: object
                properties:
                  api:
                    type: string
                    enum: [ok]
                  database:
                    type: string
                    enum: [ok, error]
                  nginx:
                    type: string
                    enum: [ok, error]
  /public/ui-settings:
    get:
      tags: [Settings]
      summary: Public UI settings
      description: |
        Unauthenticated. Read by the login screen before any credential exists. On a
        read error it still returns 200 with the defaults ("system" / "auto").
      security: []
      responses:
        '200':
          description: UI bootstrap settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUISettings'

  # ============================================================================
  # Diagnostics (/test/*) — administrative self-checks, settings:read
  # ============================================================================
  /test/nginx-config:
    post:
      tags: [System]
      summary: Validate the running nginx configuration
      description: Runs `nginx -t` in the proxy container. No reload is performed.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Configuration valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok]
                  message:
                    type: string
        '400':
          description: Configuration invalid
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [error]
                  error:
                    type: string
                    description: Raw `nginx -t` output
  /test/proxy-host/{id}:
    post:
      tags: [System]
      summary: Test connectivity to a proxy host upstream
      description: |
        Sends a HEAD request to the host's upstream (TLS verification disabled,
        redirects not followed, 5 second timeout). If the upstream is a private IP and
        the direct attempt fails, it retries with `curl` from inside the nginx
        container. Stream hosts are probed with a TCP/UDP dial instead and the
        response then carries `upstream` and `response_time_ms` rather than
        `status_code`. Connection failures still return 200 with status "error".
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProxyHostId'
      responses:
        '200':
          description: Probe result (status "ok" or "error")
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok, error]
                  host:
                    $ref: '#/components/schemas/ProxyHost'
                  upstream:
                    type: string
                    description: Probed URL (HTTP hosts) or upstream domain (stream hosts)
                  status_code:
                    type: integer
                    description: HTTP hosts only — upstream response status
                  response_time_ms:
                    type: integer
                    description: Stream hosts only
                  error:
                    type: string
        '404':
          description: Proxy host not found
  /test/system/self-check:
    get:
      tags: [System]
      summary: System self-check
      description: |
        Checks the database, `nginx -t` and the backup directory (which it creates
        if missing). Only a failing `nginx -t` downgrades the overall status.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Self-check result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [healthy, degraded]
                    description: '"degraded" only when the nginx component is not "ok"'
                  checked_at:
                    type: string
                    format: date-time
                  components:
                    type: object
                    additionalProperties:
                      type: object
                      description: Per-component map with at least a "status" key
                    description: >-
                      Keys are "database", "nginx" (adds "error") and
                      "backup_storage" (adds "path")
  /test/backup-restore:
    get:
      tags: [System]
      summary: Verify backup create/list/delete
      description: |
        Creates a throwaway backup row (backup_type "test") and deletes it again. No
        archive is written and nothing is restored.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Test passed
          content:
            application/json:
              schema:
                type: object
                properties:
                  test:
                    type: string
                  status:
                    type: string
                  details:
                    type: object
  /test/dashboard/queries:
    get:
      tags: [System]
      summary: Exercise the dashboard aggregation queries
      description: Runs each dashboard query and reports per-query status/timings.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Query test results
          content:
            application/json:
              schema:
                type: object
                properties:
                  test:
                    type: string
                  status:
                    type: string
                  results:
                    type: object
                    additionalProperties:
                      type: object

  # ============================================================================
  # Dashboard & Docker
  # ============================================================================
  /dashboard/health/history:
    get:
      tags: [Settings]
      summary: System health history
      description: Historical health samples for charts.
      security:
        - BearerAuth: []
      parameters:
        - name: hours
          in: query
          description: Look-back window. Values outside 1-168 are ignored and 1 is used.
          schema:
            type: integer
            default: 1
            minimum: 1
            maximum: 168
        - name: limit
          in: query
          description: Max samples. Values outside 1-1000 are ignored and 100 is used.
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 1000
      responses:
        '200':
          description: Health samples
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SystemHealth'
                  total:
                    type: integer
                  since:
                    type: string
                    format: date-time
                  limit:
                    type: integer
  /dashboard/stats/hourly:
    get:
      tags: [Settings]
      summary: Hourly aggregated statistics
      description: |
        Returns hourly rollup buckets. An unparseable `start`/`end` silently falls back
        to the default window; a `proxy_host_id` that is not a valid UUID is dropped
        (the response then covers all hosts).
      security:
        - BearerAuth: []
      parameters:
        - name: start
          in: query
          description: RFC3339. Default now-24h.
          schema:
            type: string
            format: date-time
        - name: end
          in: query
          description: RFC3339. Default now.
          schema:
            type: string
            format: date-time
        - name: proxy_host_id
          in: query
          description: Scope to one host. Invalid UUIDs are ignored, not rejected.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Hourly buckets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DashboardStatsHourly'
  /dashboard/containers:
    get:
      tags: [Settings]
      summary: Docker resource statistics
      description: |
        Container CPU/memory/IO plus NPG volume sizes. Backed by `docker stats` and
        `docker system df`, both cached server-side (15s and 5min respectively).
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Docker statistics summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DockerStatsSummary'
        '503':
          description: Docker stats service not available
  /docker/containers:
    get:
      tags: [Settings]
      summary: List Docker containers with network info
      description: |
        Powers the proxy-host container picker: name, image, state, network
        attachments and exposed ports. NPG's own infrastructure containers are hidden
        (except the admin UI). Capped at 10 seconds — a slow Docker socket returns 503
        rather than hanging.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Containers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DockerContainerInfo'
        '503':
          description: Docker not responding or stats service unavailable

  # ============================================================================
  # Backups
  # ============================================================================
  /backups/stats:
    get:
      tags: [Backups]
      summary: Backup statistics
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Backup statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupStats'
  /backups/upload-restore:
    post:
      tags: [Backups]
      summary: Upload an archive and restore from it
      description: |
        Multipart upload of a `.tar.gz` produced by this system. The file is stored as a
        new backup row (backup_type "uploaded"), its SHA-256 recorded, and the restore
        runs synchronously before the response is written. Returns 206 when the restore
        was partial.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [backup]
              properties:
                backup:
                  type: string
                  format: binary
                  description: Archive file; the filename must end in .tar.gz
      responses:
        '200':
          description: Restore completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  backup:
                    $ref: '#/components/schemas/Backup'
                  result:
                    $ref: '#/components/schemas/RestoreResult'
        '206':
          description: Restore partially completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  backup:
                    $ref: '#/components/schemas/Backup'
                  result:
                    $ref: '#/components/schemas/RestoreResult'
        '400':
          description: Missing file or not a .tar.gz
  /certificates/upload:
    post:
      tags: [Certificates]
      summary: Upload a custom certificate
      description: PEM bodies are sent as JSON strings, not as a multipart file.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadCertificate'
      responses:
        '201':
          description: Certificate stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Certificate'
        '400':
          description: Missing PEM fields or invalid certificate/key
  /certificates/expiring:
    get:
      tags: [Certificates]
      summary: List certificates expiring soon
      security:
        - BearerAuth: []
      parameters:
        - name: days
          in: query
          description: Threshold in days; clamped to 1-365.
          schema:
            type: integer
            default: 30
            minimum: 1
            maximum: 365
      responses:
        '200':
          description: Expiring certificates
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CertificateWithDetails'
                  total:
                    type: integer
  /certificates/history:
    get:
      tags: [Certificates]
      summary: Certificate issuance/renewal history
      description: |
        History is a top-level collection filtered by query parameter, not a
        sub-resource of a certificate.
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: certificate_id
          in: query
          description: Scope to one certificate. Omit for all history.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Paginated history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateHistoryListResponse'
  /certificates/errors:
    delete:
      tags: [Certificates]
      summary: Bulk-delete certificates in error status
      description: |
        Certificates still referenced by a proxy or redirect host are skipped, so the
        deleted count can be lower than the number of error certificates.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Deletion result
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: integer
                    format: int64
  /certificates/{id}/error:
    delete:
      tags: [Certificates]
      summary: Clear a certificate's error state
      description: Clears the stored error message; does not delete the certificate.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Error cleared
  /certificates/{id}/upload:
    put:
      tags: [Certificates]
      summary: Replace the PEM material of a custom certificate
      description: Only certificates with provider "custom" can be replaced this way.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadCertificate'
      responses:
        '200':
          description: Certificate replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Certificate'
        '400':
          description: Missing PEM fields, invalid material, or not a custom certificate
  /certificates/{id}/logs:
    get:
      tags: [Certificates]
      summary: Issuance log stream for a certificate
      description: Poll during issuance/renewal; `is_complete` turns true when finished.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Issuance logs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateLogResponse'
        '404':
          description: Certificate not found
  /certificates/{id}/download:
    get:
      tags: [Certificates]
      summary: Download certificate material
      description: |
        Only issued certificates with stored PEM data can be downloaded. `type=all`
        returns a ZIP; every other type returns a single PEM file. `chain` requires an
        issuer certificate to be present.

        If the stored PEM data is missing but the certificate files are still on disk
        (rows damaged by the pre-2.45.0 write path), the material is read back from
        those files, saved to the certificate, and served — no separate repair step.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: type
          in: query
          description: Anything outside this enum is rejected with 400.
          schema:
            type: string
            enum: [cert, key, chain, fullchain, all]
            default: all
      responses:
        '200':
          description: Certificate file
          content:
            application/x-pem-file:
              schema:
                type: string
            application/zip:
              schema:
                type: string
                format: binary
        '400':
          description: Not issued, PEM data missing, chain unavailable, or invalid type
        '404':
          description: Certificate not found

  # ============================================================================
  # DNS Providers
  # ============================================================================
  /dns-providers/default:
    get:
      tags: [DNS Providers]
      summary: Get the default DNS provider
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Default provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DNSProvider'
        '404':
          description: No provider is marked default
  /redirect-hosts/sync:
    post:
      tags: [Redirect Hosts]
      summary: Regenerate every redirect host config
      description: |
        Rewrites all redirect configs, runs `nginx -t`, then reloads. Returns 500 if the
        test or the reload fails.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: All redirect configs synced
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
  /banned-ips/bulk-unban:
    post:
      tags: [Security]
      summary: Unban multiple banned-IP records
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  description: Banned-IP record ids. 1-100 entries; each must be a UUID.
                  minItems: 1
                  maxItems: 100
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: Unban result
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: integer
                    format: int64
        '400':
          description: ids empty, over 100 entries, or containing a non-UUID
  /banned-ips/history:
    get:
      tags: [Security]
      summary: Ban/unban event history
      security:
        - BearerAuth: []
      parameters:
        - name: ip_address
          in: query
          schema:
            type: string
        - name: event_type
          in: query
          schema:
            type: string
            enum: [ban, unban]
        - name: source
          in: query
          description: Origin of the event.
          schema:
            type: string
            enum: [fail2ban, waf_auto_ban, manual, api, expired]
        - name: proxy_host_id
          in: query
          description: Invalid UUIDs are ignored rather than rejected.
          schema:
            type: string
            format: uuid
        - name: start_date
          in: query
          description: RFC3339. Unparseable values are ignored.
          schema:
            type: string
            format: date-time
        - name: end_date
          in: query
          description: RFC3339. Unparseable values are ignored.
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
      responses:
        '200':
          description: Paginated ban history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IPBanHistoryListResponse'
  /banned-ips/history/stats:
    get:
      tags: [Security]
      summary: Ban history statistics
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Ban statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IPBanHistoryStats'
  /banned-ips/{id}/duration:
    put:
      tags: [Security]
      summary: Change how long an existing ban still runs
      description: |
        Re-dates a ban. `ban_time` counts **from now**, not from when the ban
        started — "give this one another day" is the operation, and re-dating
        from the original start would silently expire a ban whose window has
        already passed.

        `0` makes the ban permanent, the same convention the ban form and the
        Fail2ban automatic-ban setting use. The field is required: omitting it
        is rejected rather than read as 0, so a malformed request cannot turn a
        temporary ban into a permanent one.

        The change is recorded in the ban history. nginx configs are not
        regenerated — they carry the set of banned addresses, which this does
        not alter.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ban_time]
              properties:
                ban_time:
                  type: integer
                  minimum: 0
                  example: 86400
                  description: Seconds from now; 0 for a permanent ban.
      responses:
        '200':
          description: The updated ban
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BannedIP'
        '400':
          description: ban_time missing or negative
        '404':
          description: No such ban

  /banned-ips/history/ip/{ip}:
    get:
      tags: [Security]
      summary: Ban history for one IP address
      security:
        - BearerAuth: []
      parameters:
        - name: ip
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
      responses:
        '200':
          description: Paginated ban history for the address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IPBanHistoryListResponse'

  /banned-ips/stats/ip/{ip}:
    get:
      tags: [Security]
      summary: Traffic and ban summary for one IP address
      description: |
        Geolocation, request volume and top targets for the address over the
        window, plus how many times it has been banned.

        Traffic counts cover `days` only. Ban counts (`ban_count`,
        `first_ban_at`, `last_ban_at`) cover all recorded history regardless of
        the window.

        `days` is restricted to 1, 7 or 30: a per-IP lookup cannot use the
        client_ip index inside compressed log chunks, so an arbitrary range
        would scan the whole hypertable. Any other value returns 400, as does a
        malformed address.
      security:
        - BearerAuth: []
      parameters:
        - name: ip
          in: path
          required: true
          schema:
            type: string
          example: 192.0.2.10
        - name: days
          in: query
          schema:
            type: integer
            default: 7
            enum: [1, 7, 30]
      responses:
        '200':
          description: Summary for the address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BannedIPStats'
        '400':
          description: Malformed IP address, or a window other than 1, 7 or 30

  # ============================================================================
