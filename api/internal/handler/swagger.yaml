openapi: 3.0.3
info:
  title: Nginx Proxy Guard API
  description: |
    Nginx Proxy Guard API Documentation

    A modern reverse proxy management system with enterprise-grade security features.

    ## Authentication

    All endpoints except `/api/v1/auth/login` require authentication via:
    - **JWT Bearer Token**: `Authorization: Bearer <jwt_token>`
    - **API Token**: `Authorization: Bearer ng_<api_token>`

    ## Rate Limiting

    API requests are rate limited. Check response headers for limits:
    - `X-RateLimit-Limit`: Maximum requests per window
    - `X-RateLimit-Remaining`: Remaining requests
    - `X-RateLimit-Reset`: Window reset time

  version: 2.46.0
  contact:
    name: Nginx Proxy Guard Support
    url: https://github.com/svrforum/nginxproxyguard
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: /api/v1
    description: API v1

tags:
  - name: Auth
    description: Authentication and user management
  - name: Proxy Hosts
    description: Reverse proxy host management
  - name: Redirect Hosts
    description: HTTP redirect management
  - name: Certificates
    description: SSL/TLS certificate management
  - name: DNS Providers
    description: DNS provider management for wildcard certificates
  - name: Security
    description: Security features (Rate Limit, Bot Filter, Headers, etc.)
  - name: WAF
    description: Web Application Firewall management
  - name: Exploit Rules
    description: Exploit blocking rules management
  - name: GeoIP
    description: Geographic IP restrictions
  - name: Challenge
    description: CAPTCHA challenge configuration
  - name: Cloud Providers
    description: Cloud provider IP blocking
  - name: Access Lists
    description: IP-based access control lists
  - name: Settings
    description: Global settings and dashboard
  - name: Backups
    description: Backup and restore operations
  - name: Logs
    description: System, audit, and access logs
  - name: API Tokens
    description: API token management
  - name: Nginx
    description: Nginx configuration management
  - name: Users & Roles
    description: User accounts, roles and the permission areas that gate every route
  - name: SSO
    description: OpenID Connect identity providers for panel sign-in
  - name: Notifications
    description: Alert channels, the daily summary and the delivery log
  - name: System
    description: Health, metrics and diagnostic endpoints; some are served outside /api/v1
  - name: Filter Subscriptions
    description: Remote IP and user-agent blocklists, their catalog and per-entry exclusions
  - name: DDNS
    description: Dynamic DNS records kept in step with the public IP
  - name: Auth Providers
    description: ForwardAuth providers (Authelia, Authentik, custom) applied per proxy host

paths:
  /auth/login:
    post:
      security: []
      tags: [Auth]
      summary: Login
      description: |
        Exchanges username/password for a session token. Public — no permission required.

        If the account has 2FA enabled and `totp_code` is omitted, the response carries
        `requires_2fa: true` and a short-lived `temp_token` instead of a session token;
        finish with `POST /auth/verify-2fa`. If `totp_code` IS supplied it is verified
        inline and a session token is returned in the same response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
                totp_code:
                  type: string
                  description: Optional. Supply to complete a 2FA login in one step instead of using the temp_token flow.
      responses:
        '200':
          description: Login successful, or 2FA required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: username or password missing, or malformed body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid username or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many failed login attempts for this IP/username; the account is temporarily locked out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Login failed. Also returned when `totp_code` was supplied and is wrong — the handler only maps invalid-credentials and lockout to 4xx.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      description: |
        Invalidates the session behind the `Authorization: Bearer` header. Public — no
        permission required, and a request with no bearer token still returns 200.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Logged out successfully
        '500':
          description: Logout failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/me:
    get:
      tags: [Auth]
      summary: Get current user
      description: |
        Canonical who-am-I. Self-service: authentication only, no permission.

        When the authorizer is wired (the normal case) the response is the
        `CurrentUser` shape, which adds `effective_permissions` and `is_superuser`
        and omits `created_at`/`updated_at`/`last_login_ip`. If the permission lookup
        fails the handler falls back to returning the bare `User` object rather than
        erroring, so a client must tolerate both shapes.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/CurrentUser'
                  - $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/change-password:
    post:
      tags: [Auth]
      summary: Change own password
      description: |
        Self-service — authentication only, and no role can remove it.

        This is the way out of the forced-change state: while the account carries
        `must_change_password: true` every RESOURCE endpoint returns 403 with
        `code: must_change_password`, and a successful call here clears the flag. The
        gate is attached only to the resource routes, so the self-service `/auth/*`
        endpoints (account, language, font, 2FA, change-username) stay reachable while
        the flag is set.

        Strength rule: at least 10 characters with an uppercase letter, a lowercase
        letter, a digit and a special character, and not a common password.
      security:
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password, new_password_confirm]
              properties:
                current_password:
                  type: string
                  format: password
                new_password:
                  type: string
                  format: password
                  minLength: 10
                new_password_confirm:
                  type: string
                  format: password
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: Weak password or passwords do not match
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Current password is incorrect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /proxy-hosts:
    get:
      tags: [Proxy Hosts]
      summary: List proxy hosts
      description: |
        Returns a paginated list of proxy hosts. Requires the `proxy:read` scope
        when called with an API token.

        Results are always ordered favourites-first (`is_favorite DESC`) before
        the requested sort is applied.
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
          description: 1-based page number. Values below 1 are coerced to 1.
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Page size. Values outside 1..100 fall back to 20.
        - name: search
          in: query
          schema:
            type: string
          description: Case-insensitive substring match against the joined domain_names and forward_host.
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [name, created, updated]
          description: |
            Sort column. `name` sorts by the first domain name, `created` by
            created_at, `updated` by updated_at. Any other value is ignored and
            the default (created_at descending) is used.
        - name: sort_order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
          description: Only applied when sort_by is one of the accepted values; anything other than `desc` sorts ascending.
      responses:
        '200':
          description: List of proxy hosts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProxyHost'
                  total:
                    type: integer
                  page:
                    type: integer
                  per_page:
                    type: integer
                  total_pages:
                    type: integer

    post:
      tags: [Proxy Hosts]
      summary: Create proxy host
      description: |
        Creates a proxy host, writes its nginx config, runs `nginx -t` and
        reloads. If config generation or the reload fails the database row is
        rolled back. Requires the `proxy:write` scope when called with an API token.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProxyHost'
      responses:
        '201':
          description: Proxy host created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyHost'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Domain already exists, or a stream listener (host/port/protocol) conflicts with another host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /proxy-hosts/{id}:
    get:
      tags: [Proxy Hosts]
      summary: Get proxy host by ID
      description: Requires the `proxy:read` scope when called with an API token.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProxyHostId'
      responses:
        '200':
          description: Proxy host details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyHost'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Proxy Hosts]
      summary: Update proxy host
      description: |
        Partial update — only the fields present in the body are changed (see
        UpdateProxyHost). Requires the `proxy:write` scope when called with an
        API token.

        By default the update also regenerates the host's nginx config, runs
        `nginx -t` and reloads. Pass `skip_nginx=true` to persist to the database
        only.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProxyHostId'
        - name: skip_nginx
          in: query
          schema:
            type: string
            enum: ["true"]
          description: |
            When exactly `true`, the request takes the database-only path: the row
            is updated, a stale config file is removed if the domain changed, and
            managed DDNS records are reconciled — but no nginx config is
            generated, tested or reloaded. Any other value (or omitting the
            parameter) performs the full generate + `nginx -t` + reload. This is
            the path the web UI uses when it batches several edits before a single
            explicit regenerate.
        - name: ddns_remove_provider
          in: query
          schema:
            type: string
            enum: ["true"]
          description: |
            When exactly `true` AND this update leaves the host unmanaged
            (`ddns_enabled` false, or its provider cleared), the host's managed
            DDNS records are deleted at the DNS provider before their rows are
            dropped. It does NOT apply to records orphaned by a domain change
            while DDNS stays on — those are still removed from the local
            database only. Ignored unless the caller also holds
            `settings:write`. Defaults to false because deleting live public DNS
            is irreversible.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProxyHost'
      responses:
        '200':
          description: Proxy host updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyHost'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Domain already exists, or a stream listener conflicts with another host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [Proxy Hosts]
      summary: Delete proxy host
      description: |
        Deletes the host row and its generated nginx config, then reloads.
        Requires the `proxy:delete` scope when called with an API token.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProxyHostId'
        - name: ddns_remove_provider
          in: query
          schema:
            type: string
            enum: ["true"]
          description: |
            When exactly `true`, the host's managed DDNS records are deleted at
            the DNS provider before the row is removed. Ignored unless the caller
            also holds `settings:write`. Without it the records are only dropped
            locally (FK cascade) and the public DNS entry keeps pointing here.
      responses:
        '204':
          description: Proxy host deleted
  /proxy-hosts/{id}/rate-limit:
    get:
      tags: [Security]
      summary: Get rate limit config for a proxy host
      description: |
        Returns the host's stored rate limit row. When no row exists a default
        object is synthesized from the server defaults (`enabled` false,
        `limit_by` `ip`) — it is not persisted. Requires the `proxy:read` scope
        when called with an API token.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProxyHostId'
      responses:
        '200':
          description: Rate limit configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimit'

    put:
      tags: [Security]
      summary: Create or update the rate limit config
      description: Upsert. Requires the `proxy:write` scope when called with an API token.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProxyHostId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRateLimit'
      responses:
        '200':
          description: Rate limit saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimit'
        '400':
          $ref: '#/components/responses/BadRequest'

    delete:
      tags: [Security]
      summary: Delete the rate limit config
      description: |
        Removes the host's rate limit row; the host then falls back to inheriting
        the global rate-limit default. Requires the `proxy:delete` scope when
        called with an API token.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProxyHostId'
      responses:
        '204':
          description: Rate limit deleted
  /proxy-hosts/{id}/bot-filter:
    get:
      tags: [Security]
      summary: Get bot filter config for a proxy host
      description: |
        Returns the host's stored bot filter row. When no row exists a default
        object is synthesized (`enabled` false, `block_bad_bots` true,
        `block_ai_bots` false, `allow_search_engines` true, empty id and
        timestamps) — it is not persisted. Requires the `proxy:read` scope when
        called with an API token.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProxyHostId'
      responses:
        '200':
          description: Bot filter configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotFilter'

    put:
      tags: [Security]
      summary: Create or update the bot filter config
      description: |
        Upsert. Boolean fields are optional pointers: omitting one keeps the
        stored value (or applies the insert default on first write). The two
        `custom_*_agents` strings are always written as sent, so omitting them
        clears them. Requires the `proxy:write` scope when called with an API token.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProxyHostId'
        - name: skip_reload
          in: query
          schema:
            type: string
            enum: ["true"]
          description: When exactly `true`, the settings are saved but the host's nginx config is not regenerated or reloaded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBotFilter'
      responses:
        '200':
          description: Bot filter saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotFilter'
        '400':
          $ref: '#/components/responses/BadRequest'

    delete:
      tags: [Security]
      summary: Delete the bot filter config
      description: |
        Removes the host's bot filter row; the host then falls back to inheriting
        the global bot-filter default. Requires the `proxy:delete` scope when
        called with an API token.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProxyHostId'
      responses:
        '204':
          description: Bot filter deleted
  /proxy-hosts/{id}/security-headers:
    get:
      tags: [Security]
      summary: Get security headers config for a proxy host
      description: |
        Returns the host's stored security headers row. When no row exists a
        default object is synthesized (`enabled` false, HSTS on with a one-year
        max-age, `x_frame_options` SAMEORIGIN, `referrer_policy`
        strict-origin-when-cross-origin) — it is not persisted. Requires the
        `proxy:read` scope when called with an API token.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProxyHostId'
      responses:
        '200':
          description: Security headers configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityHeaders'

    put:
      tags: [Security]
      summary: Create or update the security headers config
      description: Upsert. Requires the `proxy:write` scope when called with an API token.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProxyHostId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSecurityHeaders'
      responses:
        '200':
          description: Security headers saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityHeaders'
        '400':
          $ref: '#/components/responses/BadRequest'

    delete:
      tags: [Security]
      summary: Delete the security headers config
      description: |
        Removes the host's security headers row; the host then falls back to
        inheriting the global security-headers default. Requires the
        `proxy:delete` scope when called with an API token.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProxyHostId'
      responses:
        '204':
          description: Security headers deleted
  /proxy-hosts/{id}/geo:
    get:
      tags: [GeoIP]
      summary: Get geo restriction for a proxy host
      description: |
        Returns the host's stored geo restriction. When the host has no geo row at
        all the response is a stub containing only `proxy_host_id`, `mode`
        (`blacklist`), `countries` (empty array) and `enabled` (false) — the other
        GeoRestriction fields are absent. Requires the `proxy:read` scope when
        called with an API token.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProxyHostId'
      responses:
        '200':
          description: Geo restriction configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoRestriction'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      tags: [GeoIP]
      summary: Create or replace the geo restriction
      description: |
        Full upsert — every column is written from the body, so omitted optional
        fields are reset to their defaults (`enabled` true, `allow_private_ips`
        true, `allow_search_bots` false, `challenge_mode` false, `disable_global`
        false). Use PUT for a partial update. Requires the `proxy:write` scope
        when called with an API token.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProxyHostId'
        - name: skip_reload
          in: query
          schema:
            type: string
            enum: ["true"]
          description: When exactly `true`, the settings are saved but the host's nginx config is not regenerated or reloaded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGeoRestriction'
      responses:
        '200':
          description: Geo restriction saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoRestriction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [GeoIP]
      summary: Update the geo restriction
      description: |
        Partial update — only the fields present in the body are changed. Fails
        with 404 when the host has no geo row yet (use POST to create one).
        Always regenerates and reloads the host config. Requires the
        `proxy:write` scope when called with an API token.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProxyHostId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGeoRestriction'
      responses:
        '200':
          description: Geo restriction updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoRestriction'
        '404':
          description: Geo restriction not found for this host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [GeoIP]
      summary: Delete the geo restriction
      description: |
        Removes the host's geo row entirely. The host then falls back to
        inheriting the global geo default. Requires the `proxy:delete` scope when
        called with an API token.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProxyHostId'
        - name: skip_reload
          in: query
          schema:
            type: string
            enum: ["true"]
          description: When exactly `true`, the row is deleted but the host's nginx config is not regenerated or reloaded.
      responses:
        '204':
          description: Geo restriction deleted
  /proxy-hosts/{id}/upstream:
    get:
      tags: [Security]
      summary: Get upstream / load balancing config for a proxy host
      description: |
        Returns the host's stored upstream row. When no row exists a default
        object is synthesized (`scheme` http, `load_balance` round_robin, health
        check off with interval 30s / timeout 5s / path "/" / expected status 200,
        `keepalive` 32, empty `servers`) — it is not persisted. Requires the
        `proxy:read` scope when called with an API token.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProxyHostId'
      responses:
        '200':
          description: Upstream configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upstream'

    put:
      tags: [Security]
      summary: Create or replace the upstream config
      description: |
        Full upsert — every column is written from the body, so an omitted field
        is reset to its default rather than left alone (see CreateUpstream).
        `load_balance`, `scheme`, the generated/supplied upstream name, every
        server address and every port are validated server-side and rejected
        with 400. Requires the `proxy:write` scope when called with an API token.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProxyHostId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUpstream'
      responses:
        '200':
          description: Upstream saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upstream'
        '400':
          $ref: '#/components/responses/BadRequest'

    delete:
      tags: [Security]
      summary: Delete the upstream config
      description: Requires the `proxy:delete` scope when called with an API token.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProxyHostId'
      responses:
        '204':
          description: Upstream deleted
  /certificates:
    get:
      tags: [Certificates]
      summary: List certificates
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: per_page
          in: query
          description: Values outside 1-100 fall back to 20.
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: search
          in: query
          description: Case-insensitive substring match over the domain list.
          schema:
            type: string
        - name: status
          in: query
          description: Values outside the enum are ignored (no filtering applied).
          schema:
            type: string
            enum: [pending, issued, expired, error, renewing]
        - name: provider
          in: query
          description: Values outside the enum are ignored (no filtering applied).
          schema:
            type: string
            enum: [letsencrypt, selfsigned, custom]
        - name: sort_by
          in: query
          description: Unknown values fall back to created_at DESC.
          schema:
            type: string
            enum: [domain, expires, created]
        - name: sort_order
          in: query
          description: Anything other than "asc" is treated as descending.
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Paginated certificates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateListResponse'

    post:
      tags: [Certificates]
      summary: Request new certificate
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCertificate'
      responses:
        '201':
          description: Certificate record created; issuance runs in the background
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Certificate'
        '400':
          description: domain_names missing or input rejected
  /certificates/{id}:
    get:
      tags: [Certificates]
      summary: Get certificate
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Certificate with computed expiry fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateWithDetails'
        '404':
          description: Certificate not found

    delete:
      tags: [Certificates]
      summary: Delete certificate
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Certificate deleted
        '404':
          description: Certificate not found
        '409':
          description: Still referenced by a proxy or redirect host
  /certificates/{id}/renew:
    post:
      tags: [Certificates]
      summary: Renew certificate
      description: |
        Marks the certificate "renewing" and runs the renewal in the background — the
        200 means "started", not "renewed". Poll `GET /certificates/{id}` or
        `GET /certificates/{id}/logs` for the outcome. Only Let's Encrypt and
        self-signed certificates are re-issued: a custom (uploaded) certificate is
        accepted with 200 and then moved to status "error" with the message
        "cannot renew custom certificates". A renewal that is already in progress
        (status renewing/pending, or another instance holds the lock) fails with 500.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Renewal started
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: >-
            Wildcard domains without a DNS provider — DNS-01 is required and the
            message is also persisted to the certificate's error_message
        '404':
          description: Certificate not found
  /waf/rules:
    get:
      tags: [WAF]
      summary: List WAF rules
      description: Get all OWASP CRS rules, optionally filtered by proxy host
      security:
        - BearerAuth: []
      parameters:
        - name: proxy_host_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of WAF rules
  /waf/hosts:
    get:
      tags: [WAF]
      summary: Get WAF config for all hosts
      security:
        - BearerAuth: []
      responses:
        '200':
          description: WAF configurations
  /waf/hosts/{id}/config:
    get:
      tags: [WAF]
      summary: Get WAF config for specific host
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProxyHostId'
      responses:
        '200':
          description: WAF configuration
  /waf/hosts/{id}/rules/{ruleId}/disable:
    post:
      tags: [WAF]
      summary: Disable WAF rule for host
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProxyHostId'
        - name: ruleId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Rule disabled

    delete:
      tags: [WAF]
      summary: Enable WAF rule for host
      description: Remove rule exclusion
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProxyHostId'
        - name: ruleId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Rule enabled

  # ============================================================================
  # Settings & Dashboard
  # ============================================================================
  /settings:
    get:
      tags: [Settings]
      summary: Get global settings
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Global settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalSettings'

    put:
      tags: [Settings]
      summary: Update global settings
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GlobalSettings'
      responses:
        '200':
          description: Settings updated
  /dashboard:
    get:
      tags: [Settings]
      summary: Get dashboard data
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
  /dashboard/health:
    get:
      tags: [Settings]
      summary: Get system health
      security:
        - BearerAuth: []
      responses:
        '200':
          description: System health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemHealth'
  /backups:
    get:
      tags: [Backups]
      summary: List backups
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: per_page
          in: query
          description: Values outside 1-100 fall back to 20.
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Paginated list of backups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupListResponse'

    post:
      tags: [Backups]
      summary: Create backup
      description: |
        Returns immediately with the backup row in status "in_progress"; the archive is
        written in the background. Poll `GET /backups/{id}` until status is "completed"
        or "failed". If all three `includes_*` flags are false (or absent) the server
        turns all three on.
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBackup'
      responses:
        '202':
          description: Backup accepted; archive is written asynchronously
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Backup'
  /backups/{id}:
    get:
      tags: [Backups]
      summary: Get backup
      description: Poll this after POST /backups to watch `status` move off "in_progress".
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Backup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Backup'
        '404':
          description: Backup not found

    delete:
      tags: [Backups]
      summary: Delete backup
      description: Removes the archive file and the row. Requires the backup:create scope.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Backup deleted
        '404':
          description: Backup not found
  /backups/{id}/restore:
    post:
      tags: [Backups]
      summary: Restore from backup
      description: |
        Synchronous. Verifies the stored SHA-256 first, imports the database, then
        restores files and regenerates nginx configs. Returns 206 when only part of the
        restore succeeded — always inspect the result body rather than the status code
        alone.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Restore completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreResult'
        '206':
          description: Restore partially completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreResult'
        '400':
          description: Backup is not in status "completed"
        '404':
          description: Backup not found

  # ============================================================================
  # Certificates
  # ============================================================================
  /backups/{id}/download:
    get:
      tags: [Backups]
      summary: Download the backup archive
      description: |
        Streams the stored `.tar.gz` as an attachment. When a checksum was recorded it
        is sent in the `X-Checksum-SHA256` response header so the client can verify the
        download.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Archive file
          headers:
            X-Checksum-SHA256:
              description: SHA-256 of the archive; omitted when none was recorded
              schema:
                type: string
          content:
            application/gzip:
              schema:
                type: string
                format: binary
        '400':
          description: Backup is not in status "completed"
        '404':
          description: Backup not found
  /system-settings:
    get:
      tags: [Settings]
      summary: Get system settings
      security:
        - BearerAuth: []
      responses:
        '200':
          description: System settings
          content:
