    Backup:
      type: object
      properties:
        id:
          type: string
          format: uuid
        filename:
          type: string
        file_size:
          type: integer
          format: int64
        file_path:
          type: string
          description: Absolute path inside the API container
        includes_config:
          type: boolean
        includes_certificates:
          type: boolean
        includes_database:
          type: boolean
        backup_type:
          type: string
          description: >-
            manual (POST /backups), auto (backup scheduler), uploaded
            (POST /backups/upload-restore), test (GET /test/backup-restore).
            Defaults to "manual" at the database level.
        description:
          type: string
        status:
          type: string
          enum: [pending, in_progress, completed, failed]
        error_message:
          type: string
        checksum_sha256:
          type: string
          description: Also returned as the X-Checksum-SHA256 header on download
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
    APIToken:
      type: object
      description: |
        An API token as returned by the token endpoints. The token hash is `json:"-"` and
        the secret itself is only ever shown once, at creation.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        token_prefix:
          type: string
          description: 'The displayable head of the token: "ng_" plus its first 8 characters.'
        permissions:
          type: array
          description: Legacy resource scopes, or `*`. This is a coarser axis than the `area:verb` strings roles use; a token is additionally capped by its owner's role at request time.
          items:
            type: string
        allowed_ips:
          type: array
          description: Exact IPs or CIDR blocks. Omitted/empty means no IP restriction.
          items:
            type: string
        rate_limit:
          type: integer
          description: Per-token request rate override. Omitted means the global limit applies.
        expires_at:
          type: string
          format: date-time
          description: Omitted for a token with no expiry.
        last_used_at:
          type: string
          format: date-time
        last_used_ip:
          type: string
        use_count:
          type: integer
          format: int64
        is_active:
          type: boolean
          description: False once revoked or manually suspended. An inactive or expired token is rejected at authentication.
        is_expired:
          type: boolean
          description: Computed at serialisation time from expires_at, not stored.
        created_at:
          type: string
          format: date-time
        username:
          type: string
          description: Owner's username, joined by the list and get queries. Absent from the POST /api-tokens response, which is serialised from the in-memory record before any join.
    DNSProvider:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        provider_type:
          type: string
          enum: [cloudflare, route53, duckdns, dynu, manual]
        is_default:
          type: boolean
        has_credentials:
          type: boolean
          description: >-
            Credentials are never returned. This flag reports only whether any are
            stored.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateDNSProvider:
      type: object
      required: [name, provider_type, credentials]
      properties:
        name:
          type: string
        provider_type:
          type: string
          enum: [cloudflare, route53, duckdns, dynu, manual]
        credentials:
          type: object
          description: >-
            Provider-specific object. cloudflare: api_token (or api_key + email), plus
            optional zone_id. route53: access_key_id, secret_access_key, optional region
            and hosted_zone_id. duckdns: token. dynu: api_key. manual: none required.
        is_default:
          type: boolean
    RedirectHost:
      type: object
      properties:
        id:
          type: string
          format: uuid
        domain_names:
          type: array
          items:
            type: string
        forward_scheme:
          type: string
          enum: [auto, http, https]
          description: '"auto" keeps the incoming request''s scheme'
        forward_domain_name:
          type: string
          description: Target domain of the redirect
        forward_path:
          type: string
          description: Optional path appended to the target
        preserve_path:
          type: boolean
          description: Keep the original request path in the redirect target
        redirect_code:
          type: integer
          enum: [301, 302, 307, 308]
        ssl_enabled:
          type: boolean
        certificate_id:
          type: string
          format: uuid
        ssl_force_https:
          type: boolean
        enabled:
          type: boolean
          description: Disabled hosts have their nginx config removed
        block_exploits:
          type: boolean
        meta:
          type: object
          description: Free-form client metadata stored verbatim
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateRedirectHost:
      type: object
      required: [domain_names, forward_domain_name]
      properties:
        domain_names:
          type: array
          minItems: 1
          items:
            type: string
        forward_scheme:
          type: string
          enum: [auto, http, https]
          default: auto
        forward_domain_name:
          type: string
        forward_path:
          type: string
        preserve_path:
          type: boolean
          default: true
        redirect_code:
          type: integer
          enum: [301, 302, 307, 308]
          default: 301
        ssl_enabled:
          type: boolean
          default: false
        certificate_id:
          type: string
          format: uuid
        ssl_force_https:
          type: boolean
          default: true
        enabled:
          type: boolean
          default: true
        block_exploits:
          type: boolean
          default: false
        meta:
          type: object
    AccessList:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        satisfy_any:
          type: boolean
          description: >-
            True emits `satisfy any;` into the host config; false emits nothing and
            nginx applies its default of `satisfy all`.
        pass_auth:
          type: boolean
          description: >-
            Stored and returned, but currently not read by nginx config generation — it
            has no effect on the running proxy.
        items:
          type: array
          description: >-
            The rules. A list with no items is not rendered into the host config at all;
            a list with items always ends in an implicit `deny all`.
          items:
            $ref: '#/components/schemas/AccessListItem'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateAccessList:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        satisfy_any:
          type: boolean
          default: true
        pass_auth:
          type: boolean
          default: false
        items:
          type: array
          items:
            $ref: '#/components/schemas/CreateAccessListItem'
    ChallengeConfig:
      type: object
      description: |
        CAPTCHA challenge configuration. The same shape is returned for the global
        config (proxy_host_id null) and for a per-host config. The stored secret
        key is never serialised.
      properties:
        id:
          type: string
          format: uuid
        proxy_host_id:
          type: string
          format: uuid
          nullable: true
          description: Null for the global challenge config.
        enabled:
          type: boolean
        challenge_type:
          type: string
          enum: [recaptcha_v2, recaptcha_v3, turnstile]
          default: recaptcha_v2
          description: |
            Verification provider. Only these three values are branched on:
            `turnstile` verifies against Cloudflare, `recaptcha_v2` and
            `recaptcha_v3` against Google. Any other stored value falls through to
            the reCAPTCHA verifier.
        site_key:
          type: string
        has_secret_key:
          type: boolean
          description: Replaces the secret key in responses — true when a secret is stored.
        token_validity:
          type: integer
          description: Lifetime of an issued bypass token, in seconds.
        min_score:
          type: number
          format: float
          description: Minimum score to pass; only compared when challenge_type is recaptcha_v3.
        apply_to:
          type: string
          default: both
          description: |
            Persisted and returned, but no code in the request path reads it.
            Where a challenge is actually shown is decided by the `challenge_mode`
            flag on the geo restriction, `challenge_suspicious` on the bot filter
            and `challenge_mode` on cloud-provider blocking.
        page_title:
          type: string
        page_message:
          type: string
        theme:
          type: string
          enum: [light, dark]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CloudProvider:
      type: object
      properties:
        slug:
          type: string
        name:
          type: string
        enabled:
          type: boolean
        ip_ranges:
          type: array
          items:
            type: string
        last_updated:
          type: string
          format: date-time
    CreateCloudProvider:
      type: object
      required: [name, slug, region, ip_ranges]
      properties:
        name:
          type: string
        slug:
          type: string
          description: Stable identifier used by per-host blocked_providers lists.
        region:
          type: string
          enum: [us, eu, cn, kr, other]
        description:
          type: string
        ip_ranges:
          type: array
          minItems: 1
          items:
            type: string
          description: CIDR ranges belonging to this provider.
        ip_ranges_url:
          type: string
          description: Optional URL the ranges can be refreshed from.
    ExploitRule:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        category:
          type: string
        pattern:
          type: string
        action:
          type: string
          enum: [block, log, challenge]
        enabled:
