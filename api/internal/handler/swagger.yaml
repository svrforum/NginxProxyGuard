    CreateGeoRestriction:
      type: object
      description: |
        Full upsert body for POST /proxy-hosts/{id}/geo. Every column is written,
        so an omitted optional field is stored at its default rather than being
        left alone.
      required: [mode]
      properties:
        mode:
          type: string
          enum: [whitelist, blacklist]
          description: Rejected with 400 if it is neither value.
        countries:
          type: array
          items:
            type: string
          description: ISO 3166-1 alpha-2 country codes. Stored as sent.
        allowed_ips:
          type: array
          items:
            type: string
          description: Stored as an empty array when omitted.
        allow_private_ips:
          type: boolean
          default: true
        allow_search_bots:
          type: boolean
          default: false
        enabled:
          type: boolean
          default: true
        challenge_mode:
          type: boolean
          default: false
        disable_global:
          type: boolean
          default: false
          description: See GeoRestriction.disable_global.
    UpdateGeoRestriction:
      type: object
      description: |
        Partial update body for PUT /proxy-hosts/{id}/geo. Absent fields are left
        unchanged; `countries` is additionally ignored when sent as an empty array.
      properties:
        mode:
          type: string
          enum: [whitelist, blacklist]
        countries:
          type: array
          items:
            type: string
        allowed_ips:
          type: array
          items:
            type: string
        allow_private_ips:
          type: boolean
        allow_search_bots:
          type: boolean
        enabled:
          type: boolean
        challenge_mode:
          type: boolean
        disable_global:
          type: boolean
          description: See GeoRestriction.disable_global.
    CreateBotFilter:
      type: object
      description: |
        Upsert body. The boolean fields are pointers: omitting one keeps the
        stored value on update, or applies the insert default on first write
        (enabled true, block_bad_bots true, block_ai_bots false,
        allow_search_engines true, block_suspicious_clients false,
        challenge_suspicious false, disable_global false). The two custom agent
        strings are NOT pointers and are always written, so omitting them clears
        them.
      properties:
        enabled:
          type: boolean
        block_bad_bots:
          type: boolean
        block_ai_bots:
          type: boolean
        allow_search_engines:
          type: boolean
        block_suspicious_clients:
          type: boolean
        custom_blocked_agents:
          type: string
        custom_allowed_agents:
          type: string
        challenge_suspicious:
          type: boolean
        disable_global:
          type: boolean
          description: See BotFilter.disable_global.
    BlockedCloudProviders:
      type: object
      description: A proxy host's own cloud-provider blocking settings, as returned by GET /proxy-hosts/{id}/blocked-cloud-providers.
      properties:
        blocked_providers:
          type: array
          items:
            type: string
          description: |
            Cloud provider slugs whose IP ranges are blocked for this host. Cloud
            blocking has no separate enabled flag — a non-empty list IS the
            "override" state and makes cloud_disable_global irrelevant.
        challenge_mode:
          type: boolean
          description: Show a challenge instead of blocking matching requests.
        allow_search_bots:
          type: boolean
          description: Let known search engine bots through even when their IP is in a blocked range.
        cloud_disable_global:
          type: boolean
          description: |
            The "disable" leg of the cloud-blocking tri-state; only consulted when
            blocked_providers is empty. true = this host is opted out: nothing is
            blocked and the global cloud default (GET
            /settings/global-cloud-providers) is NOT applied. false = inherit —
            the global blocked list, together with the global challenge_mode and
            allow_search_bots, is used whenever that global list is non-empty; if
            the global list is also empty nothing is blocked.

            Separate from the geo `disable_global` field: they are stored in
            different columns and do not affect each other.
    UpdateBlockedCloudProviders:
      type: object
      description: |
        Full replace. All four fields are written exactly as sent — the booleans
        are plain values, so omitting one stores false, and omitting
        blocked_providers clears the list.
      properties:
        blocked_providers:
          type: array
          items:
            type: string
          description: Cloud provider slugs (see GET /cloud-providers).
        challenge_mode:
          type: boolean
        allow_search_bots:
          type: boolean
        cloud_disable_global:
          type: boolean
          description: See BlockedCloudProviders.cloud_disable_global. Persisted, but not echoed in the PUT response.
    URIBlockRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Server-generated. Values that are empty or start with "temp-" are replaced with a fresh UUID on write.
        pattern:
          type: string
        match_type:
          type: string
          enum: [exact, prefix, regex]
          description: Maps to nginx `location =`, `location ^~` and `location ~*` respectively.
        description:
          type: string
        enabled:
          type: boolean
    CreateURIBlock:
      type: object
      description: |
        Full upsert body. `rules`, `exception_ips` and `allow_private_ips` are
        written as sent, so omitting `rules` or `exception_ips` stores an empty
        list. `enabled` and `allow_private_ips` default to true when omitted.
      properties:
        enabled:
          type: boolean
          default: true
        rules:
          type: array
          items:
            $ref: '#/components/schemas/URIBlockRule'
        exception_ips:
          type: array
          items:
            type: string
          description: Each entry must parse as an IP address or CIDR, otherwise the request is rejected with 400.
        allow_private_ips:
          type: boolean
          default: true
    AddURIBlockRule:
      type: object
      description: Body for POST /proxy-hosts/{id}/uri-block/rules — adds one rule without rewriting the rest.
      required: [pattern]
      properties:
        pattern:
          type: string
          description: Rejected with 400 when empty, or when match_type is regex and the pattern does not compile.
        match_type:
          type: string
          enum: [exact, prefix, regex]
          default: prefix
          description: Defaults to prefix when omitted or empty.
        description:
          type: string
        enabled:
          type: boolean
          default: true
    CreateRateLimit:
      type: object
      description: |
        Upsert body. `enabled` and `disable_global` are pointers: omitting one
        keeps the stored value, or applies the insert default (enabled true,
        disable_global false) on first write.

        The remaining fields are plain values that are only written when
        non-zero — sending 0 (or "" for the strings) leaves the stored value
        alone, and on first write falls back to requests_per_second 50,
        burst_size 100, zone_size "10m", limit_by "ip", limit_response 429.

        `whitelist_ips` is nullable and does not follow that rule: omitting it
        keeps the stored list, and sending `""` clears it.
      properties:
        enabled:
          type: boolean
        requests_per_second:
          type: integer
        burst_size:
          type: integer
        zone_size:
          type: string
        limit_by:
          type: string
          enum: [ip, uri, ip_uri]
        limit_response:
          type: integer
        whitelist_ips:
          type: string
          nullable: true
          description: >-
            Comma- or newline-separated IPs and CIDR ranges exempt from the
            limit. Omit to keep the stored list, send "" to clear it. Invalid
            entries are rejected with 400.
        disable_global:
          type: boolean
          description: See RateLimit.disable_global.
    CreateFail2ban:
      type: object
      description: |
        Upsert body. `enabled` is a pointer: omitting it keeps the stored value,
        or inserts true on first write.

        The other fields are plain values written only when non-zero (or
        non-empty), so omitting one keeps the stored value; on first write they
        fall back to max_retries 5, find_time 600, ban_time 3600, fail_codes
        "401,403", action "block". `ban_time` is the one exception: on an update
        0 IS written (permanent ban), but on the first write 0 becomes 3600.
      properties:
        enabled:
          type: boolean
        max_retries:
          type: integer
        find_time:
          type: integer
        ban_time:
          type: integer
        fail_codes:
          type: string
        action:
          type: string
          enum: [block, log, notify]
    CreateSecurityHeaders:
      type: object
      description: |
        Upsert body. The boolean fields are pointers: omitting one keeps the
        stored value, or applies the insert default (enabled, hsts_enabled,
        hsts_include_subdomains, x_content_type_options and x_xss_protection
        true; hsts_preload and disable_global false).

        `hsts_max_age`, `x_frame_options` and `referrer_policy` are only written
        when non-zero / non-empty — omitting one keeps the stored value, and on
        first write they default to 31536000, "SAMEORIGIN" and
        "strict-origin-when-cross-origin".

        `content_security_policy`, `permissions_policy` and `custom_headers` are
        ALWAYS written, so omitting them clears the stored value.
      properties:
        enabled:
          type: boolean
        hsts_enabled:
          type: boolean
        hsts_max_age:
          type: integer
        hsts_include_subdomains:
          type: boolean
        hsts_preload:
          type: boolean
        x_frame_options:
          type: string
          description: See SecurityHeaders.x_frame_options — free-form, emitted verbatim.
        x_content_type_options:
          type: boolean
        x_xss_protection:
          type: boolean
        referrer_policy:
          type: string
        content_security_policy:
          type: string
        permissions_policy:
          type: string
        custom_headers:
          type: object
          additionalProperties:
            type: string
          description: See SecurityHeaders.custom_headers — stored but never emitted by nginx.
        disable_global:
          type: boolean
          description: See SecurityHeaders.disable_global.
    UpstreamServer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        upstream_id:
          type: string
          format: uuid
        address:
          type: string
        port:
          type: integer
        weight:
          type: integer
        max_fails:
          type: integer
        fail_timeout:
          type: integer
        is_backup:
          type: boolean
        is_down:
          type: boolean
        is_healthy:
          type: boolean
        last_check_at:
          type: string
          format: date-time
        last_error:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateUpstream:
      type: object
      description: |
        Full-replace upsert: an existing row has every column overwritten with
        the values below, so an omitted field is reset to its default rather
        than left alone — omitting `health_check_enabled` stores false, omitting
        `servers` empties the pool, and omitting the rest restores
        round_robin / 30 / 5 / "/" / 200 / 32.
      properties:
        name:
          type: string
          description: nginx upstream block name. Defaults to `upstream_` + the first 8 characters of the proxy host id when empty, and must match ^[a-zA-Z0-9_]+$ or the request is rejected with 400.
        scheme:
          type: string
          enum: [http, https]
          default: http
        servers:
          type: array
          description: Replaces the whole server list. Each entry's zero-valued port, weight, max_fails and fail_timeout are stored as 80, 1, 3 and 30; is_healthy is always stored true.
          items:
            type: object
            required: [address]
            properties:
              address:
                type: string
                description: Required — an empty address is rejected with 400.
              port:
                type: integer
                minimum: 0
                maximum: 65535
                description: 0 is stored as 80. Values above 65535 are rejected with 400.
              weight:
                type: integer
              max_fails:
                type: integer
              fail_timeout:
                type: integer
              is_backup:
                type: boolean
              is_down:
                type: boolean
        load_balance:
          type: string
          enum: [round_robin, least_conn, ip_hash, random]
        health_check_enabled:
          type: boolean
        health_check_interval:
          type: integer
        health_check_timeout:
          type: integer
        health_check_path:
          type: string
        health_check_expected_status:
          type: integer
        keepalive:
          type: integer
    UpdateChallengeConfig:
      type: object
      description: Partial update — every field is a pointer, so absent fields keep their stored value. `secret_key` is write-only.
      properties:
        enabled:
          type: boolean
        challenge_type:
          type: string
          enum: [recaptcha_v2, recaptcha_v3, turnstile]
          description: See ChallengeConfig.challenge_type.
        site_key:
          type: string
        secret_key:
          type: string
          writeOnly: true
          description: Stored but never returned; GET reports only has_secret_key.
        token_validity:
          type: integer
        min_score:
          type: number
          format: float
        apply_to:
          type: string
          description: See ChallengeConfig.apply_to — persisted but not read by the request path.
        page_title:
          type: string
        page_message:
          type: string
        theme:
          type: string
          enum: [light, dark]
    WAFTestPattern:
      type: object
      description: One entry of the hard-coded attack catalogue served by /waf-test/patterns.
      properties:
        id:
          type: string
          description: Value to send as `attack_type` on /waf-test/test.
          enum:
            - sql_injection
            - sql_injection_union
            - xss_script
            - xss_event
            - path_traversal
            - path_traversal_encoded
            - command_injection
            - command_injection_pipe
            - scanner_sqlmap
            - scanner_nikto
            - rce_php
            - protocol_attack
        category:
          type: string
          description: Display grouping, e.g. "SQL Injection", "XSS", "Scanner Detection".
        description:
          type: string
    WAFTestRequest:
      type: object
      description: |
        Body for a single WAF self-test. Depending on the pattern, the payload is
        appended to the URL path, appended as a query string, or sent as a request
        header — the caller does not choose.
      properties:
        target_url:
          type: string
          description: Base URL the payload is appended to. Required; an empty value is rejected with 400.
        attack_type:
          type: string
          description: Id of a built-in pattern. Anything else is rejected with 400.
          enum:
            - sql_injection
            - sql_injection_union
            - xss_script
            - xss_event
            - path_traversal
            - path_traversal_encoded
            - command_injection
            - command_injection_pipe
            - scanner_sqlmap
            - scanner_nikto
            - rce_php
            - protocol_attack
        custom_value:
          type: string
          description: Accepted by the binder but never read by the handler — sending it has no effect.
        host_header:
          type: string
          description: Overrides the outbound Host header, so a container-internal address can be tested against a virtual host.
    WAFTestAllRequest:
      type: object
      description: Body for the all-patterns sweep. There is no attack_type — every built-in pattern is fired.
      properties:
        target_url:
          type: string
          description: Base URL every payload is appended to. Required; an empty value is rejected with 400.
        host_header:
          type: string
          description: Overrides the outbound Host header for every request in the sweep.
    WAFTestResult:
      type: object
      description: Outcome of one attack payload.
      properties:
        attack_type:
          type: string
          description: Pattern id that produced this result.
        test_url:
          type: string
          description: URL actually requested, including any appended path or query payload.
        status_code:
          type: integer
          description: Upstream response status, or 0 when the request never completed.
        blocked:
          type: boolean
          description: True for status 403, 406 or 429, and also true when the connection failed.
        response_time_ms:
          type: integer
          format: int64
          description: Wall-clock time of the outbound request in milliseconds, measured even on failure.
        description:
          type: string
          description: The pattern's description. On /waf-test/test only, " (Connection failed - possibly blocked)" is appended when the request errored.
    URIBlockWithHost:
      type: object
      description: A host's URI block configuration with its proxy host's identity attached, as returned by GET /uri-blocks.
      allOf:
        - $ref: '#/components/schemas/URIBlockConfig'
        - type: object
          properties:
            domain_names:
              type: array
              items:
                type: string
              description: Domains of the owning proxy host.
            host_enabled:
              type: boolean
              description: Whether the owning proxy host is itself enabled. URI blocking on a disabled host is stored but not served.
    BulkAddURIBlockRuleRequest:
      type: object
      description: Adds one rule to many hosts in a single call.
      properties:
        pattern:
          type: string
          description: Required; an empty value is rejected with 400.
        match_type:
          type: string
          enum: [exact, prefix, regex]
          default: exact
          description: Omitted or empty becomes `exact` here (the per-host add endpoint defaults to `prefix` instead). A `regex` pattern is compiled up front and rejected with 400 if invalid.
        description:
          type: string
          description: Stored on the created rule.
        host_ids:
          type: array
          items:
            type: string
            format: uuid
          description: Targets. Omitted or empty means every enabled proxy host; if that set is also empty the request is rejected with 400.
    BulkAddURIBlockRuleResult:
      type: object
      description: Result of a bulk add. Returned with 200 even when some hosts failed, so compare added_count with total_hosts.
      properties:
        added_count:
          type: integer
          description: Hosts the rule was actually written to.
        total_hosts:
          type: integer
          description: Hosts that were targeted.
        pattern:
          type: string
        match_type:
          type: string
          description: The effective match type after the `exact` default was applied.
        errors:
          type: array
          items:
            type: string
          description: 'Per-host failure messages, each formatted as "<host_id>: <error>". Omitted entirely when there were none.'
    UpstreamHealthStatus:
      type: object
      description: Health snapshot of one upstream pool, computed at request time from stored server state.
      properties:
        upstream_id:
          type: string
          format: uuid
        name:
          type: string
        is_healthy:
          type: boolean
          description: The pool's own stored health flag, not derived from the per-server counts.
        healthy_count:
          type: integer
          description: Servers with `is_healthy` true and `is_down` false.
        unhealthy_count:
          type: integer
          description: All remaining servers.
        last_check_at:
          type: string
          format: date-time
          description: Omitted when the pool has never been checked.
        servers:
          type: array
          items:
            $ref: '#/components/schemas/ServerHealthStatus'
    ServerHealthStatus:
      type: object
      description: Per-server health entry inside an UpstreamHealthStatus.
      properties:
        address:
          type: string
        port:
          type: integer
        is_healthy:
          type: boolean
        is_backup:
          type: boolean
          description: Server is configured as a backup and only receives traffic when the primaries are down.
        is_down:
          type: boolean
          description: Server is administratively marked down.
        last_check_at:
          type: string
          format: date-time
          description: Omitted when never checked.
        last_error:
          type: string
          description: Omitted when empty.
        response_time_ms:
          type: integer
          format: int64
          description: Never populated by /upstreams/{id}/health — the field is omitted from every response this endpoint produces.
    GeoIPUpdateHistory:
      type: object
      description: One GeoIP database update run.
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, running, success, failed]
        trigger_type:
          type: string
          enum: [manual, auto]
          description: Whether an operator started the run or the scheduler did.
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          description: Omitted while the run is still pending or running.
        duration_ms:
          type: integer
          description: Omitted until the run finishes.
        database_version:
          type: string
          description: Omitted when empty.
        country_db_size:
          type: integer
          format: int64
          description: Bytes. Omitted when not recorded.
        asn_db_size:
          type: integer
          format: int64
          description: Bytes. Omitted when not recorded.
        error_message:
          type: string
          description: Omitted when empty.
        created_at:
          type: string
          format: date-time
    GeoIPUpdateHistoryResponse:
      type: object
      description: One page of GeoIP update history.
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/GeoIPUpdateHistory'
        total:
          type: integer
        page:
          type: integer
        per_page:
          type: integer
        total_pages:
          type: integer
    UpdateInfo:
      type: object
      description: |
        Result of the GitHub release check. Every field is present on every response;
        the version fields are empty strings when nothing is known yet.
      properties:
        current_version:
          type: string
          description: The running build's AppVersion.
        latest_version:
          type: string
          description: Latest published release tag. On a failed check this is the last known value, or empty if there is none.
        update_available:
          type: boolean
        release_url:
          type: string
        published_at:
          type: string
          description: Release publication timestamp as returned by GitHub.
        checked_at:
          type: string
          format: date-time
          description: RFC3339 UTC timestamp of this check attempt.
        check_failed:
          type: boolean
          description: True when the GitHub lookup failed. The response is still 200 and the other fields carry the previous successful result.
    ACMETestResult:
      type: object
      description: Verdict from the local ACME configuration check. No ACME directory is contacted.
      properties:
        acme_enabled:
          type: boolean
        acme_email:
          type: string
        acme_staging:
          type: boolean
        status:
          type: string
          enum: [ok, disabled, pending]
          description: '`disabled` when ACME is off, `pending` when it is on with no email, `ok` otherwise.'
        message:
          type: string
          description: Explanation matching `status`.
    AuditLogLabelOption:
      type: object
      description: A filter value paired with its display label, as served by /audit-logs/actions and /audit-logs/resource-types.
      properties:
        value:
          type: string
          description: The value to send as a filter.
        label:
          type: string
          description: Korean display name from a fixed lookup table; equal to `value` when the table has no entry.
    AuditLogEntry:
      type: object
      description: One audit trail record, reshaped by the handler for display.
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          description: Username captured at write time; retained even if the account is later deleted.
        action:
          type: string
        action_label:
          type: string
          description: Korean display name derived from `action` per response. Not stored, and equal to `action` when the lookup table has no entry.
        resource_type:
          type: string
          nullable: true
        resource_id:
          type: string
          nullable: true
        resource_name:
          type: string
          nullable: true
        details:
          type: object
          nullable: true
          additionalProperties: true
          description: Free-form JSON recorded with the event; shape varies by action.
        ip_address:
          type: string
          nullable: true
        user_agent:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
    AuditLogListResponse:
      type: object
      description: One page of audit log entries. Echoes the effective limit/offset after clamping.
      properties:
        logs:
          type: array
          items:
            $ref: '#/components/schemas/AuditLogEntry'
        total:
          type: integer
          description: Total matching the filter, ignoring limit/offset.
        limit:
          type: integer
        offset:
          type: integer
    APITokenUsageLogEntry:
      type: object
      description: One recorded API token request, joined with its token's identity.
      properties:
        id:
          type: string
          format: uuid
        token_id:
          type: string
          format: uuid
        token_name:
          type: string
        token_prefix:
          type: string
          description: Non-secret leading segment of the token, for identifying it in the UI.
        username:
          type: string
          description: Owner of the token.
        endpoint:
          type: string
        method:
          type: string
        status_code:
          type: integer
        client_ip:
          type: string
        user_agent:
          type: string
        response_time:
          type: integer
          description: Milliseconds. Named `response_time` here even though the stored column is `response_time_ms`.
        created_at:
          type: string
          format: date-time
    APITokenUsageLogResponse:
      type: object
      description: One page of merged, cross-token usage records.
      properties:
        logs:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/APITokenUsageLogEntry'
          description: Null rather than [] when no usage rows fall inside the 7-day window.
        total:
          type: integer
          description: Size of the merged set after the 7-day window and the 100-rows-per-token read cap, not the true request count.
        limit:
          type: integer
        offset:
          type: integer
    CloudProviderSummary:
      type: object
      description: Compact catalogue entry used by the region-grouped view; carries a count instead of the IP ranges themselves.
      properties:
        slug:
          type: string
          description: Stable identifier, and the path parameter of /cloud-providers/{slug}.
        name:
          type: string
        region:
          type: string
          enum: [us, eu, cn, kr]
        description:
          type: string
          description: Omitted when empty.
        ip_count:
          type: integer
          description: Number of stored IP ranges. 0 when the provider has none.
        enabled:
          type: boolean
          description: Always true in this view, which only returns enabled providers.
    CloudProvidersByRegion:
      type: object
      description: |
        Enabled providers bucketed by region. All four buckets are always present and
        are empty arrays when they have no members. A provider whose region is not one
        of these four is omitted from the response entirely.
      properties:
        us:
          type: array
          items:
            $ref: '#/components/schemas/CloudProviderSummary'
        eu:
          type: array
          items:
            $ref: '#/components/schemas/CloudProviderSummary'
        cn:
          type: array
          items:
            $ref: '#/components/schemas/CloudProviderSummary'
        kr:
          type: array
          items:
            $ref: '#/components/schemas/CloudProviderSummary'
    FilterSubscription:
      type: object
      description: |
        A subscribed remote block-list. Entries are stored separately and are exposed by
        `GET /filter-subscriptions/{id}`.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Supplied on create, else the list name from NPG-JSON, else the URL.
        description:
          type: string
          description: From the NPG-JSON `description` field. Omitted when empty.
        url:
          type: string
          format: uri
          description: Immutable after creation. Unique across subscriptions.
        format:
          type: string
          description: Auto-detected at fetch time.
          enum: [npg-json, plaintext]
        type:
          type: string
          description: |
            Decides which shared nginx file the entries land in — `ip`/`cidr` go to the IP
            blocklist, `user_agent` to the UA blocklist.
          enum: [ip, cidr, user_agent]
        enabled:
          type: boolean
          description: |
            False on creation. Only enabled subscriptions contribute entries to the generated
            nginx config.
        refresh_type:
          type: string
          description: Consumed by the filter-refresh scheduler.
          enum: [interval, daily, cron]
        refresh_value:
          type: string
          description: |
            For `interval` one of `6h`, `12h`, `24h`, `48h`; for `daily` an `HH:MM` string;
            for `cron` a cron expression. Only validated on create, not on update.
          example: 24h
        last_fetched_at:
          type: string
          format: date-time
          description: Last fetch attempt (success or failure). Omitted when never fetched.
        last_success_at:
          type: string
          format: date-time
          description: Last successful fetch. Omitted when there has never been one.
        last_error:
          type: string
          description: Error text of the last failed fetch. Omitted (cleared) after a success.
        entry_count:
          type: integer
          description: Entries stored for this subscription. Capped at 25000 per list.
        exclude_private_ips:
          type: boolean
          description: |
            When any enabled subscription sets this, private/loopback/link-local addresses are
            stripped from the merged IP blocklist — the flag is global in effect, not per list.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    FilterSubscriptionListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FilterSubscription'
        total:
          type: integer
        page:
          type: integer
        per_page:
          type: integer
        total_pages:
          type: integer
    FilterSubscriptionDetail:
      allOf:
        - $ref: '#/components/schemas/FilterSubscription'
        - type: object
          properties:
            entries:
              type: array
              description: Every stored entry, unfiltered by `entry_exclusions`.
              items:
                $ref: '#/components/schemas/FilterSubscriptionEntry'
            exclusions:
              type: array
              items:
                $ref: '#/components/schemas/FilterSubscriptionHostExclusion'
            entry_exclusions:
              type: array
              items:
                $ref: '#/components/schemas/FilterSubscriptionEntryExclusion'
    FilterSubscriptionEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        subscription_id:
          type: string
          format: uuid
        value:
          type: string
          description: An IP, a CIDR block, or a user-agent regex, depending on the subscription type.
        reason:
          type: string
          description: Only present for NPG-JSON lists that carry one. Omitted when empty.
        created_at:
          type: string
          format: date-time
    FilterSubscriptionHostExclusion:
      type: object
      description: Exempts one proxy host from the whole subscription.
      properties:
        id:
          type: string
          format: uuid
        subscription_id:
          type: string
          format: uuid
        proxy_host_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
    FilterSubscriptionEntryExclusion:
      type: object
      description: |
        Suppresses one value of the subscription when the shared blocklists are generated. The
        entry stays in the subscription and survives refreshes.
      properties:
        id:
          type: string
          format: uuid
        subscription_id:
          type: string
          format: uuid
        value:
          type: string
          description: An IP address or a CIDR block.
        created_at:
          type: string
          format: date-time
    CreateFilterSubscription:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: |
            Fetched immediately. Rejected when it resolves to a private, loopback or
            link-local address.
        name:
          type: string
          description: Optional. Falls back to the list's own name, then to the URL.
        type:
          type: string
          description: Optional. Falls back to the list's declared type, then to auto-detection.
          enum: [ip, cidr, user_agent]
        refresh_type:
          type: string
          default: interval
          enum: [interval, daily, cron]
        refresh_value:
          type: string
          default: 24h
          description: |
            For `interval` must be one of `6h`, `12h`, `24h`, `48h`; for `daily` must be
            `HH:MM`. Not validated for `cron`.
    UpdateFilterSubscription:
      type: object
      description: |
        Partial update. `url`, `type` and `format` are not readable here and cannot be changed.
      properties:
        name:
          type: string
        enabled:
          type: boolean
          description: Changing this regenerates the shared filter configs and reloads nginx asynchronously.
        refresh_type:
          type: string
          description: Not validated on this route.
        refresh_value:
          type: string
          description: Not validated on this route.
        exclude_private_ips:
          type: boolean
          description: Changing this regenerates the shared filter configs and reloads nginx asynchronously.
    FilterCatalog:
      type: object
      description: |
        The curated npg-filters index, fetched live on every call. Catalog entries are metadata
        only — they become subscriptions via `POST /filter-subscriptions/catalog/subscribe`.
      properties:
        version:
          type: integer
        generated_at:
          type: string
          description: Free-form timestamp string as published by the catalog.
        lists:
          type: array
          items:
            $ref: '#/components/schemas/FilterCatalogEntry'
    FilterCatalogEntry:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        type:
          type: string
          enum: [ip, cidr, user_agent]
        path:
          type: string
          description: |
            Relative to `https://raw.githubusercontent.com/svrforum/npg-filters/main/`. This is
            the value to pass in `paths` when subscribing.
        entry_count:
          type: integer
        updated_at:
          type: string
        subscribed:
          type: boolean
          description: |
            Present and true only when a subscription for the resolved URL already exists;
            omitted otherwise.
    CatalogSubscribeRequest:
      type: object
      required: [paths]
      properties:
        paths:
          type: array
          description: Catalog-relative paths. Must contain at least one item.
          items:
            type: string
        refresh_type:
          type: string
          description: Applied to every created subscription. Empty defaults to `interval`.
          enum: [interval, daily, cron]
        refresh_value:
          type: string
          description: Applied to every created subscription. Empty defaults to `24h`.
    AddEntryExclusionRequest:
      type: object
      required: [value]
      properties:
        value:
          type: string
          description: Must parse as an IP address or a CIDR block.
          example: 203.0.113.10
    DDNSRecord:
      type: object
      description: |
        A hostname whose A record is kept pointed at the server's detected public IPv4.
      properties:
        id:
          type: string
          format: uuid
        hostname:
          type: string
        dns_provider_id:
          type: string
          format: uuid
        record_type:
          type: string
          description: Always `A` — set server-side, not client-supplied.
          enum: [A]
        proxied:
          type: boolean
          description: Cloudflare only (orange cloud). Ignored by other providers.
        ttl:
          type: integer
          description: Cloudflare semantics; `1` means automatic. Values below 1 are stored as 1.
          minimum: 1
        enabled:
          type: boolean
          description: Only enabled records are visited by the scheduler and by `POST /ddns-records/sync`.
        last_ip:
          type: string
          description: IP of the last successful push. Empty string until the first sync.
        last_synced_at:
          type: string
          format: date-time
          description: Omitted until the record has been synced at least once.
        last_status:
          type: string
          description: Empty string until the first sync attempt.
          enum: ['', ok, error]
        last_error:
          type: string
          description: Empty string when the last attempt succeeded.
        proxy_host_id:
          type: string
          format: uuid
          description: |
            Present when the record is managed by a proxy host's DDNS opt-in; its hostname and
            provider are then owned by that host and cannot be changed through this API.
            Omitted for manually created records.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    DDNSRecordListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DDNSRecord'
        total:
          type: integer
        page:
          type: integer
        per_page:
          type: integer
        total_pages:
          type: integer
    CreateDDNSRecord:
      type: object
      required: [hostname, dns_provider_id]
      properties:
        hostname:
          type: string
          description: Must be unique per DNS provider.
        dns_provider_id:
          type: string
          format: uuid
          description: |
            Only providers of type `cloudflare`, `duckdns` or `dynu` have a DDNS updater; the
            type is not checked here, a mismatch surfaces as a sync error on the record.
        proxied:
          type: boolean
          default: false
          description: Cloudflare only.
        ttl:
          type: integer
          default: 1
          description: Anything below 1 (including omitting the field) is stored as 1.
        enabled:
          type: boolean
          default: false
          description: |
            Plain boolean, not a pointer — omitting it creates a **disabled** record that the
            scheduler will skip. Send `true` explicitly to have it synced.
    UpdateDDNSRecord:
      type: object
      description: |
        Partial update. On a record with `proxy_host_id` set, `hostname` and `dns_provider_id`
        are dropped server-side.
      properties:
        hostname:
          type: string
        dns_provider_id:
          type: string
          format: uuid
        proxied:
          type: boolean
          description: Changing this on an enabled record schedules an immediate background re-sync.
        ttl:
          type: integer
          description: Values below 1 are stored as 1. Changing this on an enabled record schedules an immediate background re-sync.
          minimum: 1
        enabled:
          type: boolean
    ImportDDNSFromHostsRequest:
      type: object
      required: [proxy_host_ids, dns_provider_id]
      properties:
        proxy_host_ids:
          type: array
          description: Must contain at least one proxy host UUID.
          items:
            type: string
            format: uuid
        dns_provider_id:
          type: string
          format: uuid
          description: |
            Validated once before any host is touched — the provider must exist and be of type
            `cloudflare`, `duckdns` or `dynu`.
    DDNSSyncResponse:
      type: object
      description: |
        Fixed acknowledgement returned by the DDNS sync and import routes. `success` is always
        true when the status is 200; per-record and per-host outcomes are not reported here.
      properties:
        success:
          type: boolean
        message:
          type: string
    WAFRule:
      type: object
      description: |
        A single OWASP CRS rule as parsed out of the rule files on disk. Rules are
        read from the CRS directory at request time, not from the database.
      properties:
        id:
          type: integer
          description: CRS rule ID, e.g. 942100.
        category:
          type: string
          description: >-
            Short category name derived from the rule ID's thousands block (941 →
            XSS, 942 → SQLI, …). Empty when the block is unknown.
        description:
          type: string
          description: >-
            The rule's `msg:` text; a generated fallback description is used when
            the rule carries none.
        severity:
          type: string
          description: >-
            Declared in the model but never populated by the parser — always
            absent from responses.
        tags:
          type: array
          description: >-
            Declared in the model but never populated by the parser — always
            absent from responses.
          items:
            type: string
        enabled:
          type: boolean
          description: >-
            False when the rule is excluded in the scope being queried. On
            /waf/rules this means host OR global exclusion; on /waf/global/rules
            only global exclusions are considered.
        globally_disabled:
          type: boolean
          description: True when a global exclusion exists for this rule ID.
        exclusion:
          allOf:
            - $ref: '#/components/schemas/WAFRuleExclusion'
          description: >-
            The host-specific exclusion row. Present only when a proxy host was
            supplied and that host excludes this rule.
        global_exclusion:
          allOf:
            - $ref: '#/components/schemas/GlobalWAFRuleExclusion'
          description: The global exclusion row, present only when one exists.
    WAFRuleCategory:
      type: object
      description: One CRS rule file's worth of rules, grouped for display.
      properties:
        id:
          type: string
          description: Thousands block of the rule IDs, e.g. "941".
        name:
          type: string
          description: e.g. "XSS".
        description:
          type: string
        file_name:
          type: string
          description: >-
            Source file the rules were parsed from, e.g.
            REQUEST-941-APPLICATION-ATTACK-XSS.conf. ModSecurity base rules report
            "modsec-base.conf".
        rule_count:
          type: integer
        rules:
          type: array
          items:
            $ref: '#/components/schemas/WAFRule'
    WAFRuleExclusion:
      type: object
      description: A CRS rule switched off for one proxy host.
      properties:
        id:
          type: string
          format: uuid
        proxy_host_id:
          type: string
          description: >-
            Owning proxy host UUID. In merged views a global exclusion is
            represented with the literal value "global".
        rule_id:
          type: integer
        rule_category:
          type: string
        rule_description:
          type: string
        reason:
          type: string
        disabled_by:
          type: string
        created_at:
          type: string
          format: date-time
    GlobalWAFRuleExclusion:
      type: object
      description: A CRS rule switched off for every WAF-enabled host.
      properties:
        id:
          type: string
          format: uuid
        rule_id:
          type: integer
        rule_category:
          type: string
        rule_description:
          type: string
        reason:
          type: string
        disabled_by:
          type: string
          description: Username captured from the request context at disable time.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    DisableWAFRuleByHostRequest:
      type: object
      required: [host, rule_id]
      properties:
        host:
          type: string
          description: >-
            Domain name of the proxy host, as seen in the Host header. A `:port`
            suffix is stripped before the lookup.
        rule_id:
          type: integer
          description: CRS rule ID to disable. Zero or absent is rejected with 400.
        rule_category:
          type: string
          description: Stored on the exclusion and the history row; purely informational.
        rule_description:
          type: string
        reason:
          type: string
    CreateGlobalWAFRuleExclusion:
      type: object
      description: >-
        Optional body for the global disable endpoint. `rule_id` is always taken
        from the path and any value sent here is overwritten.
      properties:
        rule_id:
          type: integer
          description: Ignored — the path parameter wins.
        rule_category:
          type: string
        rule_description:
          type: string
        reason:
          type: string
    WAFPolicyHistory:
      type: object
      description: One disable/enable event on a proxy host's WAF policy.
      properties:
        id:
          type: string
          format: uuid
        proxy_host_id:
          type: string
          format: uuid
        rule_id:
          type: integer
        rule_category:
          type: string
        rule_description:
          type: string
        action:
          type: string
          enum: [disabled, enabled]
        reason:
          type: string
        changed_by:
          type: string
        created_at:
          type: string
          format: date-time
    WAFPolicyHistoryResponse:
      type: object
      properties:
        history:
          type: array
          items:
            $ref: '#/components/schemas/WAFPolicyHistory'
        total:
          type: integer
          description: Total rows for this host, NOT capped by the `limit` parameter.
    GlobalWAFPolicyHistory:
      type: object
      description: One disable/enable event on the global WAF policy.
      properties:
        id:
          type: string
          format: uuid
        rule_id:
          type: integer
        rule_category:
          type: string
        rule_description:
          type: string
        action:
          type: string
          enum: [disabled, enabled]
        reason:
          type: string
        changed_by:
          type: string
          description: >-
            Caller's username on `disabled` rows; always the literal "admin" on
            `enabled` rows, which are written with a hardcoded value.
        created_at:
          type: string
          format: date-time
    GlobalWAFPolicyHistoryResponse:
      type: object
      properties:
        history:
          type: array
          items:
            $ref: '#/components/schemas/GlobalWAFPolicyHistory'
        total:
          type: integer
          description: Total rows, NOT capped by the `limit` parameter.
    GlobalWAFRulesResponse:
      type: object
      properties:
        categories:
          type: array
          items:
            $ref: '#/components/schemas/WAFRuleCategory'
        total_rules:
          type: integer
          description: Sum of the categories' rule_count.
        global_exclusions:
          type: array
          items:
            $ref: '#/components/schemas/GlobalWAFRuleExclusion'
    GlobalWAFExclusionListResponse:
      type: object
      properties:
        exclusions:
          type: array
          items:
            $ref: '#/components/schemas/GlobalWAFRuleExclusion'
        total:
          type: integer
          description: Length of `exclusions` — this endpoint is unpaginated.
    ExploitRuleHostConfig:
      type: object
      properties:
        proxy_host_id:
          type: string
          format: uuid
        proxy_host_name:
          type: string
          description: >-
            First domain name of the host, or the literal "Unnamed Host" when it
            has none.
        block_exploits:
          type: boolean
          description: Always true here — hosts with the feature off are not listed.
        exclusion_count:
          type: integer
          description: Number of host-scoped exploit-rule exclusions on this host.
    ExploitRuleHostsResponse:
      type: object
      properties:
        hosts:
          type: array
          description: >-
            Omitted entirely when no host has exploit blocking enabled — treat a
            missing key as an empty list.
          items:
            $ref: '#/components/schemas/ExploitRuleHostConfig'
        total:
          type: integer
    ExploitRuleWithStatus:
      type: object
      description: |
        An exploit-block rule plus its exclusion status in the queried scope. The
        rule fields are the full `exploit_block_rules` row — note this is the
        accurate field set for that table; it differs from the older `ExploitRule`
        schema in this file.
      properties:
        id:
          type: string
          format: uuid
        category:
          type: string
          enum: [sql_injection, xss, rfi, path_traversal, scanner, http_method, custom]
        name:
          type: string
        pattern:
          type: string
          description: Regex rendered into the generated nginx config.
        pattern_type:
          type: string
          enum: [query_string, request_uri, user_agent, request_method]
          description: >-
            Which part of the request the pattern is matched against. Only
            query_string and request_uri support URI-scoped exclusions.
        description:
          type: string
        severity:
          type: string
          enum: [info, warning, critical]
        enabled:
          type: boolean
          description: >-
            Whether the rule is active in the catalog. Independent of exclusions —
            excluding a rule does not flip this flag.
        is_system:
          type: boolean
          description: Built-in rule; cannot be deleted.
        sort_order:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        globally_disabled:
          type: boolean
          description: At least one global exclusion exists for this rule.
        host_disabled:
          type: boolean
          description: >-
            At least one exclusion exists for this rule on the queried host.
            Omitted when false.
        exclusion:
          allOf:
            - $ref: '#/components/schemas/HostExploitRuleExclusion'
          description: >-
            Representative host-scoped exclusion — the rule-wide one when it
            exists, otherwise one of the URI-scoped ones.
        global_exclusion:
          allOf:
            - $ref: '#/components/schemas/GlobalExploitRuleExclusion'
          description: Representative global exclusion, chosen the same way.
    ExploitRuleCategory:
      type: object
      properties:
        id:
          type: string
          enum: [sql_injection, xss, rfi, path_traversal, scanner, http_method, custom]
        name:
          type: string
          description: Display name, e.g. "SQL Injection".
        description:
          type: string
        rule_count:
          type: integer
        rules:
          type: array
          items:
            $ref: '#/components/schemas/ExploitRuleWithStatus'
    ExploitRuleHostRulesResponse:
      type: object
      description: >-
        Response of GET /exploit-rules/hosts/{hostId}/rules. Categories appear in a
        fixed order and only when they contain at least one rule.
      properties:
        categories:
          type: array
          items:
            $ref: '#/components/schemas/ExploitRuleCategory'
        total_rules:
          type: integer
    HostExploitRuleExclusion:
      type: object
      description: An exploit rule switched off for one proxy host.
      properties:
        id:
          type: string
          format: uuid
        proxy_host_id:
          type: string
          format: uuid
        rule_id:
          type: string
          format: uuid
        uri_pattern:
          type: string
          nullable: true
          description: >-
            URI regex the exclusion is limited to. Absent/null means the rule is
            excluded for the whole host.
        reason:
          type: string
        disabled_by:
          type: string
          description: Username taken from the request context, not from the body.
        created_at:
          type: string
          format: date-time
    GlobalExploitRuleExclusion:
      type: object
      description: An exploit rule switched off on every exploit-blocking host.
      properties:
        id:
          type: string
          format: uuid
        rule_id:
          type: string
          format: uuid
        uri_pattern:
          type: string
          nullable: true
          description: >-
            URI regex the exclusion is limited to. Absent/null means the rule is
            excluded everywhere it would otherwise apply.
        reason:
          type: string
        disabled_by:
          type: string
        created_at:
          type: string
          format: date-time
    ExploitRuleExclusionRequest:
      type: object
      description: >-
        Body shared by the host and global exclude endpoints. Both fields are
        optional; the rule and host are taken from the path.
      properties:
        uri_pattern:
          type: string
          maxLength: 512
          description: >-
            Optional URI regex that scopes the exclusion. Empty or whitespace-only
            is treated as absent (rule-wide exclusion). Rejected with 400 when
            longer than 512 characters, when it contains `$`, `"`, a newline,
            carriage return, tab or NUL, or when it does not compile as a regex.
            Only accepted for rules whose pattern_type is query_string or
            request_uri.
        reason:
          type: string
          description: Free-text note stored on the exclusion.
    ChallengeStats:
      type: object
      description: >-
        CAPTCHA counters over the last 24 hours, except active_tokens which is a
        point-in-time count.
      properties:
        total_challenges:
          type: integer
          description: Log rows with result presented, passed or failed.
        passed_challenges:
          type: integer
        failed_challenges:
          type: integer
        active_tokens:
          type: integer
          description: >-
            Bypass tokens that are not revoked and not yet expired, at any age.
        average_score:
          type: number
          format: float
          description: >-
            Mean reCAPTCHA v3 score over rows that carry one. Omitted when it
            evaluates to zero.
        average_solve_time:
          type: number
          format: float
          description: >-
            Mean solve time over rows that carry one. Omitted when it evaluates to
            zero.
    AuthProvider:
      type: object
      description: |
        A reusable external ForwardAuth verifier that proxy hosts reference to gate
        traffic through nginx `auth_request` (#179).

        NOTHING in this object is masked on read. `config.request_headers[].value`
        is the field that typically carries a shared secret or API key for the
        verifier and it is returned verbatim, as is the resolved `provider_url`.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          enum: [authelia, authentik, custom]
          description: >-
            Verifier flavour. `authelia` and `authentik` are presets whose nginx
            directives are hardcoded — their `config` is stored but ignored.
            `custom` is the only type whose `config` drives the generated
            directives (and the only one validated). Enforced by a database CHECK
            constraint, so an out-of-enum value fails as a 500, not a 400.
        provider_url:
          type: string
          description: >-
            Base URL of the verifier, without a trailing slash. For
            container-backed providers this is the derived
            `scheme://<resolved ip>:<port>` and is rewritten whenever the
            container's IP changes.
        config:
          $ref: '#/components/schemas/AuthProviderConfig'
        timeout_ms:
          type: integer
          default: 5000
        enabled:
          type: boolean
          default: true
        container_name:
          type: string
          nullable: true
          description: >-
            Docker container backing the verify endpoint (#181). Absent for
            manual-URL providers.
        container_network:
          type: string
          nullable: true
        container_port:
          type: integer
          nullable: true
        container_scheme:
          type: string
          nullable: true
          description: Defaults to http when unset.
        last_resolved_ip:
          type: string
          nullable: true
          description: >-
            Read-only reconcile state written by the container scheduler. Absent
            for manual-URL providers.
        last_reconcile_at:
          type: string
          format: date-time
          nullable: true
        last_reconcile_status:
          type: string
          enum: [ok, failed]
          description: Read-only; absent until the scheduler has run.
        last_reconcile_error:
          type: string
          description: Read-only; absent when the last reconcile succeeded.
        reconcile_fail_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AuthProviderConfig:
      type: object
      description: >-
        Custom-provider knobs, stored as jsonb. Validated only when the provider
        type is `custom`; presets ignore every field here. Returned as `{}` when
        nothing was configured.
      properties:
        verify_path:
          type: string
          description: >-
            Appended to provider_url for the auth_request subrequest, e.g.
            /oauth2/auth. Must be a URL path — starts with `/`, no whitespace and
            no `; { } #`.
        request_headers:
          type: array
          description: >-
            proxy_set_header lines emitted in the verify location. Header VALUES
            are stored and returned in clear — this is where a shared secret would
            live.
          items:
            $ref: '#/components/schemas/AuthHeader'
        response_headers:
          type: array
          description: Verifier response headers copied through to the backend.
          items:
            $ref: '#/components/schemas/AuthResponseHeader'
        signin_mode:
          type: string
          enum: [location_header, redirect_template]
          description: Not validated by the model layer; stored as sent.
        signin_redirect:
          type: string
          description: >-
            Redirect template for redirect_template mode. Rejected when it contains
            `;`, `{`, `}`, `#`, or a newline.
        public_paths:
          type: array
          description: >-
            Non-gated callback paths proxied straight to the verifier. Each must be
            a URL path.
          items:
            type: string
        cookie_passthrough:
          type: boolean
          description: Re-emit Set-Cookie from the verifier.
        large_buffers:
          type: boolean
          description: Use larger proxy buffers for oversized auth headers.
    AuthHeader:
      type: object
      description: A request header sent to the verifier.
      properties:
        name:
          type: string
          description: 'Must match ^[A-Za-z0-9-]+$.'
        value:
          type: string
          description: >-
            Rejected when it contains `;`, `{`, `}`, `#` or a newline. Returned in
            clear on read.
    AuthResponseHeader:
      type: object
      description: >-
        Copies a verifier response header into an nginx variable and forwards it to
        the backend.
      properties:
        var:
          type: string
          description: 'nginx variable name without the `$`. Must match ^[A-Za-z0-9_]+$.'
        upstream:
          type: string
          description: >-
            Upstream header name lowercased with underscores, e.g.
            x_auth_request_user. Must match ^[A-Za-z0-9_]+$.
        forward:
          type: string
          description: 'Header name sent to the backend, e.g. X-User. Must match ^[A-Za-z0-9-]+$.'
    CreateAuthProvider:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          maxLength: 255
          description: >-
            The model declares this required but no validator runs in the handler;
            an empty name is accepted and stored.
        type:
          type: string
          enum: [authelia, authentik, custom]
          description: >-
            Not checked in Go — an empty or out-of-enum value reaches the INSERT
            and fails the database CHECK constraint as a 500.
        provider_url:
          type: string
          description: >-
            Required unless a container target is supplied — with `container_name`
            set the service resolves the address and overwrites this value. Must
            start with http:// or https://; a trailing slash is stripped.
        config:
          $ref: '#/components/schemas/AuthProviderConfig'
        timeout_ms:
          type: integer
          default: 5000
          description: A non-positive value falls back to 5000.
        enabled:
          type: boolean
          default: true
        container_name:
          type: string
          description: >-
            Docker container to resolve the verify endpoint from. When set,
            container_port is required.
        container_network:
          type: string
        container_port:
          type: integer
        container_scheme:
          type: string
          description: Defaults to http.
    UpdateAuthProvider:
      type: object
      description: >-
        Partial update — an absent field is left unchanged. There is no way to
        clear `config` back to empty; sending it replaces it.
      properties:
        name:
          type: string
        type:
          type: string
          enum: [authelia, authentik, custom]
        provider_url:
          type: string
          description: >-
            Ignored when a non-empty container_name is sent in the same body, since
            the resolved container address overwrites it.
        config:
          $ref: '#/components/schemas/AuthProviderConfig'
        timeout_ms:
          type: integer
        enabled:
          type: boolean
        container_name:
          type: string
          description: >-
            Non-empty re-resolves the container and rewrites provider_url. An
            explicit EMPTY string clears the container binding and keeps the manual
            provider_url.
        container_network:
          type: string
        container_port:
          type: integer
        container_scheme:
          type: string
    AuthProviderListResponse:
      type: object
      properties:
        data:
          type: array
          description: Never null — an empty page serialises as [].
          items:
            $ref: '#/components/schemas/AuthProvider'
        total:
          type: integer
        page:
          type: integer
        per_page:
          type: integer
        total_pages:
          type: integer
