      properties:
        name:
          type: string
        description:
          type: string
        category:
          type: string
        pattern:
          type: string
        action:
          type: string
          enum: [block, log, challenge]
        enabled:
          type: boolean
          default: true
        severity:
          type: string
          enum: [low, medium, high, critical]
    URIBlockConfig:
      type: object
      description: A proxy host's URI blocking rules.
      properties:
        id:
          type: string
          format: uuid
        proxy_host_id:
          type: string
          format: uuid
        enabled:
          type: boolean
        rules:
          type: array
