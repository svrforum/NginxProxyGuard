    CloneProxyHost:
      type: object
      description: |
        Every field except domain_names is optional; the forward/stream fields
        below fall back to the source host's value when omitted or zero, and all
        other host settings are copied from the source.

        Certificates are the exception: the source's certificate_id is never
        copied. Sending neither certificate_id nor cert_provider produces a
        clone with ssl_enabled false and no certificate. The stream_* fields are
        only consulted when the source host is a stream host.
      required: [domain_names]
      properties:
        domain_names:
          type: array
          items:
            type: string
          minItems: 1
          description: New domain names (or stream labels) for the clone.
        certificate_id:
          type: string
          format: uuid
          nullable: true
          description: Reuse an existing certificate for the clone.
        cert_provider:
          type: string
          enum: [letsencrypt, selfsigned]
          description: |
            Issue a new certificate for the clone instead of reusing one. Only
            `selfsigned` is matched exactly; any other non-empty value is treated
            as letsencrypt (and gets auto_renew). Ignored when certificate_id is
            set or the source is a stream host. Issuance failure is logged and
            does NOT fail the clone — the host is then created without SSL.
        dns_provider_id:
          type: string
          format: uuid
          nullable: true
          description: DNS provider used for a Let's Encrypt DNS-01 challenge when cert_provider is letsencrypt.
        forward_scheme:
          type: string
          enum: [http, https, tcp, udp]
        forward_host:
          type: string
        forward_port:
          type: integer
        forward_container_name:
          type: string
          nullable: true
        forward_container_network:
          type: string
          nullable: true
        stream_listen_host:
          type: string
        stream_listen_port:
          type: integer
        stream_protocol:
          type: string
          enum: [tcp, udp]
    ProxyHostSyncResult:
      type: object
      properties:
        total_hosts:
