# nginx-guard generated config
# Proxy Host ID: 00000000-0000-0000-0000-000000000a06
# Domain(s): challenge.example.com
# WAF: disabled
# HTTP/3: disabled
# Access List: none
# Geo Restriction: blacklist (1 countries)
# Rate Limit: none
# Upstream: none
# Generated at: auto-generated










# Direct-forward upstream (keepalive connection pool to the backend)
# proxy_params.conf already sets the prerequisites: proxy_http_version 1.1 +
# empty Connection header. WebSocket hosts override Connection per-location
# with $connection_upgrade and simply don't benefit from the pool.
upstream npg_direct_00000000_0000_0000_0000_000000000a06 {
    server 127.0.0.1:8080;
    keepalive 32;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}



server {
    listen 80;
    listen [::]:80;
    server_name challenge.example.com;

    # Initialize tracking variables
    set $block_reason_var "-";
    set $bot_category_var "-";
    set $geo_blocked 0;
    set $is_search_bot 0;

    # NPM-compatible variables for custom config
    set $forward_scheme http;
    set $server "127.0.0.1";
    set $port 8080;

    # Shared host stanza: resolver, ACME/challenge skip vars, custom error pages
    include /etc/nginx/conf.d/includes/host_common.conf;



    # ACME HTTP-01 Challenge support (bypass all security checks)
    location /.well-known/acme-challenge/ {
        # Allow all access for certificate validation
        allow all;
        auth_request off;
        root /etc/nginx/acme-challenge;
        try_files $uri =404;
    }




    # WAF disabled for this host (override global modsecurity on)
    modsecurity off;



    # Geo Restriction (blacklist) - Challenge Mode (processed AFTER WAF)
    # Challenge mode: show CAPTCHA instead of blocking
    # This only marks the request. @challenge_redirect sets the block reason
    # when it refuses: a visitor who passes the challenge is not blocked.
    set $geo_blocked 0;

    if ($geoip2_country_code ~ "^(CN)$") {
        set $geo_blocked 1;
    }


























    # Challenge validation endpoint (internal)
    location = /_challenge/validate {
        internal;
        # The 401 below must reach auth_request as a plain 401. Inheriting a
        # server-level "error_page 401 = @challenge_redirect" would turn it
        # into a 302, which auth_request treats as an error (500), and
        # location /'s "error_page 500 = @api_fallback" would then let the
        # request through. Any error_page defined here stops the inheritance.
        error_page 401 = @challenge_gate_deny;
        # Every other error the API answers with refuses as well.
        # auth_request turns a status other than 2xx, 401 and 403 into a
        # 500, which location / hands to @api_fallback, the pass-through for
        # an API that cannot be reached: a running API's 4xx (a request
        # header it rejects, its rate limit) or 500 must not get there. Only
        # an API that cannot be reached or does not answer in time (502, 503,
        # 504) still leaves location / open.
        proxy_intercept_errors on;
        error_page 400 404 405 408 413 429 431 500 = @challenge_gate_deny;
        # nginx decides who is challenged; the API only checks tokens.
        # $geo_blocked is already 0 for allowed countries, private, priority
        # and trusted IPs and, when the host allows them, search bots
        # (_security). Not challenged (an explicit 0 only): allowed here with
        # no API round-trip. Challenged without a token: 401 here, which the
        # caller's error_page 401 turns into the challenge redirect. Only a
        # challenged visitor carrying a token reaches the API.
        if ($geo_blocked = 0) {
            return 204;
        }
        if ($cookie_ng_challenge = "") {
            return 401;
        }
        proxy_pass http://127.0.0.1:9080/api/v1/challenge/validate;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Proxy-Host-ID "00000000-0000-0000-0000-000000000a06";
        proxy_set_header X-Challenge-Token $cookie_ng_challenge;
        # Only a challenged visitor gets here. A constant, so no header the
        # client sends can make the API skip the token check.
        proxy_set_header X-Geo-Blocked 1;
        # Fast timeout - fail fast if API is down
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    # Plain 401 for the gate subrequest (see /_challenge/validate).
    location @challenge_gate_deny {
        return 401;
    }

    # API error fallback - allow traffic through when API is down
    location @api_fallback {
        auth_request off;
        # Only for the gate's own failure: the API's answer (502, 503, 504)
        # is then in $challenge_gate_status. Empty means the gate never asked
        # the API, so this 500 came from somewhere else: not passed on.
        if ($challenge_gate_status = "") {
            return 500;
        }
        # API is down - allow request to proceed (graceful degradation)
        # Log this event for monitoring
        access_log /etc/nginx/logs/access_raw.log main buffer=64k flush=5s;
        proxy_pass http://npg_direct_00000000_0000_0000_0000_000000000a06;
        # Direct-forward upstream is an upstream group name, so `proxy_redirect
        # default` can't derive the backend URL — rewrite backend Location/Refresh explicitly.
        proxy_redirect http://127.0.0.1:8080/ /;
        include /etc/nginx/includes/proxy_params.conf;
    }

    # nginx checks tokens through the internal /_challenge/validate location;
    # nothing outside needs this path, and answering it would tell anyone
    # whether a token is valid.
    location = /api/v1/challenge/validate {
        return 404;
    }

    # The challenge page is not access-logged: it is NPG's own answer to a
    # request that was already logged (the 302 carrying block_reason), and
    # on a challenged host under attack it was a large share of all rows.
    # verify, verify-redirect and favicon stay logged (prefix location).
    location = /api/v1/challenge/page {
        access_log off;
        auth_request off;
        modsecurity off;

        proxy_pass http://127.0.0.1:9080/api/v1/challenge/page;
        proxy_pass_request_body on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Challenge API - Bypass GeoIP and proxy to API service (HTTP server block)
    location /api/v1/challenge/ {
        auth_request off;
        modsecurity off;

        proxy_pass http://127.0.0.1:9080/api/v1/challenge/;
        proxy_pass_request_body on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }






    # Challenge gate for every location of this server: the generated
    # location / and any location from Advanced Config alike. NPG's own
    # pass-through locations (ACME, /api/v1/challenge/, @api_fallback and
    # the error pages) opt out with "auth_request off".
    auth_request /_challenge/validate;
    # The API's answer to the gate (empty when the gate answered itself),
    # so @challenge_redirect can tell the gate's 401 from any other.
    auth_request_set $challenge_gate_status $upstream_status;
    error_page 401 = @challenge_redirect;


    location / {

        # Challenge decision happens inside the /_challenge/validate gate, which
        # runs as an auth_request subrequest (ACCESS phase) - so ModSecurity
        # phase 2 inspects the request BEFORE any challenge redirect. A
        # rewrite-phase `return 302` here would silently skip phase 2.
        # The gate answers locally for everyone except a challenged visitor
        # carrying a token; search bots the host allows were already cleared
        # from $geo_blocked by _security.
        auth_request /_challenge/validate;
        error_page 401 = @challenge_redirect;
        # Only the gate's own failure lets the request through: auth_request
        # answers 500 when the API cannot be reached or does not answer in
        # time. A 503 from the rate or connection limit comes before the gate
        # and must not reach @api_fallback, which skips it.
        error_page 500 = @api_fallback;
        # An error_page here replaces all of the server's: repeated below.
        error_page 502 /error_502.html;
        error_page 503 /error_503.html;
        error_page 504 /error_504.html;
        error_page 403 @blocked;


        proxy_pass http://npg_direct_00000000_0000_0000_0000_000000000a06;
        # Direct-forward upstream is an upstream group name, so `proxy_redirect
        # default` can't derive the backend URL — rewrite backend Location/Refresh explicitly.
        proxy_redirect http://127.0.0.1:8080/ /;
        include /etc/nginx/includes/proxy_params.conf;
        
        # Proxy settings (Host-level overrides Global)
        
        
        
        
        
        
        
        
        # Proxy buffer settings (from Global Settings)
        
        
        
        
        
        # Bandwidth limiting (from Global Settings)
        
        
        
        
        

    }


    location @challenge_redirect {
        # Only the gate's own 401 means "solve the challenge": a challenged
        # visitor without a token, or one whose token the API rejected. Any
        # other 401 (Basic auth in a custom location, say, which nginx checks
        # before the gate) stays a 401. Both answers refuse the request.
        # The block reason is set here, on the redirect: _security only marks
        # the request, and a visitor who passes the gate is not blocked.
        if ($geo_blocked = 0) {
            return 401;
        }
        set $challenge_refused 401;
        if ($cookie_ng_challenge != "") {
            set $challenge_refused $challenge_gate_status;
        }
        if ($challenge_refused != 401) {
            return 401;
        }
        set $block_reason_var "geo_block";
        return 302 /api/v1/challenge/page?host=00000000-0000-0000-0000-000000000a06&reason=geo_restriction&return=$scheme://$host$request_uri;
    }








}



