version: 2
updates:
  # Go modules (API server)
  - package-ecosystem: "gomod"
    directory: "/api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      go-minor-patch:
        update-types: ["minor", "patch"]

  # npm (admin UI)
  - package-ecosystem: "npm"
    directory: "/ui"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  # Dockerfiles (base images)
  - package-ecosystem: "docker"
    directory: "/api"
    schedule:
      interval: "weekly"
    ignore:
      # Go release candidates. Dependabot ranks 1.27rc2 above 1.26.5 and offered
      # it as an upgrade (#245), which would have built the images users run on a
      # toolchain Go labels unstable — and stepped away from the 1.26.6 security
      # fixes at the same time, since RC tags are frozen rather than patched.
      # Stable patch bumps on the 1.x line still come through.
      - dependency-name: "golang"
        versions: ["*rc*", "*beta*", "*alpha*"]
  - package-ecosystem: "docker"
    directory: "/ui"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/nginx"
    schedule:
      interval: "weekly"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
