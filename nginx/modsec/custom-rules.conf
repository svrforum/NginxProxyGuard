# nginx-proxy-guard Custom ModSecurity Rules
# Add your custom rules here

# -----------------------------------------------------------------------------
# Path-scoped engine exemptions (health check, Socket.IO)
#
# These turn the WAF OFF for their endpoints, so they are decided on the
# NORMALIZED request path (REQUEST_FILENAME after t:none,t:normalizePath), NOT
# on the raw REQUEST_URI. Keyed on REQUEST_URI the match was a raw byte prefix,
# so a path that only STARTED like one of these -- "/health/../", with the dots
# left for the upstream to resolve to "/" -- was handed the same full exemption
# and reached the upstream with no inspection at all. On the normalized path the
# exemption covers only what nginx actually routes to the real endpoint.
#
# Each rule keeps its original prefix semantics on that normalized path: "\A/health"
# (no trailing boundary) still covers "/healthz" and "/health/ready", exactly as
# the old "@beginsWith /health" did.
#
# The chained SecRule then keeps the engine ON for any path a backend may still
# resolve somewhere else -- a dot segment, "..;", a backslash, %2e/%2f left from
# a second encoding, control bytes -- that t:normalizePath does not fold away.
# Its regex is IDENTICAL to the API's unsafePathGuard() (unsafeRequestPathPattern
# in api/internal/nginx), the same guard the generated per-host WAF exclusions
# use; TestCustomRulesPathExemptionsUseNormalizedGuard pins the two so they
# cannot drift apart.
# -----------------------------------------------------------------------------

# Allow health check endpoints
SecRule REQUEST_FILENAME "@rx \A/health" \
    "id:1000,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    t:normalizePath,\
    chain"
    SecRule REQUEST_FILENAME "!@rx (?i)(?:[\x00-\x1f\x7f]|(?:\A|(?:/|\x5c|%(?:25){0,2}(?:2f|5c|u002f|u005c)|\xc0\xaf|\xc1\x9c|\xe0\x80\xaf|\xe0\x81\x9c|\xf0\x80\x80\xaf|\xf0\x80\x81\x9c))(?:\.|%(?:25){0,2}(?:2e|u002e)|\xc0\xae|\xe0\x80\xae|\xf0\x80\x80\xae)(?:(?:\.|%(?:25){0,2}(?:2e|u002e)|\xc0\xae|\xe0\x80\xae|\xf0\x80\x80\xae)|(?:\x20|%(?:25){0,2}20)){0,16}(?:(?:/|\x5c|%(?:25){0,2}(?:2f|5c|u002f|u005c)|\xc0\xaf|\xc1\x9c|\xe0\x80\xaf|\xe0\x81\x9c|\xf0\x80\x80\xaf|\xf0\x80\x81\x9c)|(?:;|%(?:25){0,2}3b)|\z))" "t:none,ctl:ruleEngine=Off"

# Note: localhost ruleEngine override removed
# WAF mode is now controlled per-host via nginx-proxy-guard settings

# Allow Socket.IO requests - disable WAF completely for socket.io paths
# Socket.IO uses text/plain content-type which is blocked by rule 920420
SecRule REQUEST_FILENAME "@rx \A/socket\.io" \
    "id:1002,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    t:normalizePath,\
    chain"
    SecRule REQUEST_FILENAME "!@rx (?i)(?:[\x00-\x1f\x7f]|(?:\A|(?:/|\x5c|%(?:25){0,2}(?:2f|5c|u002f|u005c)|\xc0\xaf|\xc1\x9c|\xe0\x80\xaf|\xe0\x81\x9c|\xf0\x80\x80\xaf|\xf0\x80\x81\x9c))(?:\.|%(?:25){0,2}(?:2e|u002e)|\xc0\xae|\xe0\x80\xae|\xf0\x80\x80\xae)(?:(?:\.|%(?:25){0,2}(?:2e|u002e)|\xc0\xae|\xe0\x80\xae|\xf0\x80\x80\xae)|(?:\x20|%(?:25){0,2}20)){0,16}(?:(?:/|\x5c|%(?:25){0,2}(?:2f|5c|u002f|u005c)|\xc0\xaf|\xc1\x9c|\xe0\x80\xaf|\xe0\x81\x9c|\xf0\x80\x80\xaf|\xf0\x80\x81\x9c)|(?:;|%(?:25){0,2}3b)|\z))" "t:none,ctl:ruleEngine=Off"

# Allow common WebSocket upgrade requests
SecRule REQUEST_HEADERS:Upgrade "@streq websocket" \
    "id:1003,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleEngine=Off"

# =============================================================================
# Rule Exclusions for common false positives
# =============================================================================

# Note: Rule 932260 exclusion for Supabase cookies is handled in main.conf
# using SecRuleUpdateTargetById for more precise targeting (excludes only
# specific cookie patterns instead of disabling the entire rule)

# =============================================================================
# HTTP/3 (QUIC) Compatibility Rules
# =============================================================================

# HTTP/3 uses :authority pseudo-header instead of Host header
# ModSecurity does not recognize this yet, causing false positives for rule 920280
# Only skip this rule for HTTP/3 requests (HTTP version 3.x)
# HTTP/1.1 and HTTP/2 requests without Host header will still be detected
SecRule REQUEST_PROTOCOL "@rx ^HTTP/3" \
    "id:1010,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveById=920280"
